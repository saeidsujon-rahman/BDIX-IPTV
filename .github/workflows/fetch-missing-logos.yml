name: Fetch Missing Channel Logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and download missing logos
        run: python3 scripts/fetch_missing_logos.py

      - name: Commit logos and playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/ "IPTV Playlist.m3u" logo-fetch-report.md
          if git diff --cached --quiet; then
            echo "No logo changes found."
            exit 0
          fi
          git commit -m "Fetch missing channel logos"
          git push

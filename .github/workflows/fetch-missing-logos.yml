name: Fetch Missing Channel Logos

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_missing_logos.py'

permissions:
  contents: write

# Serialize every workflow that writes to the repository.
concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  fetch-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and download missing logos
        run: python3 scripts/fetch_missing_logos.py

      - name: Commit logos and playlist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/ "IPTV Playlist.m3u" reports/logo-fetch-report.md
          if git diff --cached --quiet; then
            echo "No logo changes found."
            exit 0
          fi
          git commit -m "Fetch missing channel logos"
          git push origin HEAD:main

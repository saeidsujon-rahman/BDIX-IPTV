name: Generate EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

# Serialize all workflows that write to main.
concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  generate:
    if: vars.EPG_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source permissions before any guide requests
        run: python epg/validate.py policy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned generator
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iptv-org/epg.git "$RUNNER_TEMP/epg-generator"
          git -C "$RUNNER_TEMP/epg-generator" checkout 335458005387e07417a98399eb423c78d62a3bd9
          cd "$RUNNER_TEMP/epg-generator"
          npm ci
      - name: Generate two-day pilot guide
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/epg-generator"
          npm run grab -- --channels="$GITHUB_WORKSPACE/epg/channels.xml" --output="$RUNNER_TEMP/pilot-guide.xml" --days=2 --maxConnections=1 --delay=1000
      - name: Validate and prepare publication
        run: python epg/validate.py publish --guide="$RUNNER_TEMP/pilot-guide.xml" --repository="$GITHUB_REPOSITORY"
      - name: Commit validated guide and header
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EPG Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add epg.xml.gz 'IPTV Playlist.m3u'
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated EPG'
            git push origin HEAD:main
          fi

name: Repository-first IPTV logos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'logos/**'
      - 'scripts/sync_logos.py'
      - '.github/workflows/logo-priority.yml'

permissions:
  contents: write

# Serialize every workflow that writes to main.
concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply repository-first logos without changing streams or groups
        run: python scripts/sync_logos.py
      - name: Commit logo URLs if changed
        run: |
          set -euo pipefail
          git config user.name 'IPTV Update Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- 'IPTV Playlist.m3u'
          if git diff --cached --quiet; then
            echo 'No logo URL changes.'
            exit 0
          fi
          git commit -m 'bot: prefer repository logos with external fallback'
          git push origin HEAD:main

          # ============================================================================
          # General helpers
          # ============================================================================

          def atomic_write(path: Path, text: str) -> None:
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              tmp = path.with_name(
                  path.name + ".tmp"
              )

              tmp.write_text(
                  text,
                  encoding="utf-8",
              )

              tmp.replace(path)


          def fetch(
              url: str,
              attempts: int = 3,
          ) -> str:

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "SaeidRahman-IPTV-Updater/7.0",
                      "Accept": "*/*",
                  },
              )

              last_error: Exception | None = None

              for attempt in range(
                  1,
                  attempts + 1,
              ):

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=40,
                      ) as response:

                          text = response.read().decode(
                              "utf-8-sig",
                              errors="replace",
                          )

                          print(
                              f"Fetched {url} "
                              f"({len(text):,} characters)"
                          )

                          return text

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      OSError,
                  ) as exc:

                      last_error = exc

                      print(
                          f"Attempt {attempt}/{attempts} "
                          f"failed for {url}: {exc}"
                      )

                      if attempt < attempts:
                          time.sleep(
                              5 * attempt
                          )

              raise SystemExit(
                  f"Could not fetch {url} after "
                  f"{attempts} attempts: {last_error}"
              )


          def valid_stream_url(
              url: str,
          ) -> bool:

              return url.strip().lower().startswith(
                  (
                      "http://",
                      "https://",
                      "rtmp://",
                      "rtsp://",
                      "udp://",
                      "rtp://",
                  )
              )


          def normalize_phrase(
              text: str,
          ) -> str:

              text = unicodedata.normalize(
                  "NFKD",
                  text,
              ).lower()

              text = re.sub(
                  r"[^a-z0-9+]+",
                  " ",
                  text,
              )

              return " ".join(
                  text.split()
              )


          def contains_phrase(
              text: str,
              phrases,
          ) -> bool:
              """
              Whole-word / whole-phrase matching.

              Prevents NTV matching MNTV.
              """

              normalized = (
                  " "
                  + normalize_phrase(text)
                  + " "
              )

              for phrase in phrases:

                  p = normalize_phrase(
                      phrase
                  )

                  if not p:
                      continue

                  if (
                      " "
                      + p
                      + " "
                  ) in normalized:

                      return True

              return False


          def adult_match(
              text: str,
          ) -> bool:
              """
              More flexible Adult detector.

              Handles spelling/format variations while avoiding extremely
              generic terms such as "hot" or "passion".
              """

              low = unicodedata.normalize(
                  "NFKD",
                  text,
              ).lower()

              low = low.replace(
                  "_",
                  " ",
              )

              patterns = (
                  r"\badults?\b",
                  r"\bxxx\b",
                  r"\b18\s*\+?\b",
                  r"\b18\s*plus\b",
                  r"\beroti(?:c|ca|k)\b",
                  r"\bsex(?:y)?\b",
                  r"\bporn(?:o|star)?\b",
                  r"\bplayboy\b",
                  r"\bpenthouse\b",
                  r"\bbrazzers\b",
                  r"\bhustler\b",
                  r"\bblue\s+hustler\b",
                  r"\bred\s*light\b",
                  r"\bprivate(?:\s+tv|\s+spice)?\b",
                  r"\bdorcel\b",
                  r"\bvivid(?:\s+red)?\b",
                  r"\breality\s+kings\b",
                  r"\bbang\s*bros\b",
                  r"\bdigital\s+playground\b",
                  r"\bbabes?\b",
                  r"\bmature\b",
              )

              return any(
                  re.search(
                      pattern,
                      low,
                      flags=re.I,
                  )
                  for pattern in patterns
              )


          def parse_m3u(
              text: str,
          ) -> list[dict]:

              entries: list[dict] = []

              current = None
              extras: list[str] = []

              for raw in text.splitlines():

                  line = raw.strip()

                  if line.startswith(
                      "#EXTINF"
                  ):

                      attrs = dict(
                          re.findall(
                              r'([\w-]+)="([^"]*)"',
                              line,
                          )
                      )

                      if "," in line:

                          name = line.rsplit(
                              ",",
                              1,
                          )[-1].strip()

                      else:

                          name = attrs.get(
                              "tvg-name",
                              "",
                          ).strip()

                      current = {
                          "attrs": attrs,
                          "name": name,
                          "url": None,
                          "extras": [],
                      }

                      extras = []

                  elif current and (
                      not line
                      or line.startswith("#")
                  ):

                      extras.append(
                          raw
                      )

                  elif current and line:

                      current[
                          "url"
                      ] = line

                      current[
                          "extras"
                      ] = extras[:]

                      if (
                          current["name"]
                          and current["url"]
                          and valid_stream_url(
                              current["url"]
                          )
                      ):

                          entries.append(
                              current
                          )

                      current = None
                      extras = []

              return entries


          def extract_header_lines(
              text: str,
          ) -> list[str]:

              result: list[str] = []

              for raw in text.splitlines():

                  line = raw.strip()

                  if line.startswith(
                      "#EXTINF"
                  ):
                      break

                  if not line:
                      continue

                  line = line.lstrip(
                      "\ufeff"
                  )

                  if line.startswith(
                      "#PLAYLIST-STUDIO-NAME:"
                  ):
                      continue

                  if line.startswith(
                      "#PLAYLIST-STUDIO-CATEGORIES:"
                  ):
                      continue

                  result.append(
                      line
                  )

              if (
                  not result
                  or not result[0].startswith(
                      "#EXTM3U"
                  )
              ):

                  result.insert(
                      0,
                      "#EXTM3U",
                  )

              return result


          def strip_backup(
              name: str,
          ) -> str:

              return re.sub(
                  r"\s*\[Backup\s*\d+\]\s*$",
                  "",
                  name,
                  flags=re.I,
              ).strip()


          def backup_number(
              name: str,
          ) -> int:

              match = re.search(
                  r"\[Backup\s*(\d+)\]\s*$",
                  name,
                  flags=re.I,
              )

              return (
                  int(
                      match.group(1)
                  )
                  if match
                  else 0
              )


          def preferred_name(
              name: str,
          ) -> str:

              clean = strip_backup(
                  name
              )

              return ALIASES.get(
                  clean.lower(),
                  clean,
              )


          def normalize(
              name: str,
          ) -> str:

              name = preferred_name(
                  name
              )

              name = unicodedata.normalize(
                  "NFKD",
                  name,
              ).lower()

              name = name.replace(
                  "&",
                  " and ",
              )

              name = re.sub(
                  r"\b(fhd|uhd|hd|sd|4k|1080p|720p)\b",
                  " ",
                  name,
              )

              name = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  name,
              )

              return " ".join(
                  name.split()
              )


          def is_blocked(
              url: str,
              existing: bool = False,
          ) -> bool:

              low = url.lower()

              domains = (
                  BLOCKED_EXISTING
                  if existing
                  else BLOCKED_NEW
              )

              if any(
                  domain in low
                  for domain in domains
              ):

                  return True


              # Expired signed URLs.
              match = re.search(
                  r"(?:[?&])e=(\d{10})(?:&|$)",
                  url,
              )

              if match:

                  try:

                      if (
                          int(
                              match.group(1)
                          )
                          < int(
                              time.time()
                          )
                      ):

                          return True

                  except ValueError:
                      pass


              return False


          # ============================================================================
          # Matching helpers
          # ============================================================================

          def clean_source_name(
              name: str,
          ) -> str:

              name = strip_backup(
                  name
              )

              name = re.sub(
                  r"\[(?:"
                  r"hd|fhd|uhd|sd|4k|1080p|720p|"
                  r"bd|bdix|india|indian|backup|live"
                  r")\]",
                  " ",
                  name,
                  flags=re.I,
              )

              name = re.sub(
                  r"\b(?:"
                  r"HD|FHD|UHD|SD|4K|1080P|720P|BDIX"
                  r")\b",
                  " ",
                  name,
                  flags=re.I,
              )

              return " ".join(
                  name.split()
              )


          def normalized_tokens(
              name: str,
          ) -> list[str]:

              name = preferred_name(
                  clean_source_name(
                      name
                  )
              )

              text = unicodedata.normalize(
                  "NFKD",
                  name,
              ).lower()

              text = text.replace(
                  "&",
                  " and ",
              )

              text = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  text,
              )

              return [
                  token
                  for token in text.split()
                  if token not in QUALITY_WORDS
              ]


          def channel_signature(
              name: str,
          ) -> str:

              tokens = normalized_tokens(
                  name
              )

              reduced = [
                  token
                  for token in tokens
                  if token
                  not in GENERIC_NAME_WORDS
              ]

              if not reduced:

                  return " ".join(
                      tokens
                  )


              # Don't reduce Channel 24 to only 24.
              if all(
                  token.isdigit()
                  for token in reduced
              ):

                  return " ".join(
                      tokens
                  )


              return " ".join(
                  reduced
              )


          def token_similarity(
              a: str,
              b: str,
          ) -> float:

              a_tokens = set(
                  normalized_tokens(
                      a
                  )
              )

              b_tokens = set(
                  normalized_tokens(
                      b
                  )
              )

              if (
                  not a_tokens
                  or not b_tokens
              ):

                  return 0.0

              intersection = len(
                  a_tokens
                  & b_tokens
              )

              union = len(
                  a_tokens
                  | b_tokens
              )

              return (
                  intersection / union
                  if union
                  else 0.0
              )


          def text_similarity(
              a: str,
              b: str,
          ) -> float:

              return SequenceMatcher(
                  None,
                  normalize(a),
                  normalize(b),
              ).ratio()


          # ============================================================================
          # Classification
          # ============================================================================

          def guess_group(
              name: str,
              source_group: str,
          ) -> str | None:

              g = (
                  source_group
                  or ""
              ).strip()

              gl = g.lower()
              nl = name.lower()


              # Already valid category.
              if g in GROUP_ORDER:
                  return g


              # ------------------------------------------------------------------------
              # Adult
              #
              # Check BOTH channel name and source group.
              # ------------------------------------------------------------------------

              if (
                  adult_match(
                      name
                  )
                  or adult_match(
                      source_group
                  )
                  or contains_phrase(
                      nl,
                      ADULT_NAME_HINTS,
                  )
                  or contains_phrase(
                      gl,
                      ADULT_GROUP_HINTS,
                  )
              ):

                  return "Adult"


              # ------------------------------------------------------------------------
              # Bangladesh
              # ------------------------------------------------------------------------

              if (
                  "bangladesh" in gl
                  or gl in {
                      "bd",
                      "bangladesh tv",
                  }
                  or contains_phrase(
                      nl,
                      BANGLADESH_NAMES,
                  )
              ):

                  return "Bangladesh"


              # ------------------------------------------------------------------------
              # Indian Bangla
              # ------------------------------------------------------------------------

              if contains_phrase(
                  nl,
                  INDIAN_BANGLA,
              ):

                  return "Indian Bangla"


              if (
                  gl in {
                      "bangla",
                      "bengali",
                  }
                  or "bangla" in gl
                  or "bengali" in gl
              ):

                  if not contains_phrase(
                      nl,
                      BANGLADESH_NAMES,
                  ):

                      return "Indian Bangla"


              # ------------------------------------------------------------------------
              # Sports
              # ------------------------------------------------------------------------

              if (
                  "sport" in gl
                  or "sport" in nl
                  or "cricket" in nl
                  or contains_phrase(
                      nl,
                      SPORTS_NAMES,
                  )
              ):

                  return "Sports"


              # ------------------------------------------------------------------------
              # Kids before Documentary
              # ------------------------------------------------------------------------

              if (
                  "kid" in gl
                  or contains_phrase(
                      nl,
                      KIDS_NAMES,
                  )
              ):

                  return "Kids"


              # ------------------------------------------------------------------------
              # Religious
              # ------------------------------------------------------------------------

              if (
                  "relig" in gl
                  or contains_phrase(
                      nl,
                      RELIGIOUS_NAMES,
                  )
              ):

                  return "Religious"


              # ------------------------------------------------------------------------
              # Documentary & Wildlife
              # ------------------------------------------------------------------------

              if (
                  "document" in gl
                  or "wildlife" in gl
                  or contains_phrase(
                      nl,
                      DOCUMENTARY_NAMES,
                  )
              ):

                  return (
                      "Documentary & Wildlife"
                  )


              # ------------------------------------------------------------------------
              # News & Weather
              # ------------------------------------------------------------------------

              if (
                  "news" in gl
                  or "weather" in gl
                  or contains_phrase(
                      nl,
                      NEWS_WEATHER_NAMES,
                  )
              ):

                  return "News & Weather"


              # ------------------------------------------------------------------------
              # Indian / Hindi
              # ------------------------------------------------------------------------

              if gl in {
                  "india",
                  "indian",
                  "hindi",
              }:

                  if contains_phrase(
                      nl,
                      (
                          "music",
                          "mtv",
                          "9xm",
                          "zoom",
                          "sangeet",
                      ),
                  ):

                      return "Indian Music"


                  if contains_phrase(
                      nl,
                      (
                          "movie",
                          "movies",
                          "cinema",
                          "cineplex",
                      ),
                  ):

                      return "Indian Movies"


                  return (
                      "Indian Entertainment"
                  )


              if (
                  "indian movie" in gl
                  or "hindi movie" in gl
              ):

                  return "Indian Movies"


              if (
                  "indian music" in gl
                  or "hindi music" in gl
              ):

                  return "Indian Music"


              if (
                  "indian entertainment" in gl
                  or "hindi entertainment" in gl
              ):

                  return (
                      "Indian Entertainment"
                  )


              # ------------------------------------------------------------------------
              # International
              # ------------------------------------------------------------------------

              if (
                  "movie" in gl
                  or "movies" in gl
                  or "cinema" in gl
              ):

                  return (
                      "International Movies"
                  )


              if "music" in gl:

                  return (
                      "International Music"
                  )


              # ------------------------------------------------------------------------
              # Final Adult fallback
              # ------------------------------------------------------------------------

              if (
                  adult_match(
                      nl
                  )
                  or adult_match(
                      gl
                  )
              ):

                  return "Adult"


              return None


          def confident_existing_group(
              name: str,
          ) -> str | None:

              nl = name.lower()


              if adult_match(
                  nl
              ):

                  return "Adult"


              if contains_phrase(
                  nl,
                  BANGLADESH_NAMES,
              ):

                  return "Bangladesh"


              if contains_phrase(
                  nl,
                  INDIAN_BANGLA,
              ):

                  return "Indian Bangla"


              if (
                  "sport" in nl
                  or "cricket" in nl
                  or contains_phrase(
                      nl,
                      SPORTS_NAMES,
                  )
              ):

                  return "Sports"


              # Kids before Documentary.
              if contains_phrase(
                  nl,
                  KIDS_NAMES,
              ):

                  return "Kids"


              if contains_phrase(
                  nl,
                  RELIGIOUS_NAMES,
              ):

                  return "Religious"


              if contains_phrase(
                  nl,
                  DOCUMENTARY_NAMES,
              ):

                  return (
                      "Documentary & Wildlife"
                  )


              if contains_phrase(
                  nl,
                  NEWS_WEATHER_NAMES,
              ):

                  return "News & Weather"


              return None


          def group_compatible(
              source_group: str | None,
              target_group: str | None,
          ) -> bool:

              if (
                  not source_group
                  or not target_group
              ):

                  return True

              return (
                  source_group
                  == target_group
              )


          # ============================================================================
          # EXTINF serialization
          # ============================================================================

          def serialize_extinf(
              entry: dict,
              chno: int,
          ) -> str:

              attrs = dict(
                  entry["attrs"]
              )

              attrs[
                  "tvg-name"
              ] = entry[
                  "name"
              ]

              attrs[
                  "tvg-chno"
              ] = str(
                  chno
              )

              attrs[
                  "group-title"
              ] = entry[
                  "group"
              ]


              if entry[
                  "logo"
              ]:

                  attrs[
                      "tvg-logo"
                  ] = entry[
                      "logo"
                  ]

              else:

                  attrs.pop(
                      "tvg-logo",
                      None,
                  )


              order = [
                  "tvg-id",
                  "tvg-name",
                  "tvg-logo",
                  "tvg-chno",
                  "tvg-language",
                  "tvg-country",
                  "group-title",
              ]


              parts: list[str] = []


              for key in order:

                  value = attrs.get(
                      key,
                      "",
                  )

                  if value != "":

                      parts.append(
                          f'{key}="{value}"'
                      )


              for (
                  key,
                  value,
              ) in attrs.items():

                  if (
                      key not in order
                      and value != ""
                  ):

                      parts.append(
                          f'{key}="{value}"'
                      )


              return (
                  "#EXTINF:-1 "
                  + " ".join(
                      parts
                  )
                  + ","
                  + entry[
                      "name"
                  ]
              )


          # ============================================================================
          # Load master
          # ============================================================================

          if not MASTER.exists():

              raise SystemExit(
                  f"Master playlist not found: "
                  f"{MASTER}"
              )


          original_master_text = (
              MASTER.read_text(
                  encoding="utf-8-sig",
                  errors="replace",
              )
          )


          master_header = (
              extract_header_lines(
                  original_master_text
              )
          )


          master_raw = parse_m3u(
              original_master_text
          )


          if not master_raw:

              raise SystemExit(
                  f"Refusing to continue: parsed 0 channels "
                  f"from {MASTER}."
              )


          print(
              f"Master loaded: "
              f"{len(master_raw)} stream entries"
          )


          # ============================================================================
          # Fetch sources
          # ============================================================================

          print(
              "Fetching source playlists..."
          )


          merge_raw = parse_m3u(
              fetch(
                  MERGE_SOURCE
              )
          )


          lookup_raw = parse_m3u(
              fetch(
                  LOOKUP_SOURCE
              )
          )


          print(
              f"Merge source: "
              f"{len(merge_raw)} entries"
          )


          print(
              f"Lookup source: "
              f"{len(lookup_raw)} entries"
          )


          # ============================================================================
          # Existing master cleanup
          # ============================================================================

          master: list[
              dict
          ] = []


          cleaned_existing: list[
              tuple[
                  str,
                  str,
              ]
          ] = []


          corrected_groups: list[
              tuple[
                  str,
                  str,
                  str,
              ]
          ] = []


          for entry in master_raw:


              if is_blocked(
                  entry[
                      "url"
                  ],
                  existing=True,
              ):

                  cleaned_existing.append(
                      (
                          entry[
                              "name"
                          ],
                          entry[
                              "url"
                          ],
                      )
                  )

                  continue


              item = deepcopy(
                  entry
              )


              item[
                  "canonical"
              ] = strip_backup(
                  entry[
                      "name"
                  ]
              )


              item[
                  "group"
              ] = entry[
                  "attrs"
              ].get(
                  "group-title",
                  "",
              )


              item[
                  "logo"
              ] = entry[
                  "attrs"
              ].get(
                  "tvg-logo",
                  "",
              )


              suggested = (
                  confident_existing_group(
                      item[
                          "canonical"
                      ]
                  )
              )


              if (
                  suggested
                  and item[
                      "group"
                  ] != suggested
              ):

                  corrected_groups.append(
                      (
                          item[
                              "name"
                          ],
                          item[
                              "group"
                          ]
                          or "(blank)",
                          suggested,
                      )
                  )

                  item[
                      "group"
                  ] = suggested


              master.append(
                  item
              )


          # ============================================================================
          # Lookup index
          # ============================================================================

          lookup: dict[
              str,
              list[
                  dict
              ],
          ] = defaultdict(
              list
          )


          for entry in lookup_raw:

              if (
                  valid_stream_url(
                      entry[
                          "url"
                      ]
                  )
                  and not is_blocked(
                      entry[
                          "url"
                      ]
                  )
              ):

                  lookup[
                      normalize(
                          entry[
                              "name"
                          ]
                      )
                  ].append(
                      entry
                  )


          # ============================================================================
          # Resolve/filter merge source
          # ============================================================================

          candidates: list[
              dict
          ] = []


          proxy_resolved = 0
          blocked_skipped = 0
          malformed_skipped = 0


          for entry in merge_raw:

              item = deepcopy(
                  entry
              )


              if not valid_stream_url(
                  item[
                      "url"
                  ]
              ):

                  malformed_skipped += 1
                  continue


              if is_blocked(
                  item[
                      "url"
                  ]
              ):

                  replacement = next(
                      (
                          candidate
                          for candidate
                          in lookup.get(
                              normalize(
                                  item[
                                      "name"
                                  ]
                              ),
                              [],
                          )
                          if (
                              valid_stream_url(
                                  candidate[
                                      "url"
                                  ]
                              )
                              and not is_blocked(
                                  candidate[
                                      "url"
                                  ]
                              )
                          )
                      ),
                      None,
                  )


                  if not replacement:

                      blocked_skipped += 1
                      continue


                  item[
                      "url"
                  ] = replacement[
                      "url"
                  ]


                  item[
                      "extras"
                  ] = deepcopy(
                      replacement.get(
                          "extras",
                          [],
                      )
                  )


                  if not item[
                      "attrs"
                  ].get(
                      "tvg-logo"
                  ):

                      item[
                          "attrs"
                      ][
                          "tvg-logo"
                      ] = replacement[
                          "attrs"
                      ].get(
                          "tvg-logo",
                          "",
                      )


                  proxy_resolved += 1


              candidates.append(
                  item
              )


          # ============================================================================
          # Matching indexes
          # ============================================================================

          canonical: dict[
              str,
              list[
                  dict
              ],
          ] = defaultdict(
              list
          )


          norm_to_canonical: dict[
              str,
              list[
                  str
              ],
          ] = defaultdict(
              list
          )


          signature_to_canonical: dict[
              str,
              list[
                  str
              ],
          ] = defaultdict(
              list
          )


          tvgid_to_canonical: dict[
              str,
              list[
                  str
              ],
          ] = defaultdict(
              list
          )


          for entry in master:

              channel = entry[
                  "canonical"
              ]


              canonical[
                  channel
              ].append(
                  entry
              )


              nkey = normalize(
                  channel
              )


              if (
                  channel
                  not in norm_to_canonical[
                      nkey
                  ]
              ):

                  norm_to_canonical[
                      nkey
                  ].append(
                      channel
                  )


              signature = channel_signature(
                  channel
              )


              if (
                  signature
                  and channel
                  not in signature_to_canonical[
                      signature
                  ]
              ):

                  signature_to_canonical[
                      signature
                  ].append(
                      channel
                  )


              tvg_id = (
                  entry[
                      "attrs"
                  ]
                  .get(
                      "tvg-id",
                      "",
                  )
                  .strip()
                  .lower()
              )


              if (
                  tvg_id
                  and channel
                  not in tvgid_to_canonical[
                      tvg_id
                  ]
              ):

                  tvgid_to_canonical[
                      tvg_id
                  ].append(
                      channel
                  )


          existing_urls = {
              entry[
                  "url"
              ]
              for entry
              in master
          }


          # ============================================================================
          # Smart channel matcher
          # ============================================================================

          def find_target(
              source_name: str,
              source_attrs: dict | None = None,
              source_group: str | None = None,
          ) -> tuple[
              str | None,
              str,
          ]:

              source_attrs = (
                  source_attrs
                  or {}
              )


              wanted = preferred_name(
                  clean_source_name(
                      source_name
                  )
              )


              # tvg-id
              tvg_id = (
                  source_attrs
                  .get(
                      "tvg-id",
                      "",
                  )
                  .strip()
                  .lower()
              )


              if tvg_id:

                  matches = list(
                      dict.fromkeys(
                          tvgid_to_canonical.get(
                              tvg_id,
                              [],
                          )
                      )
                  )


                  if len(
                      matches
                  ) == 1:

                      return (
                          matches[0],
                          "tvg-id",
                      )


              # Exact
              if wanted in canonical:

                  return (
                      wanted,
                      "exact",
                  )


              # Case-insensitive
              case_matches = [
                  name
                  for name in canonical
                  if (
                      name.casefold()
                      == wanted.casefold()
                  )
              ]


              if len(
                  case_matches
              ) == 1:

                  return (
                      case_matches[0],
                      "case-insensitive",
                  )


              # Normalized
              nkey = normalize(
                  wanted
              )


              matches = list(
                  dict.fromkeys(
                      norm_to_canonical.get(
                          nkey,
                          [],
                      )
                  )
              )


              if len(
                  matches
              ) == 1:

                  return (
                      matches[0],
                      "normalized",
                  )


              # Signature
              signature = channel_signature(
                  wanted
              )


              matches = list(
                  dict.fromkeys(
                      signature_to_canonical.get(
                          signature,
                          [],
                      )
                  )
              )


              if len(
                  matches
              ) == 1:

                  target = matches[
                      0
                  ]


                  target_group = next(
                      (
                          member.get(
                              "group",
                              "",
                          )
                          for member
                          in canonical[
                              target
                          ]
                          if member.get(
                              "group",
                              "",
                          )
                      ),
                      "",
                  )


                  if group_compatible(
                      source_group,
                      target_group,
                  ):

                      return (
                          target,
                          "signature",
                      )


              # Strict fuzzy.
              tokens = normalized_tokens(
                  wanted
              )


              if (
                  len(tokens) == 1
                  and len(
                      tokens[0]
                  ) <= 4
              ):

                  return (
                      None,
                      "none",
                  )


              scored = []


              for (
                  candidate_name,
                  members,
              ) in canonical.items():


                  target_group = next(
                      (
                          member.get(
                              "group",
                              "",
                          )
                          for member
                          in members
                          if member.get(
                              "group",
                              "",
                          )
                      ),
                      "",
                  )


                  if not group_compatible(
                      source_group,
                      target_group,
                  ):

                      continue


                  seq = text_similarity(
                      wanted,
                      candidate_name,
                  )


                  token = token_similarity(
                      wanted,
                      candidate_name,
                  )


                  siga = channel_signature(
                      wanted
                  )


                  sigb = channel_signature(
                      candidate_name
                  )


                  sigscore = (
                      SequenceMatcher(
                          None,
                          siga,
                          sigb,
                      ).ratio()
                      if (
                          siga
                          and sigb
                      )
                      else 0.0
                  )


                  score = (
                      token * 0.50
                      + sigscore * 0.30
                      + seq * 0.20
                  )


                  scored.append(
                      (
                          score,
                          token,
                          seq,
                          candidate_name,
                      )
                  )


              if not scored:

                  return (
                      None,
                      "none",
                  )


              scored.sort(
                  key=lambda x: x[0],
                  reverse=True,
              )


              (
                  best_score,
                  best_token,
                  best_seq,
                  best_name,
              ) = scored[
                  0
              ]


              second = (
                  scored[
                      1
                  ][
                      0
                  ]
                  if len(
                      scored
                  ) > 1
                  else 0.0
              )


              if (
                  (
                      best_score
                      - second
                  ) >= 0.06
                  and (
                      (
                          best_score
                          >= 0.92
                          and best_seq
                          >= 0.88
                      )
                      or (
                          best_token
                          >= 0.80
                          and best_score
                          >= 0.88
                      )
                  )
              ):

                  return (
                      best_name,
                      "fuzzy",
                  )


              return (
                  None,
                  "none",
              )


          # ============================================================================
          # Process candidate streams
          # ============================================================================

          new_backups = []
          new_channels = []
          new_channel_candidates = []


          match_method_counts = defaultdict(
              int
          )


          skipped_unclassified = 0
          skipped_no_logo = 0
          skipped_backup_limit = 0
          skipped_adult_limit = 0

          adult_added_without_logo = 0


          for src in candidates:

              url = src[
                  "url"
              ]


              if url in existing_urls:
                  continue


              source_name = preferred_name(
                  src[
                      "name"
                  ]
              )


              source_group = guess_group(
                  source_name,
                  src[
                      "attrs"
                  ].get(
                      "group-title",
                      "",
                  ),
              )


              target, method = find_target(
                  src[
                      "name"
                  ],
                  src[
                      "attrs"
                  ],
                  source_group,
              )


              # ------------------------------------------------------------------------
              # Existing channel -> backup
              # ------------------------------------------------------------------------

              if target:

                  match_method_counts[
                      method
                  ] += 1


                  current = canonical[
                      target
                  ]


                  backup_count = sum(
                      1
                      for item in current
                      if backup_number(
                          item[
                              "name"
                          ]
                      ) > 0
                  )


                  if (
                      backup_count
                      >= MAX_BACKUPS
                  ):

                      skipped_backup_limit += 1
                      continue


                  primary = next(
                      (
                          item
                          for item in current
                          if backup_number(
                              item[
                                  "name"
                              ]
                          ) == 0
                      ),
                      current[
                          0
                      ],
                  )


                  next_number = (
                      max(
                          backup_number(
                              item[
                                  "name"
                              ]
                          )
                          for item
                          in current
                      )
                      + 1
                  )


                  new_entry = deepcopy(
                      primary
                  )


                  new_entry[
                      "name"
                  ] = (
                      f"{target} "
                      f"[Backup {next_number}]"
                  )


                  new_entry[
                      "canonical"
                  ] = target


                  new_entry[
                      "url"
                  ] = url


                  new_entry[
                      "extras"
                  ] = deepcopy(
                      src.get(
                          "extras",
                          [],
                      )
                  )


                  new_entry[
                      "logo"
                  ] = (
                      primary.get(
                          "logo",
                          "",
                      )
                      or src[
                          "attrs"
                      ].get(
                          "tvg-logo",
                          "",
                      )
                  )


                  master.append(
                      new_entry
                  )


                  canonical[
                      target
                  ].append(
                      new_entry
                  )


                  existing_urls.add(
                      url
                  )


                  new_backups.append(
                      (
                          new_entry[
                              "name"
                          ],
                          url,
                          method,
                      )
                  )


                  continue


              # ------------------------------------------------------------------------
              # New channel
              # ------------------------------------------------------------------------

              name = source_name
              group = source_group


              if not group:

                  skipped_unclassified += 1
                  continue


              logo = src[
                  "attrs"
              ].get(
                  "tvg-logo",
                  "",
              )


              # Adult does NOT need a logo.
              if (
                  not logo
                  and group
                  != "Adult"
              ):

                  skipped_no_logo += 1
                  continue


              no_logo_adult = (
                  group == "Adult"
                  and not logo
              )


              # ------------------------------------------------------------------------
              # Auto-add policy
              # ------------------------------------------------------------------------

              if group == "Adult":

                  adult_count = sum(
                      1
                      for (
                          _name,
                          g,
                          _url,
                      ) in new_channels
                      if g == "Adult"
                  )


                  if (
                      adult_count
                      >= MAX_NEW_ADULT_CHANNELS
                  ):

                      skipped_adult_limit += 1


                      new_channel_candidates.append(
                          (
                              name,
                              group,
                              url,
                          )
                      )


                      continue


              else:

                  normal_count = sum(
                      1
                      for (
                          _name,
                          g,
                          _url,
                      ) in new_channels
                      if g != "Adult"
                  )


                  if (
                      normal_count
                      >= MAX_NEW_CHANNELS
                  ):

                      new_channel_candidates.append(
                          (
                              name,
                              group,
                              url,
                          )
                      )


                      continue


              # ------------------------------------------------------------------------
              # Add approved new channel
              # ------------------------------------------------------------------------

              new_entry = {
                  "attrs": deepcopy(
                      src[
                          "attrs"
                      ]
                  ),
                  "name": name,
                  "canonical": name,
                  "url": url,
                  "extras": deepcopy(
                      src.get(
                          "extras",
                          [],
                      )
                  ),
                  "group": group,
                  "logo": logo,
              }


              master.append(
                  new_entry
              )


              canonical[
                  name
              ].append(
                  new_entry
              )


              existing_urls.add(
                  url
              )


              new_channels.append(
                  (
                      name,
                      group,
                      url,
                  )
              )


              if no_logo_adult:

                  adult_added_without_logo += 1


          # ============================================================================
          # Candidate deduplication
          # ============================================================================

          raw_candidate_streams = len(
              new_channel_candidates
          )


          candidate_groups = defaultdict(
              list
          )


          for (
              name,
              group,
              url,
          ) in new_channel_candidates:

              candidate_groups[
                  (
                      normalize(
                          name
                      ),
                      group,
                  )
              ].append(
                  (
                      name,
                      group,
                      url,
                  )
              )


          new_channel_candidates = [
              values[
                  0
              ]
              for values
              in candidate_groups.values()
          ]


          # ============================================================================
          # URL deduplication
          # ============================================================================

          seen_urls = set()
          deduped = []
          duplicate_removed = []


          for entry in master:

              if entry[
                  "url"
              ] in seen_urls:

                  duplicate_removed.append(
                      (
                          entry[
                              "name"
                          ],
                          entry[
                              "url"
                          ],
                      )
                  )

                  continue


              seen_urls.add(
                  entry[
                      "url"
                  ]
              )


              deduped.append(
                  entry
              )


          master = deduped


          # ============================================================================
          # Normalize channel families
          # ============================================================================

          families = defaultdict(
              list
          )


          for entry in master:

              cname = strip_backup(
                  entry.get(
                      "canonical",
                      entry[
                          "name"
                      ],
                  )
              )


              entry[
                  "canonical"
              ] = cname


              families[
                  cname
              ].append(
                  entry
              )


          promoted_primaries = []
          renumbered_backups = []
          metadata_synced = 0

          normalized_master = []


          for (
              cname,
              members,
          ) in families.items():


              members.sort(
                  key=lambda item: (
                      0
                      if backup_number(
                          item[
                              "name"
                          ]
                      ) == 0
                      else 1,
                      backup_number(
                          item[
                              "name"
                          ]
                      ),
                      item[
                          "name"
                      ].lower(),
                  )
              )


              existing_primary = next(
                  (
                      item
                      for item
                      in members
                      if backup_number(
                          item[
                              "name"
                          ]
                      ) == 0
                  ),
                  None,
              )


              primary = (
                  existing_primary
                  or members[
                      0
                  ]
              )


              if existing_primary is None:

                  promoted_primaries.append(
                      cname
                  )


              canonical_group = (
                  primary.get(
                      "group",
                      "",
                  )
                  or next(
                      (
                          member.get(
                              "group",
                              "",
                          )
                          for member
                          in members
                          if member.get(
                              "group",
                              "",
                          )
                      ),
                      "",
                  )
              )


              canonical_logo = (
                  primary.get(
                      "logo",
                      "",
                  )
                  or next(
                      (
                          member.get(
                              "logo",
                              "",
                          )
                          for member
                          in members
                          if member.get(
                              "logo",
                              "",
                          )
                      ),
                      "",
                  )
              )


              identity_fields = (
                  "tvg-id",
                  "tvg-language",
                  "tvg-country",
              )


              identity = {}


              for field in identity_fields:

                  value = primary[
                      "attrs"
                  ].get(
                      field,
                      "",
                  )


                  if not value:

                      value = next(
                          (
                              member[
                                  "attrs"
                              ].get(
                                  field,
                                  "",
                              )
                              for member
                              in members
                              if member[
                                  "attrs"
                              ].get(
                                  field,
                                  "",
                              )
                          ),
                          "",
                      )


                  if value:

                      identity[
                          field
                      ] = value


              others = [
                  member
                  for member
                  in members
                  if member
                  is not primary
              ]


              others.sort(
                  key=lambda item: (
                      backup_number(
                          item[
                              "name"
                          ]
                      ),
                      item[
                          "name"
                      ].lower(),
                  )
              )


              ordered = [
                  primary
              ] + others


              for (
                  index,
                  member,
              ) in enumerate(
                  ordered
              ):


                  old_name = member[
                      "name"
                  ]


                  new_name = (
                      cname
                      if index == 0
                      else (
                          f"{cname} "
                          f"[Backup {index}]"
                      )
                  )


                  if (
                      old_name
                      != new_name
                  ):

                      renumbered_backups.append(
                          (
                              old_name,
                              new_name,
                          )
                      )


                  member[
                      "name"
                  ] = new_name


                  member[
                      "canonical"
                  ] = cname


                  if (
                      member.get(
                          "group",
                          "",
                      )
                      != canonical_group
                  ):

                      metadata_synced += 1


                  member[
                      "group"
                  ] = canonical_group


                  if (
                      member.get(
                          "logo",
                          "",
                      )
                      != canonical_logo
                  ):

                      metadata_synced += 1


                  member[
                      "logo"
                  ] = canonical_logo


                  for (
                      field,
                      value,
                  ) in identity.items():

                      if (
                          member[
                              "attrs"
                          ].get(
                              field,
                              "",
                          )
                          != value
                      ):

                          member[
                              "attrs"
                          ][
                              field
                          ] = value


                          metadata_synced += 1


                  normalized_master.append(
                      member
                  )


          master = normalized_master


          # ============================================================================
          # Candidate state
          # ============================================================================

          candidate_state = sorted(
              {
                  (
                      normalize(
                          name
                      ),
                      group,
                  )
                  for (
                      name,
                      group,
                      _url,
                  ) in new_channel_candidates
              }
          )


          candidate_state_data = [
              {
                  "channel": name,
                  "group": group,
              }
              for (
                  name,
                  group,
              ) in candidate_state
          ]


          previous_state = []


          if CANDIDATE_STATE.exists():

              try:

                  previous_state = json.loads(
                      CANDIDATE_STATE.read_text(
                          encoding="utf-8",
                      )
                  )

              except (
                  OSError,
                  json.JSONDecodeError,
              ):

                  previous_state = []


          candidate_changed = (
              candidate_state_data
              != previous_state
          )


          # ============================================================================
          # Sort
          # ============================================================================

          rank = {
              group: index
              for (
                  index,
                  group,
              ) in enumerate(
                  GROUP_ORDER
              )
          }


          master.sort(
              key=lambda entry: (
                  rank.get(
                      entry[
                          "group"
                      ],
                      999,
                  ),
                  normalize(
                      entry[
                          "canonical"
                      ]
                  ),
                  backup_number(
                      entry[
                          "name"
                      ]
                  ),
                  entry[
                      "name"
                  ].lower(),
              )
          )


          # ============================================================================
          # Serialize
          # ============================================================================

          output = list(
              master_header
          )


          output += [
              '#PLAYLIST-STUDIO-NAME:"SAEID RAHMAN - IPTV Playlist"',
              (
                  "#PLAYLIST-STUDIO-CATEGORIES:"
                  + json.dumps(
                      GROUP_ORDER,
                      ensure_ascii=False,
                  )
              ),
          ]


          for (
              number,
              entry,
          ) in enumerate(
              master,
              1,
          ):

              output.append(
                  serialize_extinf(
                      entry,
                      number,
                  )
              )


              output.extend(
                  entry.get(
                      "extras",
                      [],
                  )
              )


              output.append(
                  entry[
                      "url"
                  ]
              )


          new_master_text = (
              "\ufeff"
              + "\n".join(
                  output
              )
              + "\n"
          )


          playlist_changed = (
              original_master_text.lstrip(
                  "\ufeff"
              )
              != new_master_text.lstrip(
                  "\ufeff"
              )
          )


          if (
              not playlist_changed
              and not candidate_changed
          ):

              print(
                  "No meaningful changes."
              )

              raise SystemExit(
                  0
              )


          if playlist_changed:

              atomic_write(
                  MASTER,
                  new_master_text,
              )


          atomic_write(
              CANDIDATE_STATE,
              json.dumps(
                  candidate_state_data,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
          )


          # ============================================================================
          # Statistics
          # ============================================================================

          canonical_count = len(
              {
                  entry[
                      "canonical"
                  ]
                  for entry
                  in master
              }
          )


          backup_count = sum(
              1
              for entry
              in master
              if backup_number(
                  entry[
                      "name"
                  ]
              ) > 0
          )


          group_counts = defaultdict(
              int
          )


          for entry in master:

              group_counts[
                  entry[
                      "group"
                  ]
              ] += 1


          new_adult = [
              item
              for item
              in new_channels
              if item[
                  1
              ] == "Adult"
          ]


          adult_candidates = [
              item
              for item
              in new_channel_candidates
              if item[
                  1
              ] == "Adult"
          ]


          # ============================================================================
          # Report
          # ============================================================================

          now = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )


          report = [
              "# 🤖 IPTV Auto Update",
              "",
              f"Generated: **{now}**",
              "",
              "## Summary",
              "",
              "| Metric | Count |",
              "|---|---:|",
              f"| Final canonical channels | **{canonical_count}** |",
              f"| Final stream URLs | **{len(master)}** |",
              f"| Final backup streams | **{backup_count}** |",
              f"| New backup streams added | **{len(new_backups)}** |",
              f"| New channels auto-added | **{len(new_channels)}** |",
              f"| New Adult channels auto-added | **{len(new_adult)}** |",
              f"| Adult channels added without logo | **{adult_added_without_logo}** |",
              f"| Adult candidates held back after limit | **{len(adult_candidates)}** |",
              f"| Unique other candidates held back | **{len(new_channel_candidates)}** |",
              f"| Raw candidate stream URLs | **{raw_candidate_streams}** |",
              f"| Existing bad/expired entries removed | **{len(cleaned_existing)}** |",
              f"| Existing category corrections | **{len(corrected_groups)}** |",
              f"| Primary promotions | **{len(promoted_primaries)}** |",
              f"| Backup renames | **{len(renumbered_backups)}** |",
              f"| Metadata synchronizations | **{metadata_synced}** |",
              f"| Wrapper/proxy URLs resolved | **{proxy_resolved}** |",
              f"| Blocked URLs skipped | **{blocked_skipped}** |",
              f"| Malformed URLs skipped | **{malformed_skipped}** |",
              f"| Duplicate URLs removed | **{len(duplicate_removed)}** |",
              "",
              "## Final category distribution",
              "",
              "| Category | Stream entries |",
              "|---|---:|",
          ]


          for group in GROUP_ORDER:

              report.append(
                  f"| {group} | "
                  f"**{group_counts.get(group, 0)}** |"
              )


          if match_method_counts:

              report += [
                  "",
                  "## Existing-channel matching",
                  "",
                  "| Method | Backups recognized |",
                  "|---|---:|",
              ]


              for method in (
                  "tvg-id",
                  "exact",
                  "case-insensitive",
                  "normalized",
                  "signature",
                  "fuzzy",
              ):

                  count = match_method_counts.get(
                      method,
                      0,
                  )


                  if count:

                      report.append(
                          f"| {method} | "
                          f"**{count}** |"
                      )


          if new_adult:

              report += [
                  "",
                  "## New Adult channels automatically added",
                  "",
              ]


              for (
                  name,
                  _group,
                  url,
              ) in new_adult:

                  report.append(
                      f"- **{name}** — `{url}`"
                  )


          if new_channel_candidates:

              report += [
                  "",
                  "## Held-back new channel candidates",
                  "",
              ]


              for (
                  name,
                  group,
                  url,
              ) in sorted(
                  new_channel_candidates,
                  key=lambda x: (
                      rank.get(
                          x[
                              1
                          ],
                          999,
                      ),
                      normalize(
                          x[
                              0
                          ]
                      ),
                  ),
              ):

                  report.append(
                      f"- **{name}** "
                      f"(`{group}`) — `{url}`"
                  )


          report += [
              "",
              "## Safety / policy",
              "",
              f"- Unclassified new channels skipped: **{skipped_unclassified}**",
              f"- Non-Adult new channels without logos skipped: **{skipped_no_logo}**",
              f"- Adult channels added without logos: **{adult_added_without_logo}**",
              f"- Backup-limit skips: **{skipped_backup_limit}**",
              f"- Adult-limit skips: **{skipped_adult_limit}**",
              "",
              "> Adult channels may be auto-added even when they have no logo.",
              "",
              "> Adult detection checks both channel names and source groups and accepts "
              "more common Adult naming formats.",
              "",
              "> Normal completely-new channels remain review-only.",
              "",
              "> Live network failure is not used as a deletion reason, protecting "
              "BDIX/local-only streams.",
              "",
          ]


          atomic_write(
              REPORT,
              "\n".join(
                  report
              ),
          )


          # ============================================================================
          # Commit summary
          # ============================================================================

          summary_parts = []


          if new_backups:

              summary_parts.append(
                  f"+{len(new_backups)} backups"
              )


          if new_adult:

              summary_parts.append(
                  f"+{len(new_adult)} adult"
              )


          if adult_added_without_logo:

              summary_parts.append(
                  f"{adult_added_without_logo} adult no-logo"
              )


          if cleaned_existing:

              summary_parts.append(
                  f"-{len(cleaned_existing)} bad"
              )


          if corrected_groups:

              summary_parts.append(
                  f"{len(corrected_groups)} category fixes"
              )


          if duplicate_removed:

              summary_parts.append(
                  f"-{len(duplicate_removed)} dupes"
              )


          if not summary_parts:

              summary_parts.append(
                  "playlist normalized"
              )


          summary = ", ".join(
              summary_parts
          )


          github_output = os.environ.get(
              "GITHUB_OUTPUT"
          )


          if github_output:

              with open(
                  github_output,
                  "a",
                  encoding="utf-8",
              ) as handle:

                  handle.write(
                      f"summary={summary}\n"
                  )


          print(
              f"Done: {summary}"
          )

          PY


      - name: Commit changes
        shell: bash
        env:
          UPDATE_SUMMARY: ${{ steps.updater.outputs.summary }}
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "IPTV Update Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SUMMARY="${UPDATE_SUMMARY:-auto-update}"

          git commit -m "bot: ${SUMMARY}"

          git pull --rebase origin "$GITHUB_REF_NAME"

          git push origin "HEAD:$GITHUB_REF_NAME"

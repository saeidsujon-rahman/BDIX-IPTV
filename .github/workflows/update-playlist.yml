name: IPTV Auto Update

on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC = 08:30 Bangladesh time
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update playlist
        id: updater
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import unicodedata
          import urllib.error
          import urllib.request

          from collections import defaultdict
          from copy import deepcopy
          from datetime import datetime, timezone
          from difflib import SequenceMatcher
          from pathlib import Path


          # ============================================================================
          # Configuration
          # ============================================================================

          MASTER = Path("IPTV Playlist.m3u")
          REPORT = Path("reports/auto-update.md")
          CANDIDATE_STATE = Path("reports/auto-update-candidates.json")

          MERGE_SOURCE = (
              "https://raw.githubusercontent.com/"
              "ahmedstore75/Bdixplaylist/main/playlist.m3u"
          )

          LOOKUP_SOURCE = (
              "https://raw.githubusercontent.com/"
              "ahmedstore75/Iptvbdlive/main/mixiptvchannel.m3u"
          )

          MAX_BACKUPS = 8

          # Normal new channels are review-only.
          MAX_NEW_CHANNELS = 0

          # Adult channels may be added automatically.
          MAX_NEW_ADULT_CHANNELS = 50


          # ============================================================================
          # Final authoritative category structure
          # ============================================================================

          GROUP_ORDER = [
              "Bangladesh",
              "Indian Bangla",
              "Indian Movies",
              "Indian Music",
              "Indian Entertainment",
              "International Movies",
              "International Music",
              "Documentary & Wildlife",
              "Sports",
              "Kids",
              "Religious",
              "News & Weather",
              "Adult",
          ]


          # ============================================================================
          # Exact channel aliases
          # ============================================================================

          ALIASES = {
              "bangla vision": "Banglavision",
              "dbc news hd": "DBC News",
              "ekattor hd": "Ekattor TV",
              "channel i hd": "Channel I",
              "news 24 hd": "News 24",

              "star jalsha hd": "Star Jalsha",
              "jalsha movies hd": "Jalsha Movies",
              "zee bangla hd": "Zee Bangla",
              "sony aath": "Sony AATH",

              "sony sports 2 hd": "Sony Ten 2",
              "sony sports 5 hd": "Sony Ten 5",

              "bangla jago": "Bangla Jago TV",
              "accu weather": "AccuWeather Now",
              "cnbc tv 18": "CNBC TV18",
              "dw": "DW News",
              "trace sport": "Trace Sport Stars",
              "&xplore": "&Xplor HD",
          }


          # ============================================================================
          # Block lists
          # ============================================================================

          BLOCKED_NEW = (
              "go.skym3u.dev",
              "iptvlive.ahmed-bd-org.workers.dev",
              "iptv-proxy.ahmed-bd-org.workers.dev",
              "filex.me",
              "proxy.php",
              "premiumtvs.space",
              "premimum.online",
              "ottclub.xyz",
              "vercel.app",
          )

          BLOCKED_EXISTING = (
              "iptvlive.ahmed-bd-org.workers.dev",
              "iptv-proxy.ahmed-bd-org.workers.dev",
              "vercel.app",
          )


          # ============================================================================
          # Classification data
          # ============================================================================

          INDIAN_BANGLA = (
              "zee bangla",
              "star jalsha",
              "jalsha movies",
              "sony aath",
              "colors bangla",
              "sun bangla",
              "enter 10 bangla",
              "enterr10 bangla",
              "bangla jago",
              "republic bangla",
              "tv9 bangla",
              "sangeet bangla",
              "abp ananda",
              "news18 bangla",
          )

          BANGLADESH_NAMES = (
              "atn bangla",
              "atn news",
              "jamuna",
              "somoy",
              "ekattor",
              "dbc",
              "ntv",
              "rtv",
              "channel i",
              "banglavision",
              "bangla vision",
              "boishakhi",
              "duronto",
              "deepto",
              "maasranga",
              "independent",
              "news 24",
              "mohona",
              "bijoy",
              "mytv",
              "desh tv",
              "asian tv",
              "btv",
              "ekushey",
              "channel 24",
              "channel 1",
              "btv news",
              "btv shangshad",
              "btv parliament",
              "sangsad",
          )

          NEWS_WEATHER_NAMES = (
              "aaj tak",
              "india today",
              "news18 india",
              "ndtv",
              "wion",
              "cnbc",
              "times now",
              "republic tv",
              "zee news",
              "tv9 bharat",
              "cnn",
              "bbc news",
              "dw news",
              "al jazeera",
              "bloomberg",
              "fox news",
              "sky news",
              "france 24",
              "euronews",
              "rt news",
              "accuweather",
              "weather",
          )

          SPORTS_NAMES = (
              "sony ten",
              "sony sports",
              "star sports",
              "sports18",
              "eurosport",
              "bein sports",
              "willow",
              "ten cricket",
              "astro cricket",
              "sky sports",
              "espn",
          )

          DOCUMENTARY_NAMES = (
              "discovery",
              "animal planet",
              "nat geo",
              "national geographic",
              "history",
              "wild",
              "nature",
              "science",
              "investigation discovery",
          )

          KIDS_NAMES = (
              "cartoon network",
              "nickelodeon",
              "nick jr",
              "nick",
              "disney junior",
              "disney channel",
              "pogo",
              "sony yay",
              "hungama",
              "baby tv",
              "kids",
              "cartoon",
          )

          RELIGIOUS_NAMES = (
              "quran",
              "islam",
              "islamic",
              "peace tv",
              "aastha",
              "sanskar",
              "bhakti",
              "god tv",
              "faith",
              "church",
              "christian",
          )

          # Strong adult indicators only.
          # Avoid generic words such as "hot", "passion", "venus" because they can
          # misclassify ordinary channels.
          ADULT_STRONG_NAMES = (
              "adult",
              "xxx",
              "18+",
              "18 plus",
              "erotic",
              "erotica",
              "playboy",
              "penthouse",
              "brazzers",
              "hustler",
              "redlight",
              "private tv",
              "private spice",
              "blue hustler",
              "dorcel",
              "vivid red",
          )


          # ============================================================================
          # Matching configuration
          # ============================================================================

          QUALITY_WORDS = {
              "hd",
              "fhd",
              "uhd",
              "sd",
              "4k",
              "1080p",
              "720p",
          }

          GENERIC_NAME_WORDS = {
              "tv",
              "television",
              "channel",
              "network",
              "official",
              "live",
          }


          # ============================================================================
          # Helpers
          # ============================================================================

          def atomic_write(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)

              tmp = path.with_name(path.name + ".tmp")
              tmp.write_text(text, encoding="utf-8")
              tmp.replace(path)


          def fetch(url: str, attempts: int = 3) -> str:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "SaeidRahman-IPTV-Updater/5.0",
                      "Accept": "*/*",
                  },
              )

              last_error: Exception | None = None

              for attempt in range(1, attempts + 1):
                  try:
                      with urllib.request.urlopen(req, timeout=40) as response:
                          text = response.read().decode(
                              "utf-8-sig",
                              errors="replace",
                          )

                          print(
                              f"Fetched {url} "
                              f"({len(text):,} characters)"
                          )

                          return text

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      OSError,
                  ) as exc:
                      last_error = exc

                      print(
                          f"Attempt {attempt}/{attempts} "
                          f"failed for {url}: {exc}"
                      )

                      if attempt < attempts:
                          time.sleep(5 * attempt)

              raise SystemExit(
                  f"Could not fetch {url} after "
                  f"{attempts} attempts: {last_error}"
              )


          def valid_stream_url(url: str) -> bool:
              return url.strip().lower().startswith(
                  (
                      "http://",
                      "https://",
                      "rtmp://",
                      "rtsp://",
                      "udp://",
                      "rtp://",
                  )
              )


          def parse_m3u(text: str) -> list[dict]:
              entries: list[dict] = []

              current = None
              extras: list[str] = []

              for raw in text.splitlines():
                  line = raw.strip()

                  if line.startswith("#EXTINF"):
                      attrs = dict(
                          re.findall(
                              r'([\w-]+)="([^"]*)"',
                              line,
                          )
                      )

                      if "," in line:
                          name = line.rsplit(",", 1)[-1].strip()
                      else:
                          name = attrs.get("tvg-name", "").strip()

                      current = {
                          "attrs": attrs,
                          "name": name,
                          "url": None,
                          "extras": [],
                      }

                      extras = []

                  elif current and (
                      not line or line.startswith("#")
                  ):
                      extras.append(raw)

                  elif current and line:
                      current["url"] = line
                      current["extras"] = extras[:]

                      if (
                          current["name"]
                          and current["url"]
                          and valid_stream_url(current["url"])
                      ):
                          entries.append(current)

                      current = None
                      extras = []

              return entries


          def extract_header_lines(text: str) -> list[str]:
              result: list[str] = []

              for raw in text.splitlines():
                  line = raw.strip()

                  if line.startswith("#EXTINF"):
                      break

                  if not line:
                      continue

                  line = line.lstrip("\ufeff")

                  if line.startswith("#PLAYLIST-STUDIO-NAME:"):
                      continue

                  if line.startswith("#PLAYLIST-STUDIO-CATEGORIES:"):
                      continue

                  result.append(line)

              if not result or not result[0].startswith("#EXTM3U"):
                  result.insert(0, "#EXTM3U")

              return result


          def strip_backup(name: str) -> str:
              return re.sub(
                  r"\s*\[Backup\s*\d+\]\s*$",
                  "",
                  name,
                  flags=re.I,
              ).strip()


          def backup_number(name: str) -> int:
              match = re.search(
                  r"\[Backup\s*(\d+)\]\s*$",
                  name,
                  flags=re.I,
              )

              return int(match.group(1)) if match else 0


          def preferred_name(name: str) -> str:
              clean = strip_backup(name)

              return ALIASES.get(
                  clean.lower(),
                  clean,
              )


          def normalize(name: str) -> str:
              name = preferred_name(name)

              name = unicodedata.normalize(
                  "NFKD",
                  name,
              ).lower()

              name = name.replace("&", " and ")

              name = re.sub(
                  r"\b(fhd|uhd|hd|sd|4k|1080p|720p)\b",
                  " ",
                  name,
              )

              name = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  name,
              )

              return " ".join(name.split())


          def has(text: str, words) -> bool:
              low = text.lower()

              return any(
                  word in low
                  for word in words
              )


          def is_blocked(
              url: str,
              existing: bool = False,
          ) -> bool:
              low = url.lower()

              domains = (
                  BLOCKED_EXISTING
                  if existing
                  else BLOCKED_NEW
              )

              if any(
                  domain in low
                  for domain in domains
              ):
                  return True

              match = re.search(
                  r"(?:[?&])e=(\d{10})(?:&|$)",
                  url,
              )

              if match:
                  try:
                      if int(match.group(1)) < int(time.time()):
                          return True
                  except ValueError:
                      pass

              return False


          # ============================================================================
          # Matching helpers
          # ============================================================================

          def clean_source_name(name: str) -> str:
              name = strip_backup(name)

              name = re.sub(
                  r"\[(?:"
                  r"hd|fhd|uhd|sd|4k|1080p|720p|"
                  r"bd|bdix|india|indian|backup|live"
                  r")\]",
                  " ",
                  name,
                  flags=re.I,
              )

              name = re.sub(
                  r"\b(?:HD|FHD|UHD|SD|4K|1080P|720P|BDIX)\b",
                  " ",
                  name,
                  flags=re.I,
              )

              return " ".join(name.split())


          def normalized_tokens(name: str) -> list[str]:
              name = preferred_name(
                  clean_source_name(name)
              )

              text = unicodedata.normalize(
                  "NFKD",
                  name,
              ).lower()

              text = text.replace("&", " and ")

              text = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  text,
              )

              return [
                  token
                  for token in text.split()
                  if token not in QUALITY_WORDS
              ]


          def channel_signature(name: str) -> str:
              tokens = normalized_tokens(name)

              reduced = [
                  token
                  for token in tokens
                  if token not in GENERIC_NAME_WORDS
              ]

              if not reduced:
                  return " ".join(tokens)

              if all(
                  token.isdigit()
                  for token in reduced
              ):
                  return " ".join(tokens)

              return " ".join(reduced)


          def token_similarity(a: str, b: str) -> float:
              a_tokens = set(
                  normalized_tokens(a)
              )

              b_tokens = set(
                  normalized_tokens(b)
              )

              if not a_tokens or not b_tokens:
                  return 0.0

              intersection = len(
                  a_tokens & b_tokens
              )

              union = len(
                  a_tokens | b_tokens
              )

              return (
                  intersection / union
                  if union
                  else 0.0
              )


          def text_similarity(a: str, b: str) -> float:
              return SequenceMatcher(
                  None,
                  normalize(a),
                  normalize(b),
              ).ratio()


          # ============================================================================
          # Classification
          # ============================================================================

          def guess_group(
              name: str,
              source_group: str,
          ) -> str | None:

              g = (source_group or "").strip()
              gl = g.lower()
              nl = name.lower()

              if g in GROUP_ORDER:
                  return g


              # ------------------------------------------------------------------------
              # Adult
              # ------------------------------------------------------------------------

              if (
                  "adult" in gl
                  or "xxx" in gl
                  or "18+" in gl
                  or has(
                      nl,
                      ADULT_STRONG_NAMES,
                  )
              ):
                  return "Adult"


              # ------------------------------------------------------------------------
              # Bangladesh
              # ------------------------------------------------------------------------

              if (
                  "bangladesh" in gl
                  or gl in {
                      "bd",
                      "bangladesh tv",
                  }
                  or has(
                      nl,
                      BANGLADESH_NAMES,
                  )
              ):
                  return "Bangladesh"


              # ------------------------------------------------------------------------
              # Indian Bangla
              # ------------------------------------------------------------------------

              if has(
                  nl,
                  INDIAN_BANGLA,
              ):
                  return "Indian Bangla"


              if (
                  gl in {
                      "bangla",
                      "bengali",
                  }
                  or "bangla" in gl
                  or "bengali" in gl
              ):
                  if not has(
                      nl,
                      BANGLADESH_NAMES,
                  ):
                      return "Indian Bangla"


              # ------------------------------------------------------------------------
              # Sports
              # ------------------------------------------------------------------------

              if (
                  "sport" in gl
                  or "sport" in nl
                  or "cricket" in nl
                  or has(
                      nl,
                      SPORTS_NAMES,
                  )
              ):
                  return "Sports"


              # ------------------------------------------------------------------------
              # Kids
              # ------------------------------------------------------------------------

              if (
                  "kid" in gl
                  or has(
                      nl,
                      KIDS_NAMES,
                  )
              ):
                  return "Kids"


              # ------------------------------------------------------------------------
              # Religious
              # ------------------------------------------------------------------------

              if (
                  "relig" in gl
                  or has(
                      nl,
                      RELIGIOUS_NAMES,
                  )
              ):
                  return "Religious"


              # ------------------------------------------------------------------------
              # Documentary & Wildlife
              # ------------------------------------------------------------------------

              if (
                  "document" in gl
                  or "wildlife" in gl
                  or has(
                      nl,
                      DOCUMENTARY_NAMES,
                  )
              ):
                  return "Documentary & Wildlife"


              # ------------------------------------------------------------------------
              # News & Weather
              # ------------------------------------------------------------------------

              if (
                  "news" in gl
                  or "weather" in gl
                  or has(
                      nl,
                      NEWS_WEATHER_NAMES,
                  )
              ):
                  return "News & Weather"


              # ------------------------------------------------------------------------
              # Indian groups
              # ------------------------------------------------------------------------

              if gl in {
                  "india",
                  "indian",
                  "hindi",
              }:

                  if has(
                      nl,
                      (
                          "music",
                          "mtv",
                          "9xm",
                          "zoom",
                          "sangeet",
                      ),
                  ):
                      return "Indian Music"

                  if has(
                      nl,
                      (
                          "movie",
                          "movies",
                          "cinema",
                          "cineplex",
                      ),
                  ):
                      return "Indian Movies"

                  return "Indian Entertainment"


              if (
                  "indian movie" in gl
                  or "hindi movie" in gl
              ):
                  return "Indian Movies"


              if (
                  "indian music" in gl
                  or "hindi music" in gl
              ):
                  return "Indian Music"


              if (
                  "indian entertainment" in gl
                  or "hindi entertainment" in gl
              ):
                  return "Indian Entertainment"


              # ------------------------------------------------------------------------
              # International Movies
              # ------------------------------------------------------------------------

              if (
                  "movie" in gl
                  or "movies" in gl
                  or "cinema" in gl
              ):
                  return "International Movies"


              # ------------------------------------------------------------------------
              # International Music
              # ------------------------------------------------------------------------

              if "music" in gl:
                  return "International Music"


              return None


          def confident_existing_group(
              name: str,
          ) -> str | None:

              nl = name.lower()


              if has(
                  nl,
                  ADULT_STRONG_NAMES,
              ):
                  return "Adult"


              if has(
                  nl,
                  BANGLADESH_NAMES,
              ):
                  return "Bangladesh"


              if has(
                  nl,
                  INDIAN_BANGLA,
              ):
                  return "Indian Bangla"


              if (
                  "sport" in nl
                  or "cricket" in nl
                  or has(
                      nl,
                      SPORTS_NAMES,
                  )
              ):
                  return "Sports"


              if has(
                  nl,
                  DOCUMENTARY_NAMES,
              ):
                  return "Documentary & Wildlife"


              if has(
                  nl,
                  KIDS_NAMES,
              ):
                  return "Kids"


              if has(
                  nl,
                  RELIGIOUS_NAMES,
              ):
                  return "Religious"


              if has(
                  nl,
                  NEWS_WEATHER_NAMES,
              ):
                  return "News & Weather"


              return None


          def group_compatible(
              source_group: str | None,
              target_group: str | None,
          ) -> bool:

              if not source_group or not target_group:
                  return True

              if source_group == target_group:
                  return True

              return False


          # ============================================================================
          # EXTINF serialization
          # ============================================================================

          def serialize_extinf(
              entry: dict,
              chno: int,
          ) -> str:

              attrs = dict(
                  entry["attrs"]
              )

              attrs["tvg-name"] = entry["name"]
              attrs["tvg-chno"] = str(chno)
              attrs["group-title"] = entry["group"]

              if entry["logo"]:
                  attrs["tvg-logo"] = entry["logo"]
              else:
                  attrs.pop(
                      "tvg-logo",
                      None,
                  )

              preferred_order = [
                  "tvg-id",
                  "tvg-name",
                  "tvg-logo",
                  "tvg-chno",
                  "tvg-language",
                  "tvg-country",
                  "group-title",
              ]

              parts: list[str] = []

              for key in preferred_order:
                  value = attrs.get(
                      key,
                      "",
                  )

                  if value != "":
                      parts.append(
                          f'{key}="{value}"'
                      )

              for key, value in attrs.items():
                  if (
                      key not in preferred_order
                      and value != ""
                  ):
                      parts.append(
                          f'{key}="{value}"'
                      )

              return (
                  "#EXTINF:-1 "
                  + " ".join(parts)
                  + ","
                  + entry["name"]
              )


          # ============================================================================
          # Load master
          # ============================================================================

          if not MASTER.exists():
              raise SystemExit(
                  f"Master playlist not found: {MASTER}"
              )

          original_master_text = MASTER.read_text(
              encoding="utf-8-sig",
              errors="replace",
          )

          master_header = extract_header_lines(
              original_master_text
          )

          master_raw = parse_m3u(
              original_master_text
          )

          if not master_raw:
              raise SystemExit(
                  f"Refusing to continue: parsed 0 channels "
                  f"from {MASTER}. Playlist may be empty or corrupted."
              )

          print(
              f"Master loaded: "
              f"{len(master_raw)} stream entries"
          )


          # ============================================================================
          # Fetch sources
          # ============================================================================

          print(
              "Fetching source playlists..."
          )

          merge_raw = parse_m3u(
              fetch(
                  MERGE_SOURCE
              )
          )

          lookup_raw = parse_m3u(
              fetch(
                  LOOKUP_SOURCE
              )
          )

          print(
              f"Merge source: "
              f"{len(merge_raw)} entries"
          )

          print(
              f"Lookup source: "
              f"{len(lookup_raw)} entries"
          )


          # ============================================================================
          # Prepare existing master
          # ============================================================================

          master: list[dict] = []

          cleaned_existing: list[
              tuple[str, str]
          ] = []

          corrected_groups: list[
              tuple[str, str, str]
          ] = []

          for entry in master_raw:

              if is_blocked(
                  entry["url"],
                  existing=True,
              ):

                  cleaned_existing.append(
                      (
                          entry["name"],
                          entry["url"],
                      )
                  )

                  continue

              item = deepcopy(
                  entry
              )

              item["canonical"] = strip_backup(
                  entry["name"]
              )

              item["group"] = entry[
                  "attrs"
              ].get(
                  "group-title",
                  "",
              )

              item["logo"] = entry[
                  "attrs"
              ].get(
                  "tvg-logo",
                  "",
              )

              suggested_group = confident_existing_group(
                  item["canonical"]
              )

              if (
                  suggested_group
                  and item["group"] != suggested_group
              ):

                  corrected_groups.append(
                      (
                          item["name"],
                          item["group"] or "(blank)",
                          suggested_group,
                      )
                  )

                  item["group"] = suggested_group

              master.append(
                  item
              )


          # ============================================================================
          # Build lookup URL index
          # ============================================================================

          lookup: dict[
              str,
              list[dict],
          ] = defaultdict(list)

          for entry in lookup_raw:

              if (
                  valid_stream_url(
                      entry["url"]
                  )
                  and not is_blocked(
                      entry["url"]
                  )
              ):

                  lookup[
                      normalize(
                          entry["name"]
                      )
                  ].append(
                      entry
                  )


          # ============================================================================
          # Resolve/filter merge candidates
          # ============================================================================

          candidates: list[dict] = []

          proxy_resolved = 0
          blocked_skipped = 0
          malformed_skipped = 0

          for entry in merge_raw:

              item = deepcopy(
                  entry
              )

              if not valid_stream_url(
                  item["url"]
              ):
                  malformed_skipped += 1
                  continue

              if is_blocked(
                  item["url"]
              ):

                  replacement = next(
                      (
                          candidate
                          for candidate
                          in lookup.get(
                              normalize(
                                  item["name"]
                              ),
                              [],
                          )
                          if (
                              valid_stream_url(
                                  candidate["url"]
                              )
                              and not is_blocked(
                                  candidate["url"]
                              )
                          )
                      ),
                      None,
                  )

                  if not replacement:
                      blocked_skipped += 1
                      continue

                  item["url"] = replacement[
                      "url"
                  ]

                  item["extras"] = deepcopy(
                      replacement.get(
                          "extras",
                          [],
                      )
                  )

                  if not item[
                      "attrs"
                  ].get(
                      "tvg-logo"
                  ):

                      item[
                          "attrs"
                      ][
                          "tvg-logo"
                      ] = replacement[
                          "attrs"
                      ].get(
                          "tvg-logo",
                          "",
                      )

                  proxy_resolved += 1

              candidates.append(
                  item
              )


          # ============================================================================
          # Build master matching indexes
          # ============================================================================

          canonical: dict[
              str,
              list[dict],
          ] = defaultdict(list)

          norm_to_canonical: dict[
              str,
              list[str],
          ] = defaultdict(list)

          signature_to_canonical: dict[
              str,
              list[str],
          ] = defaultdict(list)

          tvgid_to_canonical: dict[
              str,
              list[str],
          ] = defaultdict(list)

          for entry in master:

              channel = entry[
                  "canonical"
              ]

              canonical[
                  channel
              ].append(
                  entry
              )

              norm_key = normalize(
                  channel
              )

              if channel not in norm_to_canonical[
                  norm_key
              ]:

                  norm_to_canonical[
                      norm_key
                  ].append(
                      channel
                  )

              signature = channel_signature(
                  channel
              )

              if (
                  signature
                  and channel not in signature_to_canonical[
                      signature
                  ]
              ):

                  signature_to_canonical[
                      signature
                  ].append(
                      channel
                  )

              tvg_id = (
                  entry.get(
                      "attrs",
                      {},
                  )
                  .get(
                      "tvg-id",
                      "",
                  )
                  .strip()
                  .lower()
              )

              if (
                  tvg_id
                  and channel not in tvgid_to_canonical[
                      tvg_id
                  ]
              ):

                  tvgid_to_canonical[
                      tvg_id
                  ].append(
                      channel
                  )

          existing_urls: set[str] = {
              entry["url"]
              for entry in master
          }


          # ============================================================================
          # Smart matcher
          # ============================================================================

          def find_target(
              source_name: str,
              source_attrs: dict | None = None,
              source_group: str | None = None,
          ) -> tuple[str | None, str]:

              source_attrs = (
                  source_attrs or {}
              )

              wanted = preferred_name(
                  clean_source_name(
                      source_name
                  )
              )


              # 1. tvg-id
              source_tvg_id = (
                  source_attrs
                  .get(
                      "tvg-id",
                      "",
                  )
                  .strip()
                  .lower()
              )

              if source_tvg_id:

                  matches = list(
                      dict.fromkeys(
                          tvgid_to_canonical.get(
                              source_tvg_id,
                              [],
                          )
                      )
                  )

                  if len(matches) == 1:
                      return matches[0], "tvg-id"


              # 2. Exact
              if wanted in canonical:
                  return wanted, "exact"


              # 3. Case-insensitive
              exact_casefold = [
                  name
                  for name in canonical
                  if name.casefold()
                  == wanted.casefold()
              ]

              if len(exact_casefold) == 1:
                  return exact_casefold[0], "case-insensitive"


              # 4. Normalized
              norm_key = normalize(
                  wanted
              )

              normalized_matches = list(
                  dict.fromkeys(
                      norm_to_canonical.get(
                          norm_key,
                          [],
                      )
                  )
              )

              if len(normalized_matches) == 1:
                  return normalized_matches[0], "normalized"


              # 5. Signature
              signature = channel_signature(
                  wanted
              )

              signature_matches = list(
                  dict.fromkeys(
                      signature_to_canonical.get(
                          signature,
                          [],
                      )
                  )
              )

              if len(signature_matches) == 1:

                  target = signature_matches[
                      0
                  ]

                  target_group = next(
                      (
                          member.get(
                              "group",
                              "",
                          )
                          for member
                          in canonical[
                              target
                          ]
                          if member.get(
                              "group",
                              "",
                          )
                      ),
                      "",
                  )

                  if group_compatible(
                      source_group,
                      target_group,
                  ):
                      return target, "signature"


              # 6. Fuzzy
              wanted_tokens = normalized_tokens(
                  wanted
              )

              if (
                  len(wanted_tokens) == 1
                  and len(
                      wanted_tokens[0]
                  ) <= 4
              ):
                  return None, "none"

              scored: list[
                  tuple[
                      float,
                      float,
                      float,
                      str,
                  ]
              ] = []

              for (
                  candidate_name,
                  members,
              ) in canonical.items():

                  target_group = next(
                      (
                          member.get(
                              "group",
                              "",
                          )
                          for member
                          in members
                          if member.get(
                              "group",
                              "",
                          )
                      ),
                      "",
                  )

                  if not group_compatible(
                      source_group,
                      target_group,
                  ):
                      continue

                  seq_score = text_similarity(
                      wanted,
                      candidate_name,
                  )

                  token_score = token_similarity(
                      wanted,
                      candidate_name,
                  )

                  sig_a = channel_signature(
                      wanted
                  )

                  sig_b = channel_signature(
                      candidate_name
                  )

                  signature_score = (
                      SequenceMatcher(
                          None,
                          sig_a,
                          sig_b,
                      ).ratio()
                      if sig_a and sig_b
                      else 0.0
                  )

                  combined = (
                      token_score * 0.50
                      + signature_score * 0.30
                      + seq_score * 0.20
                  )

                  scored.append(
                      (
                          combined,
                          token_score,
                          seq_score,
                          candidate_name,
                      )
                  )

              if not scored:
                  return None, "none"

              scored.sort(
                  key=lambda item: item[0],
                  reverse=True,
              )

              best = scored[0]

              best_combined = best[0]
              best_token = best[1]
              best_seq = best[2]
              best_name = best[3]

              second_score = (
                  scored[1][0]
                  if len(scored) > 1
                  else 0.0
              )

              margin = (
                  best_combined
                  - second_score
              )

              very_strong = (
                  best_combined >= 0.92
                  and best_seq >= 0.88
              )

              strong_tokens = (
                  best_token >= 0.80
                  and best_combined >= 0.88
              )

              clear_winner = (
                  margin >= 0.06
              )

              if (
                  clear_winner
                  and (
                      very_strong
                      or strong_tokens
                  )
              ):
                  return best_name, "fuzzy"

              return None, "none"


          # ============================================================================
          # Process merge candidates
          # ============================================================================

          new_backups: list[
              tuple[str, str, str]
          ] = []

          new_channels: list[
              tuple[str, str, str]
          ] = []

          new_channel_candidates: list[
              tuple[str, str, str]
          ] = []

          match_method_counts: dict[
              str,
              int,
          ] = defaultdict(int)

          skipped_unclassified = 0
          skipped_no_logo = 0
          skipped_backup_limit = 0
          skipped_adult_limit = 0

          for src in candidates:

              url = src[
                  "url"
              ]

              if url in existing_urls:
                  continue

              source_name = preferred_name(
                  src[
                      "name"
                  ]
              )

              source_group = guess_group(
                  source_name,
                  src[
                      "attrs"
                  ].get(
                      "group-title",
                      "",
                  ),
              )

              target, match_method = find_target(
                  src[
                      "name"
                  ],
                  src.get(
                      "attrs",
                      {},
                  ),
                  source_group,
              )


              # ------------------------------------------------------------------------
              # Existing channel -> add backup
              # ------------------------------------------------------------------------

              if target:

                  match_method_counts[
                      match_method
                  ] += 1

                  current = canonical[
                      target
                  ]

                  backup_count = sum(
                      1
                      for item in current
                      if backup_number(
                          item[
                              "name"
                          ]
                      ) > 0
                  )

                  if backup_count >= MAX_BACKUPS:

                      skipped_backup_limit += 1

                      continue

                  primary = next(
                      (
                          item
                          for item in current
                          if backup_number(
                              item[
                                  "name"
                              ]
                          ) == 0
                      ),
                      current[
                          0
                      ],
                  )

                  next_number = (
                      max(
                          backup_number(
                              item[
                                  "name"
                              ]
                          )
                          for item in current
                      )
                      + 1
                  )

                  new_entry = deepcopy(
                      primary
                  )

                  new_entry[
                      "name"
                  ] = (
                      f"{target} "
                      f"[Backup {next_number}]"
                  )

                  new_entry[
                      "canonical"
                  ] = target

                  new_entry[
                      "url"
                  ] = url

                  new_entry[
                      "extras"
                  ] = deepcopy(
                      src.get(
                          "extras",
                          [],
                      )
                  )

                  new_entry[
                      "logo"
                  ] = (
                      primary.get(
                          "logo",
                          "",
                      )
                      or src[
                          "attrs"
                      ].get(
                          "tvg-logo",
                          "",
                      )
                  )

                  master.append(
                      new_entry
                  )

                  canonical[
                      target
                  ].append(
                      new_entry
                  )

                  existing_urls.add(
                      url
                  )

                  new_backups.append(
                      (
                          new_entry[
                              "name"
                          ],
                          url,
                          match_method,
                      )
                  )

                  continue


              # ------------------------------------------------------------------------
              # Completely new channel
              # ------------------------------------------------------------------------

              name = source_name
              group = source_group

              if not group:

                  skipped_unclassified += 1

                  continue

              logo = src[
                  "attrs"
              ].get(
                  "tvg-logo",
                  "",
              )

              if not logo:

                  skipped_no_logo += 1

                  continue


              # ------------------------------------------------------------------------
              # Automatic-add policy
              # ------------------------------------------------------------------------

              if group == "Adult":

                  current_new_adult = sum(
                      1
                      for (
                          _name,
                          existing_group,
                          _url,
                      ) in new_channels
                      if existing_group == "Adult"
                  )

                  if (
                      current_new_adult
                      >= MAX_NEW_ADULT_CHANNELS
                  ):

                      skipped_adult_limit += 1

                      new_channel_candidates.append(
                          (
                              name,
                              group,
                              url,
                          )
                      )

                      continue

              else:

                  current_new_normal = sum(
                      1
                      for (
                          _name,
                          existing_group,
                          _url,
                      ) in new_channels
                      if existing_group != "Adult"
                  )

                  if (
                      current_new_normal
                      >= MAX_NEW_CHANNELS
                  ):

                      new_channel_candidates.append(
                          (
                              name,
                              group,
                              url,
                          )
                      )

                      continue


              # ------------------------------------------------------------------------
              # Auto-add approved new channel
              # ------------------------------------------------------------------------

              new_entry = {
                  "attrs": deepcopy(
                      src[
                          "attrs"
                      ]
                  ),
                  "name": name,
                  "canonical": name,
                  "url": url,
                  "extras": deepcopy(
                      src.get(
                          "extras",
                          [],
                      )
                  ),
                  "group": group,
                  "logo": logo,
              }

              master.append(
                  new_entry
              )

              canonical[
                  name
              ].append(
                  new_entry
              )

              norm_key = normalize(
                  name
              )

              if (
                  name
                  not in norm_to_canonical[
                      norm_key
                  ]
              ):

                  norm_to_canonical[
                      norm_key
                  ].append(
                      name
                  )

              signature = channel_signature(
                  name
              )

              if (
                  signature
                  and name
                  not in signature_to_canonical[
                      signature
                  ]
              ):

                  signature_to_canonical[
                      signature
                  ].append(
                      name
                  )

              tvg_id = (
                  src[
                      "attrs"
                  ]
                  .get(
                      "tvg-id",
                      "",
                  )
                  .strip()
                  .lower()
              )

              if (
                  tvg_id
                  and name
                  not in tvgid_to_canonical[
                      tvg_id
                  ]
              ):

                  tvgid_to_canonical[
                      tvg_id
                  ].append(
                      name
                  )

              existing_urls.add(
                  url
              )

              new_channels.append(
                  (
                      name,
                      group,
                      url,
                  )
              )


          # ============================================================================
          # Collapse duplicate held-back channel candidates
          # ============================================================================

          raw_new_channel_candidate_streams = len(
              new_channel_candidates
          )

          candidate_groups: dict[
              tuple[str, str],
              list[
                  tuple[
                      str,
                      str,
                      str,
                  ]
              ],
          ] = defaultdict(list)

          for (
              name,
              group,
              url,
          ) in new_channel_candidates:

              candidate_groups[
                  (
                      normalize(
                          name
                      ),
                      group,
                  )
              ].append(
                  (
                      name,
                      group,
                      url,
                  )
              )

          new_channel_candidates = [
              variants[
                  0
              ]
              for variants
              in candidate_groups.values()
          ]


          # ============================================================================
          # URL deduplication
          # ============================================================================

          seen_urls: set[str] = set()

          deduplicated: list[dict] = []

          duplicate_removed: list[
              tuple[str, str]
          ] = []

          for entry in master:

              if entry[
                  "url"
              ] in seen_urls:

                  duplicate_removed.append(
                      (
                          entry[
                              "name"
                          ],
                          entry[
                              "url"
                          ],
                      )
                  )

                  continue

              seen_urls.add(
                  entry[
                      "url"
                  ]
              )

              deduplicated.append(
                  entry
              )

          master = deduplicated


          # ============================================================================
          # Normalize channel families
          # ============================================================================

          families: dict[
              str,
              list[dict],
          ] = defaultdict(list)

          for entry in master:

              canonical_name = strip_backup(
                  entry[
                      "canonical"
                  ]
                  or entry[
                      "name"
                  ]
              )

              entry[
                  "canonical"
              ] = canonical_name

              families[
                  canonical_name
              ].append(
                  entry
              )

          promoted_primaries: list[
              str
          ] = []

          renumbered_backups: list[
              tuple[
                  str,
                  str,
              ]
          ] = []

          metadata_synced = 0

          normalized_master: list[
              dict
          ] = []

          for (
              canonical_name,
              members,
          ) in families.items():

              members.sort(
                  key=lambda item: (
                      0
                      if backup_number(
                          item[
                              "name"
                          ]
                      ) == 0
                      else 1,
                      backup_number(
                          item[
                              "name"
                          ]
                      ),
                      item[
                          "name"
                      ].lower(),
                  )
              )

              existing_primary = next(
                  (
                      item
                      for item
                      in members
                      if backup_number(
                          item[
                              "name"
                          ]
                      ) == 0
                  ),
                  None,
              )

              primary = (
                  existing_primary
                  if existing_primary
                  else members[
                      0
                  ]
              )

              if existing_primary is None:

                  promoted_primaries.append(
                      canonical_name
                  )

              canonical_group = primary.get(
                  "group",
                  "",
              )

              if not canonical_group:

                  canonical_group = next(
                      (
                          member.get(
                              "group",
                              "",
                          )
                          for member
                          in members
                          if member.get(
                              "group",
                              "",
                          )
                      ),
                      "",
                  )

              if not canonical_group:

                  canonical_group = (
                      confident_existing_group(
                          canonical_name
                      )
                      or ""
                  )

              canonical_logo = primary.get(
                  "logo",
                  "",
              )

              if not canonical_logo:

                  canonical_logo = next(
                      (
                          member.get(
                              "logo",
                              "",
                          )
                          for member
                          in members
                          if member.get(
                              "logo",
                              "",
                          )
                      ),
                      "",
                  )

              identity_fields = (
                  "tvg-id",
                  "tvg-language",
                  "tvg-country",
              )

              canonical_attrs: dict[
                  str,
                  str,
              ] = {}

              for field in identity_fields:

                  value = primary[
                      "attrs"
                  ].get(
                      field,
                      "",
                  )

                  if not value:

                      value = next(
                          (
                              member[
                                  "attrs"
                              ].get(
                                  field,
                                  "",
                              )
                              for member
                              in members
                              if member[
                                  "attrs"
                              ].get(
                                  field,
                                  "",
                              )
                          ),
                          "",
                      )

                  if value:

                      canonical_attrs[
                          field
                      ] = value

              others = [
                  member
                  for member
                  in members
                  if member is not primary
              ]

              others.sort(
                  key=lambda item: (
                      backup_number(
                          item[
                              "name"
                          ]
                      ),
                      item[
                          "name"
                      ].lower(),
                  )
              )

              ordered_family = [
                  primary
              ] + others

              for (
                  index,
                  member,
              ) in enumerate(
                  ordered_family
              ):

                  old_name = member[
                      "name"
                  ]

                  if index == 0:

                      new_name = canonical_name

                  else:

                      new_name = (
                          f"{canonical_name} "
                          f"[Backup {index}]"
                      )

                  if old_name != new_name:

                      renumbered_backups.append(
                          (
                              old_name,
                              new_name,
                          )
                      )

                  member[
                      "name"
                  ] = new_name

                  member[
                      "canonical"
                  ] = canonical_name

                  old_group = member.get(
                      "group",
                      "",
                  )

                  old_logo = member.get(
                      "logo",
                      "",
                  )

                  member[
                      "group"
                  ] = canonical_group

                  member[
                      "logo"
                  ] = canonical_logo

                  if (
                      old_group != canonical_group
                      or old_logo != canonical_logo
                  ):

                      metadata_synced += 1

                  for (
                      field,
                      value,
                  ) in canonical_attrs.items():

                      old_value = member[
                          "attrs"
                      ].get(
                          field,
                          "",
                      )

                      if old_value != value:

                          member[
                              "attrs"
                          ][
                              field
                          ] = value

                          metadata_synced += 1

                  normalized_master.append(
                      member
                  )

          master = normalized_master


          # ============================================================================
          # Candidate state
          # ============================================================================

          candidate_identity = sorted(
              {
                  (
                      normalize(
                          name
                      ),
                      group,
                  )
                  for (
                      name,
                      group,
                      _url,
                  ) in new_channel_candidates
              }
          )

          candidate_state_data = [
              {
                  "channel": name,
                  "group": group,
              }
              for (
                  name,
                  group,
              ) in candidate_identity
          ]

          previous_candidate_state: list[
              dict
          ] = []

          if CANDIDATE_STATE.exists():

              try:

                  previous_candidate_state = json.loads(
                      CANDIDATE_STATE.read_text(
                          encoding="utf-8",
                      )
                  )

              except (
                  json.JSONDecodeError,
                  OSError,
              ):

                  previous_candidate_state = []

          candidate_changed = (
              previous_candidate_state
              != candidate_state_data
          )


          # ============================================================================
          # Sort
          # ============================================================================

          rank = {
              group: index
              for (
                  index,
                  group,
              ) in enumerate(
                  GROUP_ORDER
              )
          }

          master.sort(
              key=lambda entry: (
                  rank.get(
                      entry[
                          "group"
                      ],
                      999,
                  ),
                  normalize(
                      entry[
                          "canonical"
                      ]
                  ),
                  backup_number(
                      entry[
                          "name"
                      ]
                  ),
                  entry[
                      "name"
                  ].lower(),
              )
          )


          # ============================================================================
          # Serialize playlist
          # ============================================================================

          output = list(
              master_header
          )

          output += [
              '#PLAYLIST-STUDIO-NAME:"SAEID RAHMAN - IPTV Playlist"',
              (
                  "#PLAYLIST-STUDIO-CATEGORIES:"
                  + json.dumps(
                      GROUP_ORDER,
                      ensure_ascii=False,
                  )
              ),
          ]

          for (
              number,
              entry,
          ) in enumerate(
              master,
              1,
          ):

              output.append(
                  serialize_extinf(
                      entry,
                      number,
                  )
              )

              output.extend(
                  entry.get(
                      "extras",
                      [],
                  )
              )

              output.append(
                  entry[
                      "url"
                  ]
              )

          new_master_text = (
              "\ufeff"
              + "\n".join(
                  output
              )
              + "\n"
          )

          playlist_changed = (
              original_master_text.lstrip(
                  "\ufeff"
              )
              != new_master_text.lstrip(
                  "\ufeff"
              )
          )

          meaningful_change = (
              playlist_changed
              or candidate_changed
          )

          if not meaningful_change:

              print(
                  "No playlist changes and no candidate-set changes."
              )

              print(
                  "Nothing will be written or committed."
              )

              raise SystemExit(
                  0
              )


          # ============================================================================
          # Write files
          # ============================================================================

          if playlist_changed:

              atomic_write(
                  MASTER,
                  new_master_text,
              )

              print(
                  f"Playlist written: "
                  f"{len(master)} stream entries"
              )

          else:

              print(
                  "Playlist unchanged; only candidate state changed."
              )

          atomic_write(
              CANDIDATE_STATE,
              json.dumps(
                  candidate_state_data,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
          )


          # ============================================================================
          # Statistics
          # ============================================================================

          canonical_channels = len(
              {
                  entry[
                      "canonical"
                  ]
                  for entry
                  in master
              }
          )

          total_backups = sum(
              1
              for entry
              in master
              if backup_number(
                  entry[
                      "name"
                  ]
              ) > 0
          )

          group_counts: dict[
              str,
              int,
          ] = defaultdict(
              int
          )

          for entry in master:

              group_counts[
                  entry[
                      "group"
                  ]
              ] += 1

          new_adult_channels = [
              item
              for item
              in new_channels
              if item[
                  1
              ] == "Adult"
          ]

          adult_candidates = [
              item
              for item
              in new_channel_candidates
              if item[
                  1
              ] == "Adult"
          ]


          # ============================================================================
          # Report
          # ============================================================================

          now = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          report: list[str] = [
              "# 🤖 IPTV Auto Update",
              "",
              f"Generated: **{now}**",
              "",
              "## Summary",
              "",
              "| Metric | Count |",
              "|---|---:|",
              f"| Final canonical channels | **{canonical_channels}** |",
              f"| Final stream URLs | **{len(master)}** |",
              f"| Final backup streams | **{total_backups}** |",
              f"| New backup streams added | **{len(new_backups)}** |",
              f"| New channels auto-added | **{len(new_channels)}** |",
              f"| New Adult channels auto-added | **{len(new_adult_channels)}** |",
              f"| Adult candidates held back after limit | **{len(adult_candidates)}** |",
              f"| Unique new channel candidates held back | **{len(new_channel_candidates)}** |",
              f"| Source stream URLs represented by candidates | **{raw_new_channel_candidate_streams}** |",
              f"| Bad/expired existing entries removed | **{len(cleaned_existing)}** |",
              f"| Existing category corrections | **{len(corrected_groups)}** |",
              f"| Missing primaries promoted | **{len(promoted_primaries)}** |",
              f"| Backup names promoted/renumbered | **{len(renumbered_backups)}** |",
              f"| Family metadata synchronizations | **{metadata_synced}** |",
              f"| Wrapper/proxy URLs resolved | **{proxy_resolved}** |",
              f"| Blocked URLs skipped without replacement | **{blocked_skipped}** |",
              f"| Malformed source URLs skipped | **{malformed_skipped}** |",
              f"| Duplicate URLs removed | **{len(duplicate_removed)}** |",
          ]

          report += [
              "",
              "## Final category distribution",
              "",
              "| Category | Stream entries |",
              "|---|---:|",
          ]

          for group in GROUP_ORDER:

              report.append(
                  f"| {group} | **{group_counts.get(group, 0)}** |"
              )


          if match_method_counts:

              report += [
                  "",
                  "## Existing-channel matching",
                  "",
                  "| Matching method | Backups recognized |",
                  "|---|---:|",
              ]

              for method in (
                  "tvg-id",
                  "exact",
                  "case-insensitive",
                  "normalized",
                  "signature",
                  "fuzzy",
              ):

                  count = match_method_counts.get(
                      method,
                      0,
                  )

                  if count:

                      report.append(
                          f"| {method} | **{count}** |"
                      )


          if new_adult_channels:

              report += [
                  "",
                  "## New Adult channels automatically added",
                  "",
              ]

              for (
                  name,
                  group,
                  url,
              ) in new_adult_channels:

                  report.append(
                      f"- **{name}** — `{url}`"
                  )


          if cleaned_existing:

              report += [
                  "",
                  "## Removed blocked / expired entries",
                  "",
              ]

              for (
                  name,
                  url,
              ) in cleaned_existing:

                  report.append(
                      f"- **{name}** — `{url}`"
                  )


          if corrected_groups:

              report += [
                  "",
                  "## Category corrections",
                  "",
              ]

              for (
                  name,
                  old_group,
                  new_group,
              ) in corrected_groups:

                  report.append(
                      f"- **{name}**: "
                      f"`{old_group}` → `{new_group}`"
                  )


          if promoted_primaries:

              report += [
                  "",
                  "## Promoted backup streams",
                  "",
              ]

              for channel in promoted_primaries:

                  report.append(
                      f"- **{channel}**"
                  )


          if renumbered_backups:

              report += [
                  "",
                  "## Backup normalization",
                  "",
              ]

              for (
                  old_name,
                  new_name,
              ) in renumbered_backups:

                  report.append(
                      f"- `{old_name}` → `{new_name}`"
                  )


          if new_channel_candidates:

              report += [
                  "",
                  (
                      "## Unique new channel candidates"
                  ),
                  "",
                  (
                      f"Normal auto-add limit: `{MAX_NEW_CHANNELS}`  "
                      f"Adult auto-add limit: `{MAX_NEW_ADULT_CHANNELS}`"
                  ),
                  "",
              ]

              for (
                  name,
                  group,
                  url,
              ) in sorted(
                  new_channel_candidates,
                  key=lambda item: (
                      GROUP_ORDER.index(
                          item[
                              1
                          ]
                      )
                      if item[
                          1
                      ] in GROUP_ORDER
                      else 999,
                      normalize(
                          item[
                              0
                          ]
                      ),
                  ),
              ):

                  report.append(
                      f"- **{name}** "
                      f"(`{group}`) — `{url}`"
                  )


          if new_backups:

              report += [
                  "",
                  "## New backup streams",
                  "",
              ]

              for (
                  name,
                  url,
                  method,
              ) in new_backups:

                  report.append(
                      f"- **{name}** "
                      f"— match: `{method}` "
                      f"— `{url}`"
                  )


          if duplicate_removed:

              report += [
                  "",
                  "## Duplicate stream URLs removed",
                  "",
              ]

              for (
                  name,
                  url,
              ) in duplicate_removed:

                  report.append(
                      f"- **{name}** — `{url}`"
                  )


          report += [
              "",
              "## Safety",
              "",
              f"- Unclassified new channels skipped: **{skipped_unclassified}**",
              f"- New channels without logos skipped: **{skipped_no_logo}**",
              (
                  "- Channels already at the new-backup limit "
                  f"({MAX_BACKUPS}) skipped: **{skipped_backup_limit}**"
              ),
              (
                  "- Adult channels beyond the per-run auto-add limit "
                  f"({MAX_NEW_ADULT_CHANNELS}) held back: **{skipped_adult_limit}**"
              ),
              "",
              "> Normal new channels are review-only because "
              "`MAX_NEW_CHANNELS=0`.",
              "",
              "> Adult channels may be automatically added up to "
              f"`MAX_NEW_ADULT_CHANNELS={MAX_NEW_ADULT_CHANNELS}` per run.",
              "",
              "> Adult classification uses strong indicators only. Generic words "
              "such as `hot`, `passion`, and `venus` are intentionally not used "
              "as automatic Adult indicators.",
              "",
              "> The updater never deletes a stream merely because GitHub's "
              "overseas runner cannot connect to it. This protects BDIX/local-only "
              "streams that may work correctly inside Bangladesh.",
              "",
          ]

          atomic_write(
              REPORT,
              "\n".join(
                  report
              ),
          )


          # ============================================================================
          # Commit message
          # ============================================================================

          summary_parts: list[str] = []

          if new_backups:

              summary_parts.append(
                  f"+{len(new_backups)} backups"
              )

          if new_adult_channels:

              summary_parts.append(
                  f"+{len(new_adult_channels)} adult channels"
              )

          normal_added = (
              len(new_channels)
              - len(new_adult_channels)
          )

          if normal_added:

              summary_parts.append(
                  f"+{normal_added} other channels"
              )

          if cleaned_existing:

              summary_parts.append(
                  f"-{len(cleaned_existing)} expired/bad"
              )

          if duplicate_removed:

              summary_parts.append(
                  f"-{len(duplicate_removed)} dupes"
              )

          if corrected_groups:

              summary_parts.append(
                  f"{len(corrected_groups)} category fixes"
              )

          if promoted_primaries:

              summary_parts.append(
                  f"{len(promoted_primaries)} primary promotions"
              )

          if renumbered_backups:

              summary_parts.append(
                  f"{len(renumbered_backups)} backup normalizations"
              )

          if (
              candidate_changed
              and not playlist_changed
          ):

              summary_parts.append(
                  "candidate list updated"
              )

          if not summary_parts:

              summary_parts.append(
                  "playlist normalized"
              )

          summary = ", ".join(
              summary_parts
          )

          github_output = os.environ.get(
              "GITHUB_OUTPUT"
          )

          if github_output:

              with open(
                  github_output,
                  "a",
                  encoding="utf-8",
              ) as handle:

                  handle.write(
                      f"summary={summary}\n"
                  )

          print(
              f"Done: {summary}"
          )

          PY


      - name: Commit changes
        shell: bash
        env:
          UPDATE_SUMMARY: ${{ steps.updater.outputs.summary }}
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "IPTV Update Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SUMMARY="${UPDATE_SUMMARY:-auto-update}"

          git commit -m "bot: ${SUMMARY}"

          git pull --rebase origin "$GITHUB_REF_NAME"

          git push origin "HEAD:$GITHUB_REF_NAME"

name: Playlist Update

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Dhaka'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_playlist.py'
      - 'scripts/normalize_playlist.py'
      - 'scripts/repair_categories.py'
      - 'scripts/migrate_external_logos.py'
      - 'scripts/fix_selected_logos.py'
      - '.github/workflows/update-playlist.yml'

permissions:
  contents: write

# Only the newest intended playlist update should continue.
# A newer push/manual run cancels an older queued or running update.
concurrency:
  group: iptv-playlist-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Stage 1 — Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage 2 — Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage 3 — Install logo tools
        run: python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Stage 4 — Select channels and generate report
        run: python scripts/update_playlist.py

      - name: Stage 5 — Normalize playlist structure and remove rejected imports
        run: python scripts/normalize_playlist.py

      - name: Stage 6 — Run final category repair
        run: python scripts/repair_categories.py

      - name: Stage 7 — Migrate external channel logos
        run: python scripts/migrate_external_logos.py

      - name: Stage 8 — Repair selected channel logos
        run: |
          if [ -f scripts/fix_selected_logos.py ]; then
            python scripts/fix_selected_logos.py
          else
            echo 'No selected-logo repair script found; skipping.'
          fi

      - name: Stage 9 — Commit playlist, logos, and reports
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "IPTV Playlist.m3u" "reports/auto-update.md" "reports/playlist-normalization.md" "reports/logo-migration.md" "logos"; then
            echo "No playlist, logo, or report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "IPTV Playlist.m3u" "reports/auto-update.md" "reports/playlist-normalization.md" "reports/logo-migration.md" "logos"
          git commit -m "Normalize playlist structure and update logos"
          git push origin HEAD:main

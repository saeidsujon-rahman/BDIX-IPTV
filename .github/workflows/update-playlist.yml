name: Playlist Update

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Dhaka'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_playlist.py'
      - 'scripts/strict_update.py'
      - 'scripts/migrate_external_logos.py'
      - 'scripts/generate_detailed_report.py'
      - '.github/workflows/update-playlist.yml'

permissions:
  contents: write

# Serialize all workflows that write to main.
concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install logo conversion dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Update playlist
        run: python scripts/update_playlist.py

      - name: Download external logos and convert to local PNG
        run: python scripts/migrate_external_logos.py

      - name: Generate detailed update and logo report
        run: python scripts/generate_detailed_report.py

      - name: Commit playlist, local logos, and report
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "IPTV Playlist.m3u"
            "reports/auto-update.md"
            "logos/"
          )

          if git diff --quiet -- "${files[@]}"; then
            echo "No playlist, logo, or report changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Update playlist, local logos, and detailed report"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Playlist, logo, and report changes pushed successfully on attempt ${attempt}."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying."
            sleep 3
          done

          echo "Unable to push after 3 attempts."
          exit 1

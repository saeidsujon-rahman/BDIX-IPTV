name: IPTV Auto Update

on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC = 08:30 Bangladesh time
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update playlist
        id: updater
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import unicodedata
          import urllib.error
          import urllib.request

          from collections import defaultdict
          from copy import deepcopy
          from datetime import datetime, timezone
          from pathlib import Path


          # ============================================================================
          # Configuration
          # ============================================================================

          MASTER = Path("IPTV Playlist.m3u")
          REPORT = Path("reports/auto-update.md")
          CANDIDATE_STATE = Path("reports/auto-update-candidates.json")

          MERGE_SOURCE = (
              "https://raw.githubusercontent.com/"
              "ahmedstore75/Bdixplaylist/main/playlist.m3u"
          )

          LOOKUP_SOURCE = (
              "https://raw.githubusercontent.com/"
              "ahmedstore75/Iptvbdlive/main/mixiptvchannel.m3u"
          )

          MAX_BACKUPS = 8

          # 0 = discover/report new channels but never automatically add them.
          MAX_NEW_CHANNELS = 0

          GROUP_ORDER = [
              "Bangladesh",
              "Indian Bangla",
              "Indian Movies",
              "Indian Music",
              "Indian Entertainment",
              "International Movies",
              "International Music",
              "Documentary & Wildlife",
              "Sports",
              "Kids",
              "Religious",
          ]


          # ============================================================================
          # Channel-name aliases
          #
          # Keep these conservative. Only aliases representing the same channel should
          # be placed here.
          # ============================================================================

          ALIASES = {
              "bangla vision": "Banglavision",
              "dbc news hd": "DBC News",
              "ekattor hd": "Ekattor TV",
              "channel i hd": "Channel I",
              "news 24 hd": "News 24",

              "star jalsha hd": "Star Jalsha",
              "jalsha movies hd": "Jalsha Movies",
              "zee bangla hd": "Zee Bangla",
              "sony aath": "Sony AATH",

              "sony sports 2 hd": "Sony Ten 2",
              "sony sports 5 hd": "Sony Ten 5",

              "bangla jago": "Bangla Jago TV",
              "accu weather": "AccuWeather Now",
              "cnbc tv 18": "CNBC TV18",
              "dw": "DW News",
              "trace sport": "Trace Sport Stars",
              "&xplore": "&Xplor HD",
          }


          # ============================================================================
          # Block lists
          # ============================================================================

          # These URLs/domains must never be ADDED from source playlists.
          BLOCKED_NEW = (
              "go.skym3u.dev",
              "iptvlive.ahmed-bd-org.workers.dev",
              "iptv-proxy.ahmed-bd-org.workers.dev",
              "filex.me",
              "proxy.php",
              "premiumtvs.space",
              "premimum.online",
              "ottclub.xyz",
              "vercel.app",
          )

          # These are additionally removed if they already exist in the master.
          #
          # This list is deliberately much narrower.
          #
          # Example:
          # premiumtvs.space may be blocked from NEW additions but an existing
          # user-verified working stream is not automatically deleted.
          BLOCKED_EXISTING = (
              "iptvlive.ahmed-bd-org.workers.dev",
              "iptv-proxy.ahmed-bd-org.workers.dev",
              "vercel.app",
          )


          # ============================================================================
          # Classification data
          # ============================================================================


          INDIAN_BANGLA = (
              "zee bangla",
              "star jalsha",
              "jalsha movies",
              "sony aath",
              "colors bangla",
              "sun bangla",
              "enter 10 bangla",
              "enterr10 bangla",
              "bangla jago",
              "republic bangla",
              "tv9 bangla",
              "sangeet bangla",
          )

          BANGLADESH_NAMES = (
              "atn bangla",
              "atn news",
              "jamuna",
              "somoy",
              "ekattor",
              "dbc",
              "ntv",
              "rtv",
              "channel i",
              "banglavision",
              "bangla vision",
              "boishakhi",
              "duronto",
              "deepto",
              "maasranga",
              "independent",
              "news 24",
              "mohona",
              "bijoy",
              "mytv",
              "desh tv",
              "asian tv",
              "btv",
              "ekushey",
              "channel 24",
          )


          # ============================================================================
          # Utility helpers
          # ============================================================================

          def atomic_write(path: Path, text: str) -> None:
              """
              Write a file atomically.

              Prevents leaving a partially written playlist/report if the process is
              interrupted during the write.
              """
              path.parent.mkdir(parents=True, exist_ok=True)

              tmp = path.with_name(path.name + ".tmp")
              tmp.write_text(text, encoding="utf-8")
              tmp.replace(path)


          def fetch(url: str, attempts: int = 3) -> str:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "SaeidRahman-IPTV-Updater/2.0",
                      "Accept": "*/*",
                  },
              )

              last_error: Exception | None = None

              for attempt in range(1, attempts + 1):
                  try:
                      with urllib.request.urlopen(req, timeout=40) as response:
                          text = response.read().decode(
                              "utf-8-sig",
                              errors="replace",
                          )

                          print(
                              f"Fetched {url} "
                              f"({len(text):,} characters)"
                          )

                          return text

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      OSError,
                  ) as exc:
                      last_error = exc

                      print(
                          f"Attempt {attempt}/{attempts} failed "
                          f"for {url}: {exc}"
                      )

                      if attempt < attempts:
                          time.sleep(5 * attempt)

              raise SystemExit(
                  f"Unable to fetch {url} after "
                  f"{attempts} attempts: {last_error}"
              )


          def valid_stream_url(url: str) -> bool:
              url = url.strip()

              return url.lower().startswith(
                  (
                      "http://",
                      "https://",
                      "rtmp://",
                      "rtsp://",
                      "udp://",
                      "rtp://",
                  )
              )


          def parse_m3u(text: str) -> list[dict]:
              entries: list[dict] = []

              current = None
              extras: list[str] = []

              for raw in text.splitlines():
                  line = raw.strip()

                  if line.startswith("#EXTINF"):
                      attrs = dict(
                          re.findall(
                              r'([\w-]+)="([^"]*)"',
                              line,
                          )
                      )

                      if "," in line:
                          name = line.rsplit(",", 1)[-1].strip()
                      else:
                          name = attrs.get("tvg-name", "").strip()

                      current = {
                          "attrs": attrs,
                          "name": name,
                          "url": None,
                          "extras": [],
                      }

                      extras = []

                  elif current and (
                      not line or line.startswith("#")
                  ):
                      extras.append(raw)

                  elif current and line:
                      current["url"] = line
                      current["extras"] = extras[:]

                      if (
                          current["name"]
                          and current["url"]
                          and valid_stream_url(current["url"])
                      ):
                          entries.append(current)

                      current = None
                      extras = []

              return entries


          def extract_header_lines(text: str) -> list[str]:
              """
              Preserve master-playlist header metadata, including values such as:

                  #EXTM3U x-tvg-url="..."

              Playlist Studio metadata is regenerated separately.
              """
              result: list[str] = []

              for raw in text.splitlines():
                  line = raw.strip()

                  if line.startswith("#EXTINF"):
                      break

                  if not line:
                      continue

                  if line.startswith("\ufeff"):
                      line = line.lstrip("\ufeff")

                  if line.startswith("#PLAYLIST-STUDIO-NAME:"):
                      continue

                  if line.startswith("#PLAYLIST-STUDIO-CATEGORIES:"):
                      continue

                  result.append(line)

              if not result or not result[0].startswith("#EXTM3U"):
                  result.insert(0, "#EXTM3U")

              return result


          def strip_backup(name: str) -> str:
              return re.sub(
                  r"\s*\[Backup\s*\d+\]\s*$",
                  "",
                  name,
                  flags=re.I,
              ).strip()


          def backup_number(name: str) -> int:
              match = re.search(
                  r"\[Backup\s*(\d+)\]\s*$",
                  name,
                  flags=re.I,
              )

              if match:
                  return int(match.group(1))

              return 0


          def preferred_name(name: str) -> str:
              clean = strip_backup(name)

              return ALIASES.get(
                  clean.lower(),
                  clean,
              )


          def normalize(name: str) -> str:
              name = preferred_name(name)

              name = unicodedata.normalize(
                  "NFKD",
                  name,
              )

              name = name.lower().replace("&", "and")

              name = re.sub(
                  r"\b(fhd|uhd|hd|sd|4k|1080p|720p)\b",
                  " ",
                  name,
              )

              name = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  name,
              )

              return " ".join(name.split())


          def has(text: str, words) -> bool:
              low = text.lower()

              return any(
                  word in low
                  for word in words
              )


          def is_blocked(
              url: str,
              existing: bool = False,
          ) -> bool:
              low = url.lower()

              domains = (
                  BLOCKED_EXISTING
                  if existing
                  else BLOCKED_NEW
              )

              if any(
                  domain in low
                  for domain in domains
              ):
                  return True

              # Ayna-style signed URL:
              #
              # ?e=1753741197
              #
              # Remove only if the Unix expiry time is definitely in the past.
              match = re.search(
                  r"(?:[?&])e=(\d{10})(?:&|$)",
                  url,
              )

              if match:
                  try:
                      if int(match.group(1)) < int(time.time()):
                          return True
                  except ValueError:
                      pass

              return False


          # ============================================================================
          # Classification
          # ============================================================================

          def guess_group(
              name: str,
              source_group: str,
          ) -> str | None:
              g = (source_group or "").strip()
              gl = g.lower()
              nl = name.lower()

              if g in GROUP_ORDER:
                  return g

              # Indian Bengali identity is checked before generic news logic.
              if has(nl, INDIAN_BANGLA):
                  return "Indian Bangla"

              if (
                  "sport" in gl
                  or "sport" in nl
                  or "cricket" in nl
              ):
                  return "Sports"

              if (
                  "kid" in gl
                  or has(
                      nl,
                      (
                          "cartoon",
                          "nick",
                          "disney",
                          "kids",
                          "baby",
                          "pogo",
                      ),
                  )
              ):
                  return "Kids"

              if (
                  "relig" in gl
                  or has(
                      nl,
                      (
                          "quran",
                          "islam",
                          "peace tv",
                          "aastha",
                          "sanskar",
                          "bhakti",
                      ),
                  )
              ):
                  return "Religious"

              if (
                  "document" in gl
                  or has(
                      nl,
                      (
                          "discovery",
                          "nat geo",
                          "national geographic",
                          "animal planet",
                          "history",
                          "wild",
                          "nature",
                      ),
                  )
              ):
                  return "Documentary & Wildlife"

              if (
                  "bangladesh" in gl
                  or gl in {
                      "bd",
                      "bangladesh tv",
                  }
              ):
                  return "Bangladesh"

              if has(
                  nl,
                  BANGLADESH_NAMES,
              ):
                  return "Bangladesh"

              if has(
                  nl,
                  (
                      "channel 1",
                      "btv news",
                      "btv shangshad",
                      "btv parliament",
                      "sangsad",
                  ),
              ):
                  return "Bangladesh"

              if (
                  "news" in gl
                  or has(
                      nl,
                      (
                          "news",
                          "cnbc",
                          "cnn",
                          "wion",
                          "dw",
                          "al jazeera",
                          "bloomberg",
                      ),
                  )
              ):
                  if has(
                      nl,
                      INDIAN_NEWS,
                  ):
                      return "Indian News"

                  return "International News"

              if (
                  gl in {
                      "bangla",
                      "bengali",
                  }
                  or "bangla" in gl
              ):
                  if has(
                      nl,
                      INDIAN_BANGLA,
                  ):
                      return "Indian Bangla"

                  if has(
                      nl,
                      BANGLADESH_NAMES,
                  ):
                      return "Bangladesh"

                  return None

              if gl in {
                  "india",
                  "indian",
              }:
                  if has(
                      nl,
                      INDIAN_NEWS,
                  ):
                      return "Indian News"

                  if has(
                      nl,
                      (
                          "music",
                          "mtv",
                          "9xm",
                          "zoom",
                          "sangeet",
                      ),
                  ):
                      return "Indian Music"

                  if has(
                      nl,
                      (
                          "movie",
                          "cinema",
                          "cineplex",
                          "movies",
                      ),
                  ):
                      return "Indian Movies"

                  return "Indian Entertainment"

              if (
                  "movie" in gl
                  or "cinema" in gl
              ):
                  return "International Movies"

              if "music" in gl:
                  return "International Music"

              if (
                  "lifestyle" in gl
                  or has(
                      nl,
                      (
                          "fashion",
                          "food",
                          "travel",
                          "lifestyle",
                      ),
                  )
              ):
                  return "Lifestyle"

              return None


          def confident_existing_group(
              name: str,
          ) -> str | None:
              """
              Conservative corrections for existing master channels.

              This does NOT blindly run source-group inference across the whole master.
              Only categories that can be inferred confidently from the channel name
              itself are returned.
              """
              nl = name.lower()

              if has(
                  nl,
                  INDIAN_BANGLA,
              ):
                  return "Indian Bangla"

              if has(
                  nl,
                  BANGLADESH_NAMES,
              ):
                  return "Bangladesh"

              if has(
                  nl,
                  (
                      "channel 1",
                      "btv news",
                      "btv shangshad",
                      "btv parliament",
                      "sangsad",
                  ),
              ):
                  return "Bangladesh"

              if has(
                  nl,
                  (
                      "discovery",
                      "animal planet",
                      "nat geo",
                      "national geographic",
                  ),
              ):
                  return "Documentary & Wildlife"

              if (
                  "sport" in nl
                  or "cricket" in nl
                  or has(
                      nl,
                      (
                          "sony ten",
                          "star sports",
                          "eurosport",
                          "bein sports",
                      ),
                  )
              ):
                  return "Sports"

              if has(
                  nl,
                  (
                      "cartoon network",
                      "nickelodeon",
                      "nick jr",
                      "disney junior",
                      "pogo",
                  ),
              ):
                  return "Kids"

              return None


          # ============================================================================
          # Serialization
          # ============================================================================

          def serialize_extinf(
              entry: dict,
              chno: int,
          ) -> str:
              attrs = dict(entry["attrs"])

              attrs["tvg-name"] = entry["name"]
              attrs["tvg-chno"] = str(chno)
              attrs["group-title"] = entry["group"]

              if entry["logo"]:
                  attrs["tvg-logo"] = entry["logo"]
              else:
                  attrs.pop("tvg-logo", None)

              preferred_order = [
                  "tvg-id",
                  "tvg-name",
                  "tvg-logo",
                  "tvg-chno",
                  "tvg-language",
                  "tvg-country",
                  "group-title",
              ]

              parts: list[str] = []

              for key in preferred_order:
                  value = attrs.get(key, "")

                  if value != "":
                      parts.append(
                          f'{key}="{value}"'
                      )

              for key, value in attrs.items():
                  if (
                      key not in preferred_order
                      and value != ""
                  ):
                      parts.append(
                          f'{key}="{value}"'
                      )

              return (
                  "#EXTINF:-1 "
                  + " ".join(parts)
                  + ","
                  + entry["name"]
              )


          # ============================================================================
          # Load master
          # ============================================================================

          if not MASTER.exists():
              raise SystemExit(
                  f"Master playlist not found: {MASTER}"
              )

          original_master_text = MASTER.read_text(
              encoding="utf-8-sig",
              errors="replace",
          )

          master_header = extract_header_lines(
              original_master_text
          )

          master_raw = parse_m3u(
              original_master_text
          )

          if not master_raw:
              raise SystemExit(
                  f"Refusing to continue: parsed 0 "
                  f"channels from {MASTER}. "
                  "The playlist may be empty or corrupted."
              )

          print(
              f"Master loaded: "
              f"{len(master_raw)} stream entries"
          )


          # ============================================================================
          # Fetch external sources
          # ============================================================================

          print("Fetching source playlists...")

          merge_text = fetch(
              MERGE_SOURCE
          )

          lookup_text = fetch(
              LOOKUP_SOURCE
          )

          merge_raw = parse_m3u(
              merge_text
          )

          lookup_raw = parse_m3u(
              lookup_text
          )

          print(
              f"Merge source: {len(merge_raw)} entries"
          )

          print(
              f"Lookup source: {len(lookup_raw)} entries"
          )


          # ============================================================================
          # Sweep existing master
          # ============================================================================

          master: list[dict] = []

          cleaned_existing: list[tuple[str, str]] = []
          corrected_groups: list[tuple[str, str, str]] = []

          for entry in master_raw:
              if is_blocked(
                  entry["url"],
                  existing=True,
              ):
                  cleaned_existing.append(
                      (
                          entry["name"],
                          entry["url"],
                      )
                  )

                  continue

              item = deepcopy(entry)

              item["canonical"] = strip_backup(
                  entry["name"]
              )

              item["group"] = entry["attrs"].get(
                  "group-title",
                  "",
              )

              item["logo"] = entry["attrs"].get(
                  "tvg-logo",
                  "",
              )

              suggested_group = confident_existing_group(
                  item["canonical"]
              )

              if (
                  suggested_group
                  and item["group"] != suggested_group
              ):
                  corrected_groups.append(
                      (
                          item["name"],
                          item["group"] or "(blank)",
                          suggested_group,
                      )
                  )

                  item["group"] = suggested_group

              master.append(item)


          # ============================================================================
          # Build lookup-source clean URL index
          # ============================================================================

          lookup: dict[str, list[dict]] = defaultdict(list)

          for entry in lookup_raw:
              if (
                  valid_stream_url(entry["url"])
                  and not is_blocked(entry["url"])
              ):
                  lookup[
                      normalize(entry["name"])
                  ].append(entry)


          # ============================================================================
          # Resolve blocked/wrapper URLs from merge source
          # ============================================================================

          candidates: list[dict] = []

          proxy_resolved = 0
          blocked_skipped = 0
          malformed_skipped = 0

          for entry in merge_raw:
              item = deepcopy(entry)

              if not valid_stream_url(
                  item["url"]
              ):
                  malformed_skipped += 1
                  continue

              if is_blocked(
                  item["url"]
              ):
                  replacements = lookup.get(
                      normalize(item["name"]),
                      [],
                  )

                  replacement = next(
                      (
                          candidate
                          for candidate in replacements
                          if (
                              valid_stream_url(
                                  candidate["url"]
                              )
                              and not is_blocked(
                                  candidate["url"]
                              )
                          )
                      ),
                      None,
                  )

                  if not replacement:
                      blocked_skipped += 1
                      continue

                  item["url"] = replacement["url"]

                  item["extras"] = deepcopy(
                      replacement.get(
                          "extras",
                          [],
                      )
                  )

                  if not item["attrs"].get(
                      "tvg-logo"
                  ):
                      item["attrs"]["tvg-logo"] = (
                          replacement["attrs"].get(
                              "tvg-logo",
                              "",
                          )
                      )

                  proxy_resolved += 1

              candidates.append(item)


          # ============================================================================
          # Build canonical indexes
          # ============================================================================

          canonical: dict[str, list[dict]] = defaultdict(list)

          norm_to_canonical: dict[str, list[str]] = defaultdict(list)

          for entry in master:
              canonical[
                  entry["canonical"]
              ].append(entry)

              norm_to_canonical[
                  normalize(entry["canonical"])
              ].append(
                  entry["canonical"]
              )

          existing_urls: set[str] = {
              entry["url"]
              for entry in master
          }


          def find_target(
              source_name: str,
          ) -> str | None:
              wanted = preferred_name(
                  source_name
              )

              if wanted in canonical:
                  return wanted

              key = normalize(
                  wanted
              )

              choices = list(
                  dict.fromkeys(
                      norm_to_canonical.get(
                          key,
                          [],
                      )
                  )
              )

              if len(choices) == 1:
                  return choices[0]

              for canonical_name in canonical:
                  if (
                      canonical_name.lower()
                      == wanted.lower()
                  ):
                      return canonical_name

              return None


          # ============================================================================
          # Add backups / discover new channels
          # ============================================================================

          new_backups: list[tuple[str, str]] = []

          new_channels: list[tuple[str, str, str]] = []

          new_channel_candidates: list[
              tuple[str, str, str]
          ] = []

          skipped_unclassified = 0
          skipped_no_logo = 0
          skipped_backup_limit = 0

          for src in candidates:
              url = src["url"]

              if url in existing_urls:
                  continue

              target = find_target(
                  src["name"]
              )

              # ------------------------------------------------------------------------
              # Existing channel -> add as backup
              # ------------------------------------------------------------------------

              if target:
                  current = canonical[target]

                  backup_count = sum(
                      1
                      for item in current
                      if backup_number(
                          item["name"]
                      ) > 0
                  )

                  if backup_count >= MAX_BACKUPS:
                      skipped_backup_limit += 1
                      continue

                  primary = next(
                      (
                          item
                          for item in current
                          if backup_number(
                              item["name"]
                          ) == 0
                      ),
                      current[0],
                  )

                  next_number = (
                      max(
                          backup_number(
                              item["name"]
                          )
                          for item in current
                      )
                      + 1
                  )

                  new_entry = deepcopy(
                      primary
                  )

                  new_entry["name"] = (
                      f"{target} "
                      f"[Backup {next_number}]"
                  )

                  new_entry["canonical"] = target
                  new_entry["url"] = url

                  # Preserve stream-specific VLC/referrer/options
                  # from the new source.
                  new_entry["extras"] = deepcopy(
                      src.get(
                          "extras",
                          [],
                      )
                  )

                  new_entry["logo"] = (
                      primary.get(
                          "logo",
                          "",
                      )
                      or src["attrs"].get(
                          "tvg-logo",
                          "",
                      )
                  )

                  master.append(
                      new_entry
                  )

                  canonical[
                      target
                  ].append(
                      new_entry
                  )

                  existing_urls.add(
                      url
                  )

                  new_backups.append(
                      (
                          new_entry["name"],
                          url,
                      )
                  )

                  continue


              # ------------------------------------------------------------------------
              # Completely new channel
              # ------------------------------------------------------------------------

              name = preferred_name(
                  src["name"]
              )

              group = guess_group(
                  name,
                  src["attrs"].get(
                      "group-title",
                      "",
                  ),
              )

              if not group:
                  skipped_unclassified += 1
                  continue

              logo = src["attrs"].get(
                  "tvg-logo",
                  "",
              )

              if not logo:
                  skipped_no_logo += 1
                  continue

              if (
                  len(new_channels)
                  >= MAX_NEW_CHANNELS
              ):
                  new_channel_candidates.append(
                      (
                          name,
                          group,
                          url,
                      )
                  )

                  continue

              new_entry = {
                  "attrs": deepcopy(
                      src["attrs"]
                  ),
                  "name": name,
                  "canonical": name,
                  "url": url,
                  "extras": deepcopy(
                      src.get(
                          "extras",
                          [],
                      )
                  ),
                  "group": group,
                  "logo": logo,
              }

              master.append(
                  new_entry
              )

              canonical[
                  name
              ].append(
                  new_entry
              )

              norm_to_canonical[
                  normalize(name)
              ].append(
                  name
              )

              existing_urls.add(
                  url
              )

              new_channels.append(
                  (
                      name,
                      group,
                      url,
                  )
              )


          # ============================================================================
          # Global URL deduplication
          # ============================================================================

          seen_urls: set[str] = set()
          deduplicated: list[dict] = []

          duplicate_removed: list[
              tuple[str, str]
          ] = []

          for entry in master:
              if entry["url"] in seen_urls:
                  duplicate_removed.append(
                      (
                          entry["name"],
                          entry["url"],
                      )
                  )

                  continue

              seen_urls.add(
                  entry["url"]
              )

              deduplicated.append(
                  entry
              )

          master = deduplicated


          # ============================================================================
          # Normalize channel families
          #
          # Important:
          #
          # 1. If primary disappeared, promote first surviving backup.
          # 2. Rename remaining backups sequentially.
          # 3. Synchronize channel identity metadata.
          # ============================================================================

          families: dict[str, list[dict]] = defaultdict(list)

          for entry in master:
              canonical_name = strip_backup(
                  entry["canonical"]
                  or entry["name"]
              )

              entry["canonical"] = canonical_name

              families[
                  canonical_name
              ].append(
                  entry
              )


          promoted_primaries: list[str] = []
          renumbered_backups: list[
              tuple[str, str]
          ] = []
          metadata_synced = 0

          normalized_master: list[dict] = []

          for canonical_name, members in families.items():
              # Prefer actual primary, otherwise lowest-numbered surviving backup.
              members.sort(
                  key=lambda item: (
                      0
                      if backup_number(
                          item["name"]
                      ) == 0
                      else 1,
                      backup_number(
                          item["name"]
                      ),
                      item["name"].lower(),
                  )
              )

              existing_primary = next(
                  (
                      item
                      for item in members
                      if backup_number(
                          item["name"]
                      ) == 0
                  ),
                  None,
              )

              primary = (
                  existing_primary
                  if existing_primary
                  else members[0]
              )

              if existing_primary is None:
                  promoted_primaries.append(
                      canonical_name
                  )

              old_primary_name = primary["name"]

              primary["name"] = canonical_name
              primary["canonical"] = canonical_name

              if (
                  old_primary_name
                  != primary["name"]
              ):
                  renumbered_backups.append(
                      (
                          old_primary_name,
                          primary["name"],
                      )
                  )


              # ------------------------------------------------------------------------
              # Determine canonical metadata
              # ------------------------------------------------------------------------

              canonical_group = primary.get(
                  "group",
                  "",
              )

              if not canonical_group:
                  canonical_group = next(
                      (
                          member.get(
                              "group",
                              "",
                          )
                          for member in members
                          if member.get(
                              "group",
                              "",
                          )
                      ),
                      "",
                  )

              if not canonical_group:
                  canonical_group = (
                      confident_existing_group(
                          canonical_name
                      )
                      or "Lifestyle"
                  )


              canonical_logo = primary.get(
                  "logo",
                  "",
              )

              if not canonical_logo:
                  canonical_logo = next(
                      (
                          member.get(
                              "logo",
                              "",
                          )
                          for member in members
                          if member.get(
                              "logo",
                              "",
                          )
                      ),
                      "",
                  )


              identity_fields = (
                  "tvg-id",
                  "tvg-language",
                  "tvg-country",
              )

              canonical_attrs: dict[str, str] = {}

              for field in identity_fields:
                  value = primary[
                      "attrs"
                  ].get(
                      field,
                      "",
                  )

                  if not value:
                      value = next(
                          (
                              member[
                                  "attrs"
                              ].get(
                                  field,
                                  "",
                              )
                              for member in members
                              if member[
                                  "attrs"
                              ].get(
                                  field,
                                  "",
                              )
                          ),
                          "",
                      )

                  if value:
                      canonical_attrs[
                          field
                      ] = value


              # ------------------------------------------------------------------------
              # Rebuild ordered family
              # ------------------------------------------------------------------------

              others = [
                  member
                  for member in members
                  if member is not primary
              ]

              others.sort(
                  key=lambda item: (
                      backup_number(
                          item["name"]
                      ),
                      item["name"].lower(),
                  )
              )

              ordered_family = [
                  primary
              ] + others

              for index, member in enumerate(
                  ordered_family
              ):
                  old_name = member["name"]

                  if index == 0:
                      new_name = canonical_name
                  else:
                      new_name = (
                          f"{canonical_name} "
                          f"[Backup {index}]"
                      )

                  if old_name != new_name:
                      renumbered_backups.append(
                          (
                              old_name,
                              new_name,
                          )
                      )

                  member["name"] = new_name
                  member["canonical"] = canonical_name


                  before_group = member.get(
                      "group",
                      "",
                  )

                  before_logo = member.get(
                      "logo",
                      "",
                  )

                  member["group"] = canonical_group
                  member["logo"] = canonical_logo

                  if (
                      before_group != canonical_group
                      or before_logo != canonical_logo
                  ):
                      metadata_synced += 1


                  for field, value in canonical_attrs.items():
                      old_value = member[
                          "attrs"
                      ].get(
                          field,
                          "",
                      )

                      if old_value != value:
                          member[
                              "attrs"
                          ][field] = value

                          metadata_synced += 1


                  normalized_master.append(
                      member
                  )

          master = normalized_master


          # ============================================================================
          # Candidate-state comparison
          #
          # Candidate identity intentionally ignores URL.
          #
          # This prevents a rotating token or source URL from causing a meaningless
          # report commit every day for the same held-back channel.
          # ============================================================================

          candidate_identity = sorted(
              {
                  (
                      normalize(name),
                      group,
                  )
                  for name, group, _url
                  in new_channel_candidates
              }
          )

          candidate_state_data = [
              {
                  "channel": name,
                  "group": group,
              }
              for name, group
              in candidate_identity
          ]

          previous_candidate_state: list[dict] = []

          if CANDIDATE_STATE.exists():
              try:
                  previous_candidate_state = json.loads(
                      CANDIDATE_STATE.read_text(
                          encoding="utf-8",
                      )
                  )

              except (
                  json.JSONDecodeError,
                  OSError,
              ):
                  previous_candidate_state = []

          candidate_changed = (
              previous_candidate_state
              != candidate_state_data
          )


          # ============================================================================
          # Sort final playlist
          # ============================================================================

          rank = {
              group: index
              for index, group
              in enumerate(
                  GROUP_ORDER
              )
          }

          master.sort(
              key=lambda entry: (
                  rank.get(
                      entry["group"],
                      999,
                  ),
                  normalize(
                      entry["canonical"]
                  ),
                  backup_number(
                      entry["name"]
                  ),
                  entry["name"].lower(),
              )
          )


          # ============================================================================
          # Serialize playlist
          # ============================================================================

          output = list(
              master_header
          )

          output += [
              '#PLAYLIST-STUDIO-NAME:"SAEID RAHMAN - IPTV Playlist"',
              "#PLAYLIST-STUDIO-CATEGORIES:"
              + json.dumps(
                  GROUP_ORDER,
                  ensure_ascii=False,
              ),
          ]

          for number, entry in enumerate(
              master,
              1,
          ):
              output.append(
                  serialize_extinf(
                      entry,
                      number,
                  )
              )

              output.extend(
                  entry.get(
                      "extras",
                      [],
                  )
              )

              output.append(
                  entry["url"]
              )

          new_master_text = (
              "\ufeff"
              + "\n".join(output)
              + "\n"
          )


          # Compare content while treating BOM consistently.
          current_compare = (
              original_master_text.lstrip(
                  "\ufeff"
              )
          )

          new_compare = (
              new_master_text.lstrip(
                  "\ufeff"
              )
          )

          playlist_changed = (
              current_compare
              != new_compare
          )


          # ============================================================================
          # Determine whether anything meaningful changed
          # ============================================================================

          meaningful_change = (
              playlist_changed
              or candidate_changed
          )

          if not meaningful_change:
              print(
                  "No playlist changes and no candidate-set "
                  "changes found."
              )

              print(
                  "Nothing will be written or committed."
              )

              raise SystemExit(0)


          # ============================================================================
          # Write changed playlist
          # ============================================================================

          if playlist_changed:
              atomic_write(
                  MASTER,
                  new_master_text,
              )

              print(
                  f"Playlist written: "
                  f"{len(master)} stream entries"
              )

          else:
              print(
                  "Candidate state changed, "
                  "but playlist content did not."
              )


          # ============================================================================
          # Store stable candidate state
          # ============================================================================

          atomic_write(
              CANDIDATE_STATE,
              json.dumps(
                  candidate_state_data,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
          )


          # ============================================================================
          # Statistics
          # ============================================================================

          canonical_channels = len(
              {
                  entry["canonical"]
                  for entry in master
              }
          )

          total_backups = sum(
              1
              for entry in master
              if backup_number(
                  entry["name"]
              ) > 0
          )


          # ============================================================================
          # Report
          # ============================================================================

          now = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          report: list[str] = [
              "# 🤖 IPTV Auto Update",
              "",
              f"Generated: **{now}**",
              "",
              "## Summary",
              "",
              "| Metric | Count |",
              "|---|---:|",
              f"| Final canonical channels | **{canonical_channels}** |",
              f"| Final stream URLs | **{len(master)}** |",
              f"| Final backup streams | **{total_backups}** |",
              f"| New backup streams added | **{len(new_backups)}** |",
              f"| New channels auto-added | **{len(new_channels)}** |",
              f"| New channel candidates held back | **{len(new_channel_candidates)}** |",
              f"| Bad/expired existing entries removed | **{len(cleaned_existing)}** |",
              f"| Existing category corrections | **{len(corrected_groups)}** |",
              f"| Missing primaries promoted | **{len(promoted_primaries)}** |",
              f"| Backup names promoted/renumbered | **{len(renumbered_backups)}** |",
              f"| Family metadata synchronizations | **{metadata_synced}** |",
              f"| Wrapper/proxy URLs resolved | **{proxy_resolved}** |",
              f"| Blocked URLs skipped without replacement | **{blocked_skipped}** |",
              f"| Malformed source URLs skipped | **{malformed_skipped}** |",
              f"| Duplicate URLs removed | **{len(duplicate_removed)}** |",
          ]


          if cleaned_existing:
              report += [
                  "",
                  "## Removed blocked / expired entries",
                  "",
              ]

              for name, url in cleaned_existing:
                  report.append(
                      f"- **{name}** — `{url}`"
                  )


          if corrected_groups:
              report += [
                  "",
                  "## Category corrections",
                  "",
              ]

              for (
                  name,
                  old_group,
                  new_group,
              ) in corrected_groups:
                  report.append(
                      f"- **{name}**: "
                      f"`{old_group}` → `{new_group}`"
                  )


          if promoted_primaries:
              report += [
                  "",
                  "## Promoted backup streams",
                  "",
                  "The original primary stream was no longer available, "
                  "so the first surviving backup was promoted:",
                  "",
              ]

              for channel in promoted_primaries:
                  report.append(
                      f"- **{channel}**"
                  )


          if renumbered_backups:
              report += [
                  "",
                  "## Backup normalization",
                  "",
              ]

              for old_name, new_name in renumbered_backups:
                  if old_name != new_name:
                      report.append(
                          f"- `{old_name}` → `{new_name}`"
                      )


          if new_channels:
              report += [
                  "",
                  "## New channels automatically added",
                  "",
              ]

              for (
                  name,
                  group,
                  url,
              ) in new_channels:
                  report.append(
                      f"- **{name}** "
                      f"(`{group}`) — `{url}`"
                  )


          if new_channel_candidates:
              report += [
                  "",
                  (
                      "## New channel candidates "
                      f"(MAX_NEW_CHANNELS={MAX_NEW_CHANNELS})"
                  ),
                  "",
                  "These channels passed classification and logo checks "
                  "but were not automatically added:",
                  "",
              ]

              for (
                  name,
                  group,
                  url,
              ) in sorted(
                  new_channel_candidates,
                  key=lambda item: (
                      item[1],
                      normalize(
                          item[0]
                      ),
                      item[2],
                  ),
              ):
                  report.append(
                      f"- **{name}** "
                      f"(`{group}`) — `{url}`"
                  )


          if new_backups:
              report += [
                  "",
                  "## New backup streams",
                  "",
              ]

              for name, url in new_backups:
                  report.append(
                      f"- **{name}** — `{url}`"
                  )


          if duplicate_removed:
              report += [
                  "",
                  "## Duplicate stream URLs removed",
                  "",
              ]

              for name, url in duplicate_removed:
                  report.append(
                      f"- **{name}** — `{url}`"
                  )


          report += [
              "",
              "## Safety",
              "",
              f"- Unclassified new channels skipped: **{skipped_unclassified}**",
              f"- New channels without logos skipped: **{skipped_no_logo}**",
              (
                  "- Existing channels already at the new-backup limit "
                  f"({MAX_BACKUPS}) skipped: **{skipped_backup_limit}**"
              ),
              "",
              "> The updater does not delete a stream merely because a "
              "GitHub Actions runner cannot connect to it. This protects "
              "BDIX/local-only streams that may work correctly inside "
              "Bangladesh but fail from GitHub's overseas infrastructure.",
              "",
              "> Existing working streams on domains blocked only for new "
              "additions are retained unless they match the narrower "
              "BLOCKED_EXISTING list or contain a definitely expired signed URL.",
              "",
          ]

          atomic_write(
              REPORT,
              "\n".join(report),
          )


          # ============================================================================
          # Git commit summary output
          # ============================================================================

          summary_parts: list[str] = []

          if new_backups:
              summary_parts.append(
                  f"+{len(new_backups)} backups"
              )

          if new_channels:
              summary_parts.append(
                  f"+{len(new_channels)} channels"
              )

          if cleaned_existing:
              summary_parts.append(
                  f"-{len(cleaned_existing)} expired/bad"
              )

          if duplicate_removed:
              summary_parts.append(
                  f"-{len(duplicate_removed)} dupes"
              )

          if corrected_groups:
              summary_parts.append(
                  f"{len(corrected_groups)} category fixes"
              )

          if promoted_primaries:
              summary_parts.append(
                  f"{len(promoted_primaries)} primary promotions"
              )

          if renumbered_backups:
              summary_parts.append(
                  f"{len(renumbered_backups)} backup normalizations"
              )

          if (
              candidate_changed
              and not playlist_changed
          ):
              summary_parts.append(
                  "candidate list updated"
              )

          if not summary_parts:
              summary_parts.append(
                  "playlist normalized"
              )

          summary = ", ".join(
              summary_parts
          )

          github_output = os.environ.get(
              "GITHUB_OUTPUT"
          )

          if github_output:
              with open(
                  github_output,
                  "a",
                  encoding="utf-8",
              ) as handle:
                  handle.write(
                      f"summary={summary}\n"
                  )

          print(
              f"Done: {summary}"
          )

          PY


      - name: Commit changes
        shell: bash
        env:
          UPDATE_SUMMARY: ${{ steps.updater.outputs.summary }}
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "IPTV Update Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SUMMARY="${UPDATE_SUMMARY:-auto-update}"

          # Commit our generated changes first.
          git commit -m "bot: ${SUMMARY}"

          # If somebody pushed to the same branch while the updater was running,
          # rebase safely. A real conflict will stop the job rather than silently
          # overwriting somebody else's changes.
          git pull --rebase origin "$GITHUB_REF_NAME"

          git push origin "HEAD:$GITHUB_REF_NAME"

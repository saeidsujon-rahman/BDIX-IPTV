name: IPTV Auto Update

on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC = 08:30 Bangladesh time
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-auto-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update playlist
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import socket
          import time
          import unicodedata
          import urllib.error
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import defaultdict
          from copy import deepcopy
          from datetime import datetime, timezone
          from pathlib import Path

          MASTER = Path("IPTV Playlist.m3u")
          REPORT = Path("reports/auto-update.md")
          DEAD_STATE = Path("reports/dead-check-state.json")

          # Conservative dead-stream removal policy.
          # GitHub runners are outside Bangladesh, so timeout/DNS/connect errors,
          # 403/451 responses, and 5xx errors are NOT enough to delete a stream.
          # Only repeated HTTP 404/410 responses count as confirmed-dead.
          DEAD_CONFIRMATIONS = 5
          DEAD_TIMEOUT = 5
          DEAD_WORKERS = 64

          # Do NOT preflight every Adult URL from very large public lists.
          # Only inspect a bounded batch per run; after newly added URLs enter the
          # master playlist, later runs naturally advance to the next candidates.
          # Quality-first Adult expansion: test a small, diverse sample each run.
          MAX_ADULT_PREFLIGHT_CANDIDATES = 40
          ADULT_SOURCE_TIMEOUT = 10
          ADULT_FETCH_WORKERS = 6
          STRICT_HLS_TIMEOUT = 6
          STRICT_HLS_MAX_MANIFEST_BYTES = 256 * 1024
          STRICT_HLS_SEGMENT_PROBE_BYTES = 16 * 1024
          STRICT_HLS_MIN_SEGMENT_BYTES = 4096

          # Prevent one provider/domain/source from flooding the playlist.
          MAX_NEW_ADULT_PER_HOST = 2
          MAX_NEW_ADULT_PER_SOURCE = 4

          # A focused playlist is used for normal candidates. The larger list is lookup-only:
          # it helps replace obvious wrapper/proxy URLs with cleaner underlying URLs.
          MERGE_SOURCE = "https://raw.githubusercontent.com/ahmedstore75/Bdixplaylist/main/playlist.m3u"
          LOOKUP_SOURCE = "https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/main/mixiptvchannel.m3u"

          # Dedicated Adult feeds. A failure in any one source is ignored so that the
          # other feeds and the rest of the updater can continue normally.
          ADULT_SOURCES = (
              # Smaller / more structured source first.
              "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/xxx.m3u8",

              # Large sources are still useful for discovery, but EVERY admitted URL
              # must pass strict live-HLS validation below.
              "https://raw.githubusercontent.com/sacuar/MyIPTV/main/adult.m3u",
              "https://raw.githubusercontent.com/atsushi444/iptv/main/adult.m3u",
          )

          MAX_BACKUPS = 8

          # General new-channel auto-add remains disabled.
          MAX_NEW_CHANNELS = 0

          # Quality matters more than quantity. This is a per-run limit.
          MAX_NEW_ADULT_CHANNELS = 8

          GROUP_ORDER = [
              "Bangladesh",
              "Indian Bangla",
              "Indian Movies",
              "Indian Music",
              "Indian Entertainment",
              "International Movies",
              "International Music",
              "Documentary & Wildlife",
              "Kids",
              "Religious",
              "Sports",
              "Adult",
          ]

          # Exact-name aliases for common source naming differences.
          ALIASES = {
              "bangla vision": "Banglavision",
              "dbc news hd": "DBC News",
              "ekattor hd": "Ekattor TV",
              "channel i hd": "Channel I",
              "news 24 hd": "News 24",
              "star jalsha hd": "Star Jalsha",
              "jalsha movies hd": "Jalsha Movies",
              "zee bangla hd": "Zee Bangla",
              "sony aath": "Sony AATH",
              "sony sports 2 hd": "Sony Ten 2",
              "sony sports 5 hd": "Sony Ten 5",
              "bangla jago": "Bangla Jago TV",
              "accu weather": "AccuWeather Now",
              "cnbc tv 18": "CNBC TV18",
              "cnn hd": "CNN News",
              "dw": "DW News",
              "trace sport": "Trace Sport Stars",
              "music tv": "Kronehit TV",
              "&xplore": "&Xplor HD",
          }

          BLOCKED = (
              "go.skym3u.dev",
              "iptvlive.ahmed-bd-org.workers.dev",
              "iptv-proxy.ahmed-bd-org.workers.dev",
              "filex.me",
              "proxy.php",
              "ottclub.xyz",
              "vercel.app",
          )

          INDIAN_NEWS = (
              "abp", "aaj tak", "india today", "news18", "ndtv", "wion",
              "cnbc", "times now", "republic", "zee news", "tv9 bharat",
          )
          INDIAN_BANGLA = (
              "zee bangla", "star jalsha", "jalsha movies", "sony aath",
              "colors bangla", "sun bangla", "enter 10 bangla", "enterr10 bangla",
              "bangla jago", "republic bangla", "tv9 bangla", "sangeet bangla",
          )
          BANGLADESH_NAMES = (
              "atn bangla", "atn news", "jamuna", "somoy", "ekattor", "dbc",
              "ntv", "rtv", "channel i", "banglavision", "bangla vision",
              "boishakhi", "duronto", "deepto", "maasranga", "independent",
              "news 24", "mohona", "bijoy", "mytv", "desh tv", "asian tv",
              "btv", "ekushey", "channel 24",
          )

          def fetch(url: str) -> str:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "SaeidRahman-IPTV-Updater/1.0"}
              )
              with urllib.request.urlopen(req, timeout=40) as response:
                  return response.read().decode("utf-8-sig", errors="replace")

          def fetch_optional(url: str):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "SaeidRahman-IPTV-Updater/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=ADULT_SOURCE_TIMEOUT) as response:
                      return response.read().decode("utf-8-sig", errors="replace"), None
              except Exception as exc:
                  return "", f"{type(exc).__name__}: {exc}"

          def parse_m3u(text: str):
              entries = []
              current = None
              extras = []
              for raw in text.splitlines():
                  line = raw.strip()
                  if line.startswith("#EXTINF"):
                      attrs = dict(re.findall(r'([\w-]+)="([^"]*)"', line))
                      name = line.rsplit(",", 1)[-1].strip() if "," in line else attrs.get("tvg-name", "")
                      current = {"attrs": attrs, "name": name, "url": None, "extras": []}
                      extras = []
                  elif current and (not line or line.startswith("#")):
                      extras.append(raw)
                  elif current and line:
                      current["url"] = line
                      current["extras"] = extras[:]
                      entries.append(current)
                      current = None
                      extras = []
              return [e for e in entries if e["name"] and e["url"]]

          def strip_backup(name: str) -> str:
              return re.sub(r"\s*\[Backup\s*\d+\]\s*$", "", name, flags=re.I).strip()

          def backup_number(name: str) -> int:
              m = re.search(r"\[Backup\s*(\d+)\]\s*$", name, flags=re.I)
              return int(m.group(1)) if m else 0

          def preferred_name(name: str) -> str:
              clean = strip_backup(name)
              return ALIASES.get(clean.lower(), clean)

          def normalize(name: str) -> str:
              """Unicode-safe channel-name normalization.

              The old [a-z0-9] filter collapsed Chinese/Japanese names to an empty
              string, which could make unrelated channels look like the same channel.
              """
              name = preferred_name(name)
              name = unicodedata.normalize("NFKC", name).casefold().replace("&", " and ")
              name = re.sub(r"\b(fhd|uhd|hd|sd|4k|1080p|720p|576p|520p)\b", " ", name)
              chars = []
              for ch in name:
                  chars.append(ch if ch.isalnum() else " ")
              return " ".join("".join(chars).split())

          def is_blocked(url: str) -> bool:
              low = url.lower()
              if any(x in low for x in BLOCKED):
                  return True

              # Some Ayna URLs carry a Unix-expiry parameter such as ?e=1753741197.
              # If that timestamp is already in the past, never add it as a new backup.
              m = re.search(r"(?:[?&])e=(\d{10})(?:&|$)", url)
              if m:
                  try:
                      if int(m.group(1)) < int(time.time()):
                          return True
                  except ValueError:
                      pass

              return False


          def check_stream(url: str):
              """Return (classification, detail)."""
              if not url.lower().startswith(("http://", "https://")):
                  return "skip", "non-http(s)"

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (PlaylistStudio-IPTV-Updater/5.2)",
                      "Accept": "*/*",
                      "Range": "bytes=0-1023",
                      "Connection": "close",
                  },
              )

              try:
                  with urllib.request.urlopen(req, timeout=DEAD_TIMEOUT) as response:
                      status = getattr(response, "status", 200) or 200
                      if 200 <= status < 400:
                          return "alive", f"HTTP {status}"
                      if status in (401, 403, 405, 451):
                          return "reachable", f"HTTP {status}"
                      if status in (404, 410):
                          return "hard_dead", f"HTTP {status}"
                      return "soft_fail", f"HTTP {status}"

              except urllib.error.HTTPError as exc:
                  status = exc.code
                  if status in (401, 403, 405, 451):
                      return "reachable", f"HTTP {status}"
                  if status in (404, 410):
                      return "hard_dead", f"HTTP {status}"
                  return "soft_fail", f"HTTP {status}"

              except (
                  urllib.error.URLError,
                  TimeoutError,
                  socket.timeout,
                  ConnectionError,
                  OSError,
              ) as exc:
                  return "soft_fail", type(exc).__name__

          def _read_limited(response, limit: int) -> bytes:
              return response.read(limit)

          def _http_probe(url: str, *, max_bytes: int, timeout: int):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (PlaylistStudio-QualityValidator/5.7)",
                      "Accept": "application/vnd.apple.mpegurl,application/x-mpegURL,"
                                "video/MP2T,video/*,*/*;q=0.8",
                      "Connection": "close",
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  status = getattr(response, "status", 200) or 200
                  final_url = response.geturl()
                  content_type = response.headers.get("Content-Type", "")
                  body = _read_limited(response, max_bytes)
                  return status, final_url, content_type, body

          def _manifest_text(url: str):
              try:
                  status, final_url, content_type, body = _http_probe(
                      url,
                      max_bytes=STRICT_HLS_MAX_MANIFEST_BYTES,
                      timeout=STRICT_HLS_TIMEOUT,
                  )
              except urllib.error.HTTPError as exc:
                  return None, None, f"HTTP {exc.code}"
              except Exception as exc:
                  return None, None, type(exc).__name__

              if not (200 <= status < 300):
                  return None, None, f"HTTP {status}"

              text = body.decode("utf-8-sig", errors="replace")
              if "#EXTM3U" not in text[:4096]:
                  return None, None, "HTTP 2xx but not an HLS manifest"

              return final_url, text, "OK"

          def strict_validate_live_hls(url: str):
              """Validate that a NEW Adult candidate looks like a playable LIVE HLS stream.

              A URL is admitted only if:
              1) an HLS manifest is actually returned,
              2) it is not VOD/ended,
              3) a media playlist contains segments, and
              4) one recent segment can return real bytes.
              """
              if not url.lower().startswith(("http://", "https://")):
                  return False, "non-http(s)"

              manifest_url, manifest, reason = _manifest_text(url)
              if manifest is None:
                  return False, reason

              upper = manifest.upper()
              if "#EXT-X-PLAYLIST-TYPE:VOD" in upper or "#EXT-X-ENDLIST" in upper:
                  return False, "VOD/ended playlist"

              media_url = manifest_url
              media = manifest

              # Master playlist: follow a declared variant.
              if "#EXT-X-STREAM-INF" in upper:
                  lines = [line.strip() for line in manifest.splitlines()]
                  variant = None
                  for i, line in enumerate(lines):
                      if line.startswith("#EXT-X-STREAM-INF"):
                          for candidate in lines[i + 1:]:
                              if candidate and not candidate.startswith("#"):
                                  variant = candidate
                                  break
                          if variant:
                              break

                  if not variant:
                      return False, "master playlist has no variant"

                  media_url = urllib.parse.urljoin(manifest_url, variant)
                  media_url, media, reason = _manifest_text(media_url)
                  if media is None:
                      return False, f"variant failed: {reason}"

                  media_upper = media.upper()
                  if (
                      "#EXT-X-PLAYLIST-TYPE:VOD" in media_upper
                      or "#EXT-X-ENDLIST" in media_upper
                  ):
                      return False, "variant is VOD/ended"

              media_lines = [line.strip() for line in media.splitlines()]
              segment_lines = [
                  line
                  for line in media_lines
                  if line and not line.startswith("#")
              ]

              if "#EXTINF" not in media.upper() or len(segment_lines) < 2:
                  return False, "no usable live media segments"

              # Probe the newest listed media segment.
              segment_url = urllib.parse.urljoin(media_url, segment_lines[-1])
              try:
                  status, _, _, segment = _http_probe(
                      segment_url,
                      max_bytes=STRICT_HLS_SEGMENT_PROBE_BYTES,
                      timeout=STRICT_HLS_TIMEOUT,
                  )
              except urllib.error.HTTPError as exc:
                  return False, f"segment HTTP {exc.code}"
              except Exception as exc:
                  return False, f"segment {type(exc).__name__}"

              if not (200 <= status < 300):
                  return False, f"segment HTTP {status}"

              if len(segment) < STRICT_HLS_MIN_SEGMENT_BYTES:
                  return False, f"segment too small ({len(segment)} bytes)"

              return True, f"validated live HLS; segment probe {len(segment)} bytes"

          def adult_name_is_quality_candidate(name: str) -> bool:
              low = name.casefold()
              bad_markers = (
                  " vod",
                  "vod ",
                  "video on demand",
                  "[geo-blocked]",
                  "geo-blocked",
                  "[not 24/7]",
                  "not 24/7",
              )
              return not any(marker in low for marker in bad_markers)

          def adult_metadata_is_usable(entry) -> bool:
              """Require at least some stable metadata for a completely new channel."""
              logo = (entry["attrs"].get("tvg-logo") or "").strip()
              tvg_id = (entry["attrs"].get("tvg-id") or "").strip()
              generic_ids = {"", "usa", "japan", "china", "adult", "xxx"}
              return bool(logo or tvg_id.casefold() not in generic_ids)

          def load_dead_state():
              if not DEAD_STATE.exists():
                  return {}
              try:
                  data = json.loads(DEAD_STATE.read_text(encoding="utf-8"))
                  return data if isinstance(data, dict) else {}
              except Exception:
                  return {}

          def renumber_after_removal(entries):
              """Ensure each surviving channel has one primary + contiguous backups."""
              grouped = defaultdict(list)
              for entry in entries:
                  grouped[entry["canonical"]].append(entry)

              rebuilt = []
              for canonical_name, items in grouped.items():
                  items.sort(
                      key=lambda e: (
                          0 if backup_number(e["name"]) == 0 else 1,
                          backup_number(e["name"]) or 999,
                          e["name"].lower(),
                      )
                  )

                  primary = next(
                      (e for e in items if backup_number(e["name"]) == 0),
                      None,
                  )
                  if primary is None:
                      primary = items[0]

                  primary["name"] = canonical_name
                  rebuilt.append(primary)

                  backups = [e for e in items if e is not primary]
                  backups.sort(
                      key=lambda e: (
                          backup_number(e["name"]) or 999,
                          e["name"].lower(),
                      )
                  )

                  for number, entry in enumerate(backups, 1):
                      entry["name"] = f"{canonical_name} [Backup {number}]"
                      entry["group"] = primary["group"]
                      if primary.get("logo"):
                          entry["logo"] = primary["logo"]
                      rebuilt.append(entry)

              return rebuilt

          def has(text: str, words) -> bool:
              low = text.lower()
              return any(word in low for word in words)

          def guess_group(name: str, source_group: str):
              """Classify only into categories that exist in the current playlist.

              Existing matched channels always inherit their current category, so this
              function is mainly a safeguard if MAX_NEW_CHANNELS is enabled later.
              Unsupported News/Lifestyle source groups are not used to create new groups.
              """
              g = (source_group or "").strip()
              gl = g.lower()
              nl = name.lower()

              # Preserve any category already supported by the current playlist.
              if g in GROUP_ORDER:
                  return g

              # Adult / 18+ content.
              if (
                  "adult" in gl
                  or "xxx" in gl
                  or "erotic" in gl
                  or "18+" in gl
                  or has(
                      nl,
                      (
                          "adult",
                          "xxx",
                          "18+",
                          "playboy",
                          "brazzers",
                          "hustler",
                          "penthouse",
                          "dorcel",
                          "redlight",
                          "private tv",
                          "vivid",
                          "babestation",
                          "sextreme",
                          "erox",
                          "exotica",
                          "hot tv",
                      ),
                  )
              ):
                  return "Adult"

              if "sport" in gl or "sport" in nl or "cricket" in nl:
                  return "Sports"

              if (
                  "kid" in gl
                  or has(nl, ("cartoon", "nick", "disney", "kids", "baby", "pogo"))
              ):
                  return "Kids"

              if (
                  "relig" in gl
                  or has(
                      nl,
                      ("quran", "islam", "peace tv", "aastha", "sanskar", "bhakti"),
                  )
              ):
                  return "Religious"

              if (
                  "document" in gl
                  or has(
                      nl,
                      (
                          "discovery",
                          "nat geo",
                          "animal planet",
                          "history",
                          "wild",
                          "nature",
                      ),
                  )
              ):
                  return "Documentary & Wildlife"

              # Bangladesh channels, including Bangladesh news channels.
              if "bangladesh" in gl or gl in {"bd", "bangladesh tv"}:
                  return "Bangladesh"

              if has(nl, BANGLADESH_NAMES) or has(
                  nl,
                  (
                      "channel 1",
                      "btv news",
                      "btv shangshad",
                      "btv parliament",
                      "sangsad",
                  ),
              ):
                  return "Bangladesh"

              if gl in {"bangla", "bengali"} or "bangla" in gl:
                  if has(nl, INDIAN_BANGLA):
                      return "Indian Bangla"
                  if has(nl, BANGLADESH_NAMES):
                      return "Bangladesh"
                  return None

              if gl in {"india", "indian"}:
                  if has(nl, ("music", "mtv", "9xm", "zoom", "sangeet")):
                      return "Indian Music"
                  if has(nl, ("movie", "cinema", "cineplex", "movies")):
                      return "Indian Movies"

                  # Indian news channels are kept inside the existing broad
                  # Indian Entertainment category because there is no Indian News group.
                  return "Indian Entertainment"

              if "movie" in gl or "cinema" in gl:
                  return "International Movies"

              if "music" in gl:
                  return "International Music"

              # Do not invent categories that the user's current playlist does not have.
              # Backups for existing News/Lifestyle channels still work because they
              # inherit the matched primary channel's existing category.
              if (
                  "news" in gl
                  or "lifestyle" in gl
                  or has(
                      nl,
                      (
                          "news",
                          "cnbc",
                          "cnn",
                          "wion",
                          "dw",
                          "al jazeera",
                          "bloomberg",
                          "fashion",
                          "food",
                          "travel",
                          "lifestyle",
                      ),
                  )
              ):
                  return None

              return None

          def serialize_extinf(entry, chno):
              attrs = dict(entry["attrs"])
              attrs["tvg-name"] = entry["name"]
              attrs["tvg-chno"] = str(chno)
              attrs["group-title"] = entry["group"]
              if entry["logo"]:
                  attrs["tvg-logo"] = entry["logo"]
              else:
                  attrs.pop("tvg-logo", None)

              order = [
                  "tvg-id", "tvg-name", "tvg-logo", "tvg-chno",
                  "tvg-language", "tvg-country", "group-title"
              ]
              parts = []
              for key in order:
                  if attrs.get(key, "") != "":
                      parts.append(f'{key}="{attrs[key]}"')
              for key, value in attrs.items():
                  if key not in order and value != "":
                      parts.append(f'{key}="{value}"')
              return "#EXTINF:-1 " + " ".join(parts) + "," + entry["name"]

          if not MASTER.exists():
              raise SystemExit(f"Master playlist not found: {MASTER}")

          master_raw = parse_m3u(MASTER.read_text(encoding="utf-8-sig", errors="replace"))
          merge_raw = parse_m3u(fetch(MERGE_SOURCE))
          lookup_raw = parse_m3u(fetch(LOOKUP_SOURCE))

          adult_raw = []
          adult_source_stats = []

          # Fetch all Adult feeds in parallel. One slow/dead source can no longer hold
          # the workflow for 40 seconds before the next source is even attempted.
          adult_fetch_results = {}
          with ThreadPoolExecutor(max_workers=ADULT_FETCH_WORKERS) as pool:
              future_to_source = {
                  pool.submit(fetch_optional, adult_source): adult_source
                  for adult_source in ADULT_SOURCES
              }
              for future in as_completed(future_to_source):
                  adult_source = future_to_source[future]
                  try:
                      adult_fetch_results[adult_source] = future.result()
                  except Exception as exc:
                      adult_fetch_results[adult_source] = (
                          "",
                          f"{type(exc).__name__}: {exc}",
                      )

          for adult_source in ADULT_SOURCES:
              body, error = adult_fetch_results.get(
                  adult_source,
                  ("", "No result"),
              )
              if error:
                  adult_source_stats.append((adult_source, 0, error))
                  print(f"Adult source unavailable: {adult_source} — {error}")
                  continue

              parsed = parse_m3u(body)
              adult_source_stats.append((adult_source, len(parsed), "OK"))
              print(f"Adult source loaded: {adult_source} — {len(parsed)} entries")

              # These are dedicated Adult feeds, so force their group to Adult even if
              # the source uses XXX, 18+, NSFW, blank groups, or inconsistent metadata.
              for entry in parsed:
                  x = deepcopy(entry)
                  x["attrs"]["group-title"] = "Adult"
                  x["_adult_source"] = adult_source
                  adult_raw.append(x)

          # One-time/current-state sanitation.
          # This removes only the known bad V1 additions, not general BDIX URLs.
          CURRENT_BAD_PATTERNS = (
              "iptv-proxy.ahmed-bd-org.workers.dev",
              "iptvlive-beta.vercel.app",
          )

          master = []
          cleaned_existing = []
          corrected_groups = []

          for e in master_raw:
              url_low = e["url"].lower()

              # Remove the proxy/Vercel links that slipped in during V1.
              if any(pattern in url_low for pattern in CURRENT_BAD_PATTERNS):
                  cleaned_existing.append((e["name"], e["url"]))
                  continue

              # Remove the obviously expired signed RTV URL that V1 added.
              if (
                  e["name"].strip().lower() == "rtv [backup 5]"
                  and "e=1753741197" in url_low
              ):
                  cleaned_existing.append((e["name"], e["url"]))
                  continue

              x = deepcopy(e)
              x["canonical"] = strip_backup(e["name"])
              x["group"] = e["attrs"].get("group-title", "")
              x["logo"] = e["attrs"].get("tvg-logo", "")

              # Correct V1 Bangladesh channels that were misclassified.
              if strip_backup(e["name"]).lower() in {
                  "channel 1",
                  "btv",
                  "btv news",
                  "bangla 1",
              } and x["group"] != "Bangladesh":
                  corrected_groups.append(
                      (e["name"], x["group"] or "(blank)", "Bangladesh")
                  )
                  x["group"] = "Bangladesh"

              master.append(x)


          # Daily conservative dead-stream scan.
          # A single failure never deletes anything.
          dead_state = load_dead_state()
          old_dead_state_json = json.dumps(dead_state, sort_keys=True)

          scan_results = {}
          unique_master_urls = list(dict.fromkeys(e["url"] for e in master))

          print(
              f"Checking {len(unique_master_urls)} current stream URLs "
              f"for repeated HTTP 404/410..."
          )

          with ThreadPoolExecutor(max_workers=DEAD_WORKERS) as pool:
              future_to_url = {
                  pool.submit(check_stream, url): url
                  for url in unique_master_urls
              }
              for future in as_completed(future_to_url):
                  url = future_to_url[future]
                  try:
                      scan_results[url] = future.result()
                  except Exception as exc:
                      scan_results[url] = (
                          "soft_fail",
                          type(exc).__name__,
                      )

          confirmed_dead_urls = set()
          hard_dead_now = []
          uncertain_failures = 0
          reachable_restricted = 0
          checked_at = datetime.now(timezone.utc).isoformat()

          for url in unique_master_urls:
              classification, detail = scan_results.get(
                  url,
                  ("soft_fail", "no-result"),
              )
              record = dead_state.get(url, {})
              previous_count = int(record.get("hard_dead_count", 0) or 0)

              if classification == "hard_dead":
                  count = previous_count + 1
                  dead_state[url] = {
                      "hard_dead_count": count,
                      "last_result": detail,
                      "last_checked_utc": checked_at,
                  }
                  hard_dead_now.append((url, count, detail))

                  if count >= DEAD_CONFIRMATIONS:
                      confirmed_dead_urls.add(url)

              elif classification in {"alive", "reachable"}:
                  # Any positive/reachable response resets a previous 404/410 streak.
                  dead_state[url] = {
                      "hard_dead_count": 0,
                      "last_result": detail,
                      "last_checked_utc": checked_at,
                  }
                  if classification == "reachable":
                      reachable_restricted += 1

              else:
                  # Timeout, DNS/connect error, 5xx, etc. do not increase the deletion count.
                  uncertain_failures += 1
                  dead_state[url] = {
                      "hard_dead_count": previous_count,
                      "last_result": detail,
                      "last_checked_utc": checked_at,
                  }

          deleted_dead = []
          if confirmed_dead_urls:
              survivors = []
              for e in master:
                  if e["url"] in confirmed_dead_urls:
                      deleted_dead.append((e["name"], e["url"]))
                      dead_state.pop(e["url"], None)
                      continue
                  survivors.append(e)

              master = renumber_after_removal(survivors)

          current_master_urls = {e["url"] for e in master}
          dead_state = {
              url: record
              for url, record in dead_state.items()
              if url in current_master_urls
          }

          DEAD_STATE.parent.mkdir(parents=True, exist_ok=True)
          DEAD_STATE.write_text(
              json.dumps(dead_state, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          dead_state_changed = (
              json.dumps(dead_state, sort_keys=True) != old_dead_state_json
          )

          # Lookup-source index for replacing obvious wrapper URLs.
          lookup = defaultdict(list)
          for e in lookup_raw:
              if not is_blocked(e["url"]):
                  lookup[normalize(e["name"])].append(e)

          candidates = []
          proxy_resolved = 0
          blocked_skipped = 0

          # Normal candidate source.
          for e in merge_raw:
              x = deepcopy(e)
              if is_blocked(x["url"]):
                  replacement = next(iter(lookup.get(normalize(x["name"]), [])), None)
                  if not replacement:
                      blocked_skipped += 1
                      continue
                  x["url"] = replacement["url"]
                  x["extras"] = replacement.get("extras", [])
                  if not x["attrs"].get("tvg-logo"):
                      x["attrs"]["tvg-logo"] = replacement["attrs"].get("tvg-logo", "")
                  proxy_resolved += 1
              candidates.append(x)

          # Adult expansion candidates.
          # 1) Adult entries from the lookup list.
          # 2) All entries from dedicated Adult feeds.
          candidate_urls = {e["url"] for e in candidates}

          for e in lookup_raw:
              if e["url"] in candidate_urls or is_blocked(e["url"]):
                  continue

              name = preferred_name(e["name"])
              group = guess_group(name, e["attrs"].get("group-title", ""))
              if group != "Adult":
                  continue

              x = deepcopy(e)
              x["_adult_source"] = LOOKUP_SOURCE
              candidates.append(x)
              candidate_urls.add(x["url"])

          for e in adult_raw:
              if e["url"] in candidate_urls or is_blocked(e["url"]):
                  continue

              x = deepcopy(e)
              x["attrs"]["group-title"] = "Adult"
              candidates.append(x)
              candidate_urls.add(x["url"])

          canonical = defaultdict(list)
          norm_to_canonical = defaultdict(list)
          for e in master:
              canonical[e["canonical"]].append(e)
              norm_to_canonical[normalize(e["canonical"])].append(e["canonical"])

          existing_urls = {e["url"] for e in master}

          def find_target(source_name):
              wanted = preferred_name(source_name)
              if wanted in canonical:
                  return wanted
              key = normalize(wanted)
              if key:
                  choices = list(dict.fromkeys(norm_to_canonical.get(key, [])))
                  if len(choices) == 1:
                      return choices[0]
              for name in canonical:
                  if name.lower() == wanted.lower():
                      return name
              return None

          # Strict quality preflight for Adult candidates.
          # Includes completely new Adult channels AND potential Adult backups.
          adult_preflight = {}
          adult_candidate_records = []

          for src in candidates:
              url = src["url"]
              if url in existing_urls:
                  continue

              target = find_target(src["name"])
              if target:
                  current = canonical[target]
                  primary = next(
                      (e for e in current if backup_number(e["name"]) == 0),
                      current[0],
                  )
                  if primary.get("group") != "Adult":
                      continue
              else:
                  name = preferred_name(src["name"])
                  group = guess_group(name, src["attrs"].get("group-title", ""))
                  if group != "Adult":
                      continue
                  if not adult_name_is_quality_candidate(name):
                      continue
                  if not adult_metadata_is_usable(src):
                      continue

              adult_candidate_records.append(src)

          # Rotate/scramble candidates by workflow run number so a bad first block in
          # one huge source does not monopolize every run.
          run_seed = os.getenv("GITHUB_RUN_NUMBER", "0")
          adult_candidate_records.sort(
              key=lambda e: hashlib.sha256(
                  (run_seed + "\0" + e["url"]).encode("utf-8", errors="ignore")
              ).hexdigest()
          )

          # Round-robin by source/domain-ish provenance to keep the sample diverse.
          adult_candidate_records = adult_candidate_records[
              :MAX_ADULT_PREFLIGHT_CANDIDATES
          ]

          if adult_candidate_records:
              print(
                  f"Strictly validating {len(adult_candidate_records)} Adult candidates "
                  f"(cap {MAX_ADULT_PREFLIGHT_CANDIDATES})..."
              )
              with ThreadPoolExecutor(max_workers=min(20, DEAD_WORKERS)) as pool:
                  future_to_url = {
                      pool.submit(strict_validate_live_hls, src["url"]): src["url"]
                      for src in adult_candidate_records
                  }
                  for future in as_completed(future_to_url):
                      url = future_to_url[future]
                      try:
                          adult_preflight[url] = future.result()
                      except Exception as exc:
                          adult_preflight[url] = (
                              False,
                              f"validator {type(exc).__name__}",
                          )

          adult_validated_count = sum(
              1 for ok, _ in adult_preflight.values() if ok
          )
          adult_rejected_count = sum(
              1 for ok, _ in adult_preflight.values() if not ok
          )

          new_backups = []
          new_channels = []
          new_adult_channels = []
          skipped_unclassified = 0
          skipped_no_logo = 0
          skipped_backup_limit = 0
          skipped_adult_limit = 0
          skipped_adult_hard_dead = 0
          skipped_adult_quality = 0
          skipped_adult_metadata = 0
          skipped_adult_name = 0
          adult_added_by_source = defaultdict(int)
          adult_added_by_host = defaultdict(int)

          for src in candidates:
              url = src["url"]
              if url in existing_urls:
                  continue

              target = find_target(src["name"])
              if target:
                  current = canonical[target]
                  primary = next((e for e in current if backup_number(e["name"]) == 0), current[0])

                  # Quality gate every NEW Adult backup too.
                  if primary.get("group") == "Adult":
                      if url not in adult_preflight:
                          continue
                      ok, reason = adult_preflight[url]
                      if not ok:
                          skipped_adult_quality += 1
                          continue

                  backup_count = sum(1 for e in current if backup_number(e["name"]) > 0)
                  if backup_count >= MAX_BACKUPS:
                      skipped_backup_limit += 1
                      continue

                  next_num = max(backup_number(e["name"]) for e in current) + 1
                  ne = deepcopy(primary)
                  ne["name"] = f"{target} [Backup {next_num}]"
                  ne["canonical"] = target
                  ne["url"] = url
                  ne["extras"] = deepcopy(src.get("extras", []))
                  ne["logo"] = primary["logo"] or src["attrs"].get("tvg-logo", "")
                  master.append(ne)
                  canonical[target].append(ne)
                  existing_urls.add(url)
                  new_backups.append((ne["name"], url))
                  continue

              name = preferred_name(src["name"])
              group = guess_group(name, src["attrs"].get("group-title", ""))
              if not group:
                  skipped_unclassified += 1
                  continue

              is_adult_new = group == "Adult"

              if is_adult_new:
                  if not adult_name_is_quality_candidate(name):
                      skipped_adult_name += 1
                      continue

                  if not adult_metadata_is_usable(src):
                      skipped_adult_metadata += 1
                      continue

                  # Quality-first: uncertain/403/timeout/non-HLS is NOT enough.
                  # A new Adult URL must positively validate as live HLS.
                  if url not in adult_preflight:
                      continue

                  ok, detail = adult_preflight[url]
                  if not ok:
                      skipped_adult_quality += 1
                      continue

                  if len(new_adult_channels) >= MAX_NEW_ADULT_CHANNELS:
                      skipped_adult_limit += 1
                      continue

                  host = (urllib.parse.urlparse(url).hostname or "").casefold()
                  source_name = src.get("_adult_source", "normal/lookup source")

                  if host and adult_added_by_host[host] >= MAX_NEW_ADULT_PER_HOST:
                      continue
                  if adult_added_by_source[source_name] >= MAX_NEW_ADULT_PER_SOURCE:
                      continue
              else:
                  if len([x for x in new_channels if x[1] != "Adult"]) >= MAX_NEW_CHANNELS:
                      continue

              # New Adult channels may lack a logo only when they have a specific
              # non-generic tvg-id. Other new channels still require a logo.
              logo = src["attrs"].get("tvg-logo", "")
              if not logo and not is_adult_new:
                  skipped_no_logo += 1
                  continue

              ne = {
                  "attrs": deepcopy(src["attrs"]),
                  "name": name,
                  "canonical": name,
                  "url": url,
                  "extras": deepcopy(src.get("extras", [])),
                  "group": group,
                  "logo": logo,
              }
              master.append(ne)
              canonical[name].append(ne)
              norm_to_canonical[normalize(name)].append(name)
              existing_urls.add(url)
              new_channels.append((name, group, url))
              if is_adult_new:
                  source_name = src.get("_adult_source", "normal/lookup source")
                  host = (urllib.parse.urlparse(url).hostname or "").casefold()
                  new_adult_channels.append((name, url))
                  adult_added_by_source[source_name] += 1
                  if host:
                      adult_added_by_host[host] += 1

          if (
              not new_backups
              and not new_channels
              and not cleaned_existing
              and not corrected_groups
              and not deleted_dead
              and not dead_state_changed
          ):
              print(
                  "No new streams, channels, cleanup changes, "
                  "or dead-link state changes found."
              )
              raise SystemExit(0)

          # Defensive URL de-duplication: retain the first occurrence.
          seen = set()
          clean = []
          duplicate_removed = []
          for e in master:
              if e["url"] in seen:
                  duplicate_removed.append((e["name"], e["url"]))
                  continue
              seen.add(e["url"])
              clean.append(e)
          master = clean

          rank = {g: i for i, g in enumerate(GROUP_ORDER)}
          master.sort(
              key=lambda e: (
                  rank.get(e["group"], 999),
                  normalize(e["canonical"]),
                  backup_number(e["name"]),
                  e["name"].lower(),
              )
          )

          output = [
              "#EXTM3U",
              '#PLAYLIST-STUDIO-NAME:"SAEID RAHMAN - IPTV Playlist"',
              "#PLAYLIST-STUDIO-CATEGORIES:" + json.dumps(GROUP_ORDER, ensure_ascii=False),
          ]
          for number, entry in enumerate(master, 1):
              output.append(serialize_extinf(entry, number))
              output.extend(entry.get("extras", []))
              output.append(entry["url"])

          MASTER.write_text("\ufeff" + "\n".join(output) + "\n", encoding="utf-8")

          REPORT.parent.mkdir(parents=True, exist_ok=True)
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          report = [
              "# 🤖 IPTV Auto Update",
              "",
              f"Generated: **{now}**",
              "",
              "## Changes",
              "",
              f"- New backup streams: **{len(new_backups)}**",
              f"- New channels automatically added: **{len(new_channels)}**",
              f"- New Adult channels automatically added: **{len(new_adult_channels)}**",
              f"- Known bad V1 entries removed: **{len(cleaned_existing)}**",
              f"- Existing channel categories corrected: **{len(corrected_groups)}**",
              f"- Wrapper/proxy URLs resolved: **{proxy_resolved}**",
              f"- Blocked/expired URLs skipped without a clean replacement: **{blocked_skipped}**",
              f"- Duplicate URLs removed: **{len(duplicate_removed)}**",
              f"- Confirmed dead streams deleted: **{len(deleted_dead)}**",
              f"- Current HTTP 404/410 results: **{len(hard_dead_now)}**",
              f"- Uncertain remote failures ignored: **{uncertain_failures}**",
              f"- Restricted/reachable responses preserved: **{reachable_restricted}**",
              f"- Supported playlist categories: **{len(GROUP_ORDER)}**",
          ]

          report += [
              "",
              "## Category policy",
              "",
              "- The updater uses only the categories already present in the current playlist:",
              "  " + ", ".join(GROUP_ORDER),
              "- It does not create Indian News, International News, or Lifestyle categories.",
              "- Backups for existing channels inherit the primary channel's current category.",
              f"- Up to {MAX_NEW_ADULT_CHANNELS} new Adult channels may be added automatically per run.",
              f"- Adult expansion scans {len(ADULT_SOURCES)} dedicated Adult feeds plus the existing lookup source.",
              f"- At most {MAX_ADULT_PREFLIGHT_CANDIDATES} Adult candidates are strictly validated per run.",
              "- New Adult streams are accepted only after a real HLS manifest and media segment are fetched successfully.",
              "- VOD, geo-blocked, and explicitly not-24/7 entries are not auto-added.",
              f"- Maximum {MAX_NEW_ADULT_PER_HOST} new Adult channels per host and {MAX_NEW_ADULT_PER_SOURCE} per source per run.",
              "- New Adult entries need a logo or a specific non-generic tvg-id.",
          ]

          if deleted_dead:
              report += ["", "## Confirmed dead streams deleted", ""]
              for name, url in deleted_dead:
                  report.append(
                      f"- Removed **{name}** after {DEAD_CONFIRMATIONS} consecutive "
                      f"HTTP 404/410 checks — {url}"
                  )

          if hard_dead_now:
              report += ["", "## Current 404/410 streaks", ""]
              for url, count, detail in sorted(
                  hard_dead_now,
                  key=lambda x: (-x[1], x[0]),
              ):
                  report.append(
                      f"- `{count}/{DEAD_CONFIRMATIONS}` — {detail} — {url}"
                  )

          if cleaned_existing:
              report += ["", "## Cleaned V1 entries", ""]
              for name, url in cleaned_existing:
                  report.append(f"- Removed **{name}** — {url}")

          if corrected_groups:
              report += ["", "## Category corrections", ""]
              for name, old_group, new_group in corrected_groups:
                  report.append(
                      f"- **{name}**: `{old_group}` → `{new_group}`"
                  )

          if new_channels:
              report += ["", "## New channels", ""]
              for name, group, url in new_channels:
                  report.append(f"- **{name}** — `{group}` — {url}")

          if adult_preflight:
              report += ["", "## Adult quality validation", ""]
              report.append(
                  f"- Strictly tested: **{len(adult_preflight)}**; "
                  f"validated: **{adult_validated_count}**; "
                  f"rejected: **{adult_rejected_count}**."
              )
              rejected_reasons = defaultdict(int)
              for ok, reason in adult_preflight.values():
                  if not ok:
                      rejected_reasons[reason] += 1
              if rejected_reasons:
                  report.append("")
                  report.append("### Rejection reasons")
                  for reason, count in sorted(
                      rejected_reasons.items(),
                      key=lambda item: (-item[1], item[0]),
                  ):
                      report.append(f"- **{count}** — {reason}")

          report += ["", "## Adult expansion sources", ""]
          for source_url, count, status in adult_source_stats:
              if status == "OK":
                  report.append(f"- **Loaded {count} entries** — {source_url}")
              else:
                  report.append(f"- **Unavailable** — {source_url} — `{status}`")

          if new_adult_channels:
              report += ["", "## Adult auto-add", ""]
              report.append(
                  f"- Added {len(new_adult_channels)} new Adult channels "
                  f"(per-run cap: {MAX_NEW_ADULT_CHANNELS})."
              )
              if adult_added_by_source:
                  report.append("")
                  report.append("### New Adult channels by source")
                  for source_name, count in sorted(
                      adult_added_by_source.items(),
                      key=lambda item: (-item[1], item[0]),
                  ):
                      report.append(f"- **{count}** — {source_name}")

          if new_backups:
              report += ["", "## New backup streams", ""]
              for name, url in new_backups:
                  report.append(f"- **{name}** — {url}")

          report += [
              "",
              "## Safety",
              "",
              f"- Unclassified new channels skipped: {skipped_unclassified}",
              f"- Non-Adult new channels without logos skipped: {skipped_no_logo}",
              f"- Adult candidates skipped because daily cap was reached: {skipped_adult_limit}",
              f"- Adult candidates strictly tested this run: **{len(adult_preflight)}** / {MAX_ADULT_PREFLIGHT_CANDIDATES}",
              f"- Adult candidates validated as live HLS: **{adult_validated_count}**",
              f"- Adult candidates rejected by strict validation: **{adult_rejected_count}**",
              f"- Adult additions/backups skipped by quality gate: {skipped_adult_quality}",
              f"- Adult candidates skipped for weak metadata: {skipped_adult_metadata}",
              f"- Adult candidates skipped by name policy (VOD/geo/not-24x7): {skipped_adult_name}",
              f"- Dedicated Adult source feeds configured: {len(ADULT_SOURCES)}",
              f"- Channels already at the backup limit skipped: {skipped_backup_limit}",
              "",
              "> A stream is deleted only after repeated HTTP 404/410 responses. "
              "Timeouts, DNS/connect failures, 401/403/405/451, and other uncertain responses "
              "do not trigger deletion. This reduces false deletion of BDIX, ISP-specific, "
              "geo-restricted, or temporarily unavailable streams.",
              "",
          ]
          REPORT.write_text("\n".join(report), encoding="utf-8")

          print(
              f"Added {len(new_backups)} backup streams, "
              f"{len(new_channels)} new channels; "
              f"removed {len(cleaned_existing)} bad V1 entries, "
              f"deleted {len(deleted_dead)} confirmed-dead streams, and "
              f"corrected {len(corrected_groups)} categories."
          )
          PY

      - name: Commit changes
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "IPTV Update Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "bot: auto-update IPTV playlist"
          git push

name: IPTV Auto Update

on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC = 08:30 Bangladesh time
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # prevent runaway jobs consuming GitHub Actions quota

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update playlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import socket
          import time
          import unicodedata
          import urllib.error
          import urllib.request
          from collections import defaultdict
          from copy import deepcopy
          from datetime import datetime, timezone
          from pathlib import Path

          MASTER = Path("IPTV Playlist.m3u")
          REPORT = Path("reports/auto-update.md")
          SUMMARY_FILE = Path("reports/auto-update-summary.txt")

          MERGE_SOURCE  = "https://raw.githubusercontent.com/ahmedstore75/Bdixplaylist/main/playlist.m3u"
          LOOKUP_SOURCE = "https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/main/mixiptvchannel.m3u"

          MAX_BACKUPS      = 8
          MAX_NEW_CHANNELS = 0

          GROUP_ORDER = [
              "Bangladesh",
              "Indian Bangla",
              "Indian Movies",
              "Indian Music",
              "Indian Entertainment",
              "Indian News",
              "International Movies",
              "International Music",
              "International News",
              "Documentary & Wildlife",
              "Sports",
              "Kids",
              "Religious",
              "Lifestyle",
          ]

          ALIASES = {
              "bangla vision":    "Banglavision",
              "dbc news hd":      "DBC News",
              "ekattor hd":       "Ekattor TV",
              "channel i hd":     "Channel I",
              "news 24 hd":       "News 24",
              "star jalsha hd":   "Star Jalsha",
              "jalsha movies hd": "Jalsha Movies",
              "zee bangla hd":    "Zee Bangla",
              "sony aath":        "Sony AATH",
              "sony sports 2 hd": "Sony Ten 2",
              "sony sports 5 hd": "Sony Ten 5",
              "bangla jago":      "Bangla Jago TV",
              "accu weather":     "AccuWeather Now",
              "cnbc tv 18":       "CNBC TV18",
              "cnn hd":           "CNN News",
              "dw":               "DW News",
              "trace sport":      "Trace Sport Stars",
              "music tv":         "Kronehit TV",
              "&xplore":          "&Xplor HD",
          }

          # Domains blocked from being ADDED as new backups from source playlists.
          BLOCKED_NEW = (
              "go.skym3u.dev",
              "iptvlive.ahmed-bd-org.workers.dev",
              "iptv-proxy.ahmed-bd-org.workers.dev",
              "filex.me",
              "proxy.php",
              "premiumtvs.space",
              "premimum.online",
              "ottclub.xyz",
              "vercel.app",
          )

          # Domains removed from existing entries -- intentionally narrow.
          # Only genuine proxy/wrapper URLs that were never real streams.
          # Paid domains like premiumtvs.space that already stream fine are NOT listed
          # here; they are only blocked from being added as new backups.
          BLOCKED_EXISTING = (
              "iptvlive.ahmed-bd-org.workers.dev",
              "iptv-proxy.ahmed-bd-org.workers.dev",
              "vercel.app",
          )

          INDIAN_NEWS = (
              "abp", "aaj tak", "india today", "news18", "ndtv", "wion",
              "cnbc", "times now", "republic", "zee news", "tv9 bharat",
          )
          INDIAN_BANGLA = (
              "zee bangla", "star jalsha", "jalsha movies", "sony aath",
              "colors bangla", "sun bangla", "enter 10 bangla", "enterr10 bangla",
              "bangla jago", "republic bangla", "tv9 bangla", "sangeet bangla",
          )
          BANGLADESH_NAMES = (
              "atn bangla", "atn news", "jamuna", "somoy", "ekattor", "dbc",
              "ntv", "rtv", "channel i", "banglavision", "bangla vision",
              "boishakhi", "duronto", "deepto", "maasranga", "independent",
              "news 24", "mohona", "bijoy", "mytv", "desh tv", "asian tv",
              "btv", "ekushey", "channel 24",
          )


          # ---------------------------------------------------------------------------
          # Helpers
          # ---------------------------------------------------------------------------

          def fetch(url: str, attempts: int = 3) -> str:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "SaeidRahman-IPTV-Updater/1.0"},
              )
              last_error: Exception | None = None
              for attempt in range(1, attempts + 1):
                  try:
                      with urllib.request.urlopen(req, timeout=40) as resp:
                          text = resp.read().decode("utf-8-sig", errors="replace")
                          print(f"  Fetched {url} ({len(text):,} chars)")
                          return text
                  except (urllib.error.URLError, TimeoutError, OSError, socket.error) as exc:
                      last_error = exc
                      print(f"  Attempt {attempt}/{attempts} failed for {url}: {exc}")
                      if attempt < attempts:
                          time.sleep(5 * attempt)
              raise SystemExit(f"Could not fetch {url} after {attempts} attempts: {last_error}")


          def parse_m3u(text: str) -> list:
              entries: list = []
              current = None
              extras: list = []
              for raw in text.splitlines():
                  line = raw.strip()
                  if line.startswith("#EXTINF"):
                      attrs = dict(re.findall(r'([\w-]+)="([^"]*)"', line))
                      name = line.rsplit(",", 1)[-1].strip() if "," in line else attrs.get("tvg-name", "")
                      current = {"attrs": attrs, "name": name, "url": None, "extras": []}
                      extras = []
                  elif current and (not line or line.startswith("#")):
                      extras.append(raw)
                  elif current and line:
                      current["url"] = line
                      current["extras"] = extras[:]
                      entries.append(current)
                      current = None
                      extras = []
              return [e for e in entries if e["name"] and e["url"]]


          def strip_backup(name: str) -> str:
              return re.sub(r"\s*\[Backup\s*\d+\]\s*$", "", name, flags=re.I).strip()


          def backup_number(name: str) -> int:
              m = re.search(r"\[Backup\s*(\d+)\]\s*$", name, flags=re.I)
              return int(m.group(1)) if m else 0


          def preferred_name(name: str) -> str:
              clean = strip_backup(name)
              return ALIASES.get(clean.lower(), clean)


          def normalize(name: str) -> str:
              name = preferred_name(name)
              name = unicodedata.normalize("NFKD", name).lower().replace("&", "and")
              name = re.sub(r"\b(fhd|uhd|hd|sd|4k|1080p|720p)\b", " ", name)
              name = re.sub(r"[^a-z0-9]+", " ", name)
              return " ".join(name.split())


          def is_blocked(url: str, existing: bool = False) -> bool:
              low = url.lower()
              domains = BLOCKED_EXISTING if existing else BLOCKED_NEW
              if any(x in low for x in domains):
                  return True
              # Ayna signed URLs carry ?e=<unix_timestamp>. Reject if expired.
              m = re.search(r"(?:[?&])e=(\d{10})(?:&|$)", url)
              if m:
                  try:
                      if int(m.group(1)) < int(time.time()):
                          return True
                  except ValueError:
                      pass
              return False


          def has(text: str, words) -> bool:
              low = text.lower()
              return any(word in low for word in words)


          def guess_group(name: str, source_group: str) -> str | None:
              g  = (source_group or "").strip()
              gl = g.lower()
              nl = name.lower()

              if g in GROUP_ORDER:
                  return g
              if "sport" in gl or "sport" in nl or "cricket" in nl:
                  return "Sports"
              if "kid" in gl or has(nl, ("cartoon", "nick", "disney", "kids", "baby", "pogo")):
                  return "Kids"
              if "relig" in gl or has(nl, ("quran", "islam", "peace tv", "aastha", "sanskar", "bhakti")):
                  return "Religious"
              if "document" in gl or has(nl, ("discovery", "nat geo", "animal planet", "history", "wild", "nature")):
                  return "Documentary & Wildlife"
              if "bangladesh" in gl or gl in {"bd", "bangladesh tv"}:
                  return "Bangladesh"
              if has(nl, BANGLADESH_NAMES) or has(nl, ("channel 1", "btv news", "btv shangshad", "btv parliament", "sangsad")):
                  return "Bangladesh"
              if "news" in gl or has(nl, ("news", "cnbc", "cnn", "wion", "dw", "al jazeera", "bloomberg")):
                  return "Indian News" if has(nl, INDIAN_NEWS) else "International News"
              if gl in {"bangla", "bengali"} or "bangla" in gl:
                  if has(nl, INDIAN_BANGLA):
                      return "Indian Bangla"
                  if has(nl, BANGLADESH_NAMES):
                      return "Bangladesh"
                  return None
              if gl in {"india", "indian"}:
                  if has(nl, INDIAN_NEWS):
                      return "Indian News"
                  if has(nl, ("music", "mtv", "9xm", "zoom", "sangeet")):
                      return "Indian Music"
                  if has(nl, ("movie", "cinema", "cineplex", "movies")):
                      return "Indian Movies"
                  return "Indian Entertainment"
              if "movie" in gl or "cinema" in gl:
                  return "International Movies"
              if "music" in gl:
                  return "International Music"
              if "lifestyle" in gl or has(nl, ("fashion", "food", "travel", "lifestyle")):
                  return "Lifestyle"
              return None


          def serialize_extinf(entry: dict, chno: int) -> str:
              attrs = dict(entry["attrs"])
              attrs["tvg-name"]    = entry["name"]
              attrs["tvg-chno"]    = str(chno)
              attrs["group-title"] = entry["group"]
              if entry["logo"]:
                  attrs["tvg-logo"] = entry["logo"]
              else:
                  attrs.pop("tvg-logo", None)

              order = ["tvg-id", "tvg-name", "tvg-logo", "tvg-chno", "tvg-language", "tvg-country", "group-title"]
              parts = [f'{k}="{attrs[k]}"' for k in order if attrs.get(k, "")]
              parts += [f'{k}="{v}"' for k, v in attrs.items() if k not in order and v]
              return "#EXTINF:-1 " + " ".join(parts) + "," + entry["name"]


          def atomic_write(path: Path, text: str) -> None:
              """Write to a temp file then rename -- prevents a corrupt half-written file
              if the process is killed or crashes mid-write."""
              tmp = path.with_suffix(".tmp")
              tmp.write_text(text, encoding="utf-8")
              tmp.replace(path)   # atomic on Linux (same filesystem)


          # ---------------------------------------------------------------------------
          # Main
          # ---------------------------------------------------------------------------

          if not MASTER.exists():
              raise SystemExit(f"Master playlist not found: {MASTER}")

          master_raw = parse_m3u(MASTER.read_text(encoding="utf-8-sig", errors="replace"))
          if not master_raw:
              raise SystemExit(
                  f"Refusing to continue: parsed 0 channels from {MASTER}. "
                  "The file may be empty or corrupted."
              )
          print(f"Master: {len(master_raw)} entries loaded")

          print("Fetching source playlists...")
          merge_raw  = parse_m3u(fetch(MERGE_SOURCE))
          lookup_raw = parse_m3u(fetch(LOOKUP_SOURCE))
          print(f"Merge source: {len(merge_raw)} entries | Lookup source: {len(lookup_raw)} entries")

          # --- Sweep existing entries ---
          master: list         = []
          cleaned_existing:list  = []
          corrected_groups: list = []

          BD_MISCLASSIFIED = {"channel 1", "btv", "btv news", "bangla 1"}

          for e in master_raw:
              # Remove known-dead proxy/wrapper URLs and expired signed links.
              if is_blocked(e["url"], existing=True):
                  cleaned_existing.append((e["name"], e["url"]))
                  continue

              x = deepcopy(e)
              x["canonical"] = strip_backup(e["name"])
              x["group"]     = e["attrs"].get("group-title", "")
              x["logo"]      = e["attrs"].get("tvg-logo", "")

              # Fix historically misclassified Bangladesh channels.
              if strip_backup(e["name"]).lower() in BD_MISCLASSIFIED and x["group"] != "Bangladesh":
                  corrected_groups.append((e["name"], x["group"] or "(blank)", "Bangladesh"))
                  x["group"] = "Bangladesh"

              master.append(x)

          # --- Build lookup index (clean URLs from the larger source) ---
          lookup: dict = defaultdict(list)
          for e in lookup_raw:
              if not is_blocked(e["url"]):
                  lookup[normalize(e["name"])].append(e)

          # --- Resolve / filter merge candidates ---
          candidates:    list = []
          proxy_resolved:int  = 0
          blocked_skipped:int = 0

          for e in merge_raw:
              x = deepcopy(e)
              if is_blocked(x["url"]):
                  replacement = next(iter(lookup.get(normalize(x["name"]), [])), None)
                  if not replacement:
                      blocked_skipped += 1
                      continue
                  x["url"]    = replacement["url"]
                  x["extras"] = replacement.get("extras", [])
                  if not x["attrs"].get("tvg-logo"):
                      x["attrs"]["tvg-logo"] = replacement["attrs"].get("tvg-logo", "")
                  proxy_resolved += 1
              candidates.append(x)

          # --- Build canonical index from surviving master entries ---
          canonical:        dict = defaultdict(list)
          norm_to_canonical:dict = defaultdict(list)
          for e in master:
              canonical[e["canonical"]].append(e)
              norm_to_canonical[normalize(e["canonical"])].append(e["canonical"])

          existing_urls: set = {e["url"] for e in master}


          def find_target(source_name: str) -> str | None:
              wanted = preferred_name(source_name)
              if wanted in canonical:
                  return wanted
              key     = normalize(wanted)
              choices = list(dict.fromkeys(norm_to_canonical.get(key, [])))
              if len(choices) == 1:
                  return choices[0]
              for name in canonical:
                  if name.lower() == wanted.lower():
                      return name
              return None


          new_backups:          list = []
          new_channels:         list = []
          new_channel_candidates:list = []
          skipped_unclassified: int  = 0
          skipped_no_logo:      int  = 0
          skipped_backup_limit: int  = 0

          for src in candidates:
              url = src["url"]
              if url in existing_urls:
                  continue

              target = find_target(src["name"])
              if target:
                  current      = canonical[target]
                  backup_count = sum(1 for e in current if backup_number(e["name"]) > 0)
                  if backup_count >= MAX_BACKUPS:
                      skipped_backup_limit += 1
                      continue

                  primary  = next((e for e in current if backup_number(e["name"]) == 0), current[0])
                  next_num = max(backup_number(e["name"]) for e in current) + 1
                  ne = deepcopy(primary)
                  ne["name"]      = f"{target} [Backup {next_num}]"
                  ne["canonical"] = target
                  ne["url"]       = url
                  ne["extras"]    = deepcopy(src.get("extras", []))
                  ne["logo"]      = primary["logo"] or src["attrs"].get("tvg-logo", "")
                  master.append(ne)
                  canonical[target].append(ne)
                  existing_urls.add(url)
                  new_backups.append((ne["name"], url))
                  continue

              # Classify and logo-check BEFORE the MAX_NEW_CHANNELS gate so counters
              # stay meaningful even when the cap is 0, and qualifying channels appear
              # in the report as candidates for manual review.
              name  = preferred_name(src["name"])
              group = guess_group(name, src["attrs"].get("group-title", ""))
              if not group:
                  skipped_unclassified += 1
                  continue

              logo = src["attrs"].get("tvg-logo", "")
              if not logo:
                  skipped_no_logo += 1
                  continue

              if len(new_channels) >= MAX_NEW_CHANNELS:
                  new_channel_candidates.append((name, group, url))
                  continue

              ne = {
                  "attrs":     deepcopy(src["attrs"]),
                  "name":      name,
                  "canonical": name,
                  "url":       url,
                  "extras":    deepcopy(src.get("extras", [])),
                  "group":     group,
                  "logo":      logo,
              }
              master.append(ne)
              canonical[name].append(ne)
              norm_to_canonical[normalize(name)].append(name)
              existing_urls.add(url)
              new_channels.append((name, group, url))

          # --- Deduplicate (keep first occurrence) -- runs unconditionally ---
          seen:             set  = set()
          clean:            list = []
          duplicate_removed:list = []
          for e in master:
              if e["url"] in seen:
                  duplicate_removed.append((e["name"], e["url"]))
                  continue
              seen.add(e["url"])
              clean.append(e)
          master = clean

          # --- Nothing changed? Exit cleanly without touching the file ---
          if (
              not new_backups
              and not new_channels
              and not new_channel_candidates
              and not cleaned_existing
              and not corrected_groups
              and not duplicate_removed
          ):
              print("No changes found -- playlist untouched.")
              raise SystemExit(0)

          # --- Sort and serialise ---
          rank = {g: i for i, g in enumerate(GROUP_ORDER)}
          master.sort(key=lambda e: (
              rank.get(e["group"], 999),
              normalize(e["canonical"]),
              backup_number(e["name"]),
              e["name"].lower(),
          ))

          output = [
              "#EXTM3U",
              '#PLAYLIST-STUDIO-NAME:"SAEID RAHMAN - IPTV Playlist"',
              "#PLAYLIST-STUDIO-CATEGORIES:" + json.dumps(GROUP_ORDER, ensure_ascii=False),
          ]
          for number, entry in enumerate(master, 1):
              output.append(serialize_extinf(entry, number))
              output.extend(entry.get("extras", []))
              output.append(entry["url"])

          # Atomic write -- safe against mid-write crashes
          atomic_write(MASTER, "\ufeff" + "\n".join(output) + "\n")
          print(f"Playlist written: {len(master)} entries")

          # --- Build report ---
          REPORT.parent.mkdir(parents=True, exist_ok=True)
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          report = [
              "# 🤖 IPTV Auto Update",
              "",
              f"Generated: **{now}**",
              "",
              "## Summary",
              "",
              f"| Metric | Count |",
              f"|--------|-------|",
              f"| New backup streams added | **{len(new_backups)}** |",
              f"| New channels auto-added | **{len(new_channels)}** |",
              f"| New channel candidates (held back) | **{len(new_channel_candidates)}** |",
              f"| Bad/expired entries removed | **{len(cleaned_existing)}** |",
              f"| Category corrections | **{len(corrected_groups)}** |",
              f"| Proxy URLs resolved to clean URLs | **{proxy_resolved}** |",
              f"| Blocked/expired URLs skipped (no replacement) | **{blocked_skipped}** |",
              f"| Duplicate URLs removed | **{len(duplicate_removed)}** |",
          ]

          if cleaned_existing:
              report += ["", "## Removed entries (proxy/expired)", ""]
              for name, url in cleaned_existing:
                  report.append(f"- **{name}** — `{url}`")

          if corrected_groups:
              report += ["", "## Category corrections", ""]
              for name, old_g, new_g in corrected_groups:
                  report.append(f"- **{name}**: `{old_g}` → `{new_g}`")

          if new_channels:
              report += ["", "## New channels added", ""]
              for name, group, url in new_channels:
                  report.append(f"- **{name}** (`{group}`) — `{url}`")

          if new_channel_candidates:
              report += [
                  "",
                  f"## New channel candidates (MAX_NEW_CHANNELS={MAX_NEW_CHANNELS}, not auto-added)",
                  "",
                  "These passed classification and logo checks. "
                  "Raise `MAX_NEW_CHANNELS` or add manually if wanted:",
                  "",
              ]
              for name, group, url in new_channel_candidates:
                  report.append(f"- **{name}** (`{group}`) — `{url}`")

          if new_backups:
              report += ["", "## New backup streams", ""]
              for name, url in new_backups:
                  report.append(f"- **{name}** — `{url}`")

          if duplicate_removed:
              report += ["", "## Duplicate URLs removed", ""]
              for name, url in duplicate_removed:
                  report.append(f"- **{name}** — `{url}`")

          report += [
              "",
              "## Safety notes",
              "",
              f"- Unclassified new channels skipped: {skipped_unclassified}",
              f"- New channels without a logo skipped: {skipped_no_logo}",
              f"- Channels already at the backup limit ({MAX_BACKUPS}) skipped: {skipped_backup_limit}",
              "",
              "> Streams are never removed just because they fail a live network test. "
              "This protects BDIX-only URLs that work in Bangladesh but time-out from GitHub's servers.",
              "",
          ]
          REPORT.write_text("\n".join(report), encoding="utf-8")

          # One-line summary written to a separate file so the commit step can embed it
          # in the commit message without re-parsing the full report.
          summary = (
              f"+{len(new_backups)} backups"
              + (f", +{len(new_channels)} channels" if new_channels else "")
              + (f", -{len(cleaned_existing)} removed" if cleaned_existing else "")
              + (f", -{len(duplicate_removed)} dupes" if duplicate_removed else "")
              + (f", {len(corrected_groups)} category fixes" if corrected_groups else "")
          )
          SUMMARY_FILE.write_text(summary, encoding="utf-8")

          print(f"Done. {summary}")
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Read the one-line summary the Python script wrote, fall back gracefully.
          SUMMARY=$(cat reports/auto-update-summary.txt 2>/dev/null || echo "auto-update")

          git config user.name  "IPTV Update Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull any concurrent push before committing to avoid rejection.
          git pull --rebase --autostash origin HEAD

          git commit -m "bot: ${SUMMARY}"
          git push

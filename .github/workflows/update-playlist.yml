name: IPTV Auto Update

on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC = 08:30 Bangladesh time
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update playlist
        id: updater
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'

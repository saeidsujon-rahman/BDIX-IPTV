name: IPTV Auto Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-playlist.yml'
      - 'scripts/sync_logos.py'
      - 'IPTV Playlist.m3u'
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

concurrency:
  group: iptv-playlist-and-epg
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTO_COMMIT: 'true'
      MAX_WORKERS: '20'
      STREAM_TIMEOUT: '5'
      SOURCE_TIMEOUT: '20'
      SOURCE_MAX_BYTES: '8388608'
      MAX_CANDIDATES: '1200'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate and build playlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import urllib.request
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from copy import deepcopy
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import parse_qsl, unquote, urlsplit, urlunsplit

          MASTER = Path('IPTV Playlist.m3u')
          REPORT = Path('reports/auto-update.md')
          SOURCE_URLS = [
              'https://raw.githubusercontent.com/ahmedstore75/Bdixplaylist/main/playlist.m3u',
              'https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/main/mixiptvchannel.m3u',
              'https://raw.githubusercontent.com/abusaeeidx/Mrgify-BDIX-IPTV/main/playlist.m3u',
              'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/bd.m3u',
          ]
          GROUPS = [
              'Bangladesh', 'Bangladesh Backup',
              'Indian Bangla', 'Indian Movies', 'Indian Music',
              'Indian Entertainment', 'International Movies', 'International Music',
              'Documentary & Wildlife', 'Kids', 'Religious', 'Sports',
          ]

          MAX_WORKERS = max(1, min(int(os.getenv('MAX_WORKERS', '20')), 32))
          STREAM_TIMEOUT = max(2, min(int(os.getenv('STREAM_TIMEOUT', '5')), 15))
          SOURCE_TIMEOUT = max(5, min(int(os.getenv('SOURCE_TIMEOUT', '20')), 60))
          SOURCE_MAX_BYTES = max(1_048_576, int(os.getenv('SOURCE_MAX_BYTES', '8388608')))
          MAX_CANDIDATES = max(100, int(os.getenv('MAX_CANDIDATES', '1200')))

          # Deliberately conservative: expand only after manual review.
          MAJOR = {
              'sports': {'espn', 'star sports', 'sony ten', 'sony liv', 't sports',
                         'bein sports', 'sky sports', 'eurosport', 'ptv sports',
                         'ten cricket', 'fox sports', 'nba tv', 'nfl network',
                         'tsn', 'tnt sports', 'premier sports'},
              'indian entertainment': {'star plus', 'sony entertainment television',
                         'colors', 'zee tv', 'sony sab', '&tv', 'dangal',
                         'and pictures', 'sony pal', 'colors rishtey'},
              'documentary & wildlife': {'discovery', 'national geographic',
                         'nat geo wild', 'animal planet', 'history', 'bbc earth',
                         'travel xp', 'docubay', 'smithsonian'},
              'kids': {'cartoon network', 'nick', 'nick jr', 'sonic', 'disney',
                       'disney junior', 'disney xd', 'hungama', 'pogo',
                       'discovery kids', 'pbs kids', 'boomerang'},
          }
          BD = {'ananda tv','asian tv','atn bangla','atn news','banglavision',
                'bijoy tv','boishakhi tv','btv','channel i','channel 24',
                'dbc news','deepto tv','desh tv','doyel tv','duronto tv',
                'ekattor tv','ekhon tv','ekushey tv','gazi tv','jamuna tv',
                'maasranga tv','mohona tv','my tv','nagorik tv','news 24',
                'ntv','rtv','somoy tv','t sports','independent tv'}
          IN_BANGLA = {'zee bangla','star jalsha','jalsha movies','sony aath',
                       'colors bangla','sun bangla','sangeet bangla','tv9 bangla'}
          FOREIGN_NEWS = re.compile(
              r'\b(?:news|abp|aaj tak|bbc|cnbc|cnn|dd news|dw|ndtv|news18|'
              r'republic|sky news|times now|trt world|tv9|wion|zee news|'
              r'zee 24 ghanta|24 ghanta|kolkata tv|calcutta news|r plus|'
              r'taaza tv|india tv|india today|news time bangla|bharat 24|'
              r'good news today|gnt|news nation|india ahead|et now|mirror now)\b',
              re.I,
          )

          def is_foreign_news(name):
              channel = norm(name)
              return channel not in BD and bool(FOREIGN_NEWS.search(channel))
          BLOCKED = ('adult', 'porn', 'xxx', 'proxy', 'filex.me', 'vercel.app')

          def attrs(text):
              return dict(re.findall(r'''([\w-]+)="([^"]*)"''', text))

          def parse(text):
              entries = []
              pending = None
              for raw_line in text.splitlines():
                  line = raw_line.strip()
                  if line.startswith('#EXTINF:'):
                      if pending and pending.get('url'):
                          entries.append(pending)
                      if ',' not in line:
                          pending = None
                          continue
                      left, name = line.rsplit(',', 1)
                      pending = {'attrs': attrs(left), 'name': name.strip(), 'extras': []}
                  elif pending and line and not line.startswith('#'):
                      pending['url'] = line
                      entries.append(pending)
                      pending = None
                  elif pending and line.startswith('#'):
                      pending['extras'].append(line)
              if pending and pending.get('url'):
                  entries.append(pending)
              return entries

          def norm(value):
              value = re.sub(r'\s*\[(?:backup\s*\d+|primary)\]\s*$', '', value, flags=re.I)
              return re.sub(r'[^a-z0-9]+', ' ', value.casefold()).strip()

          def base(value):
              return re.sub(r'\s*\[backup\s*\d+\]\s*$', '', value, flags=re.I).strip()

          def is_backup(value):
              return bool(re.search(r'\[backup\s*\d+\]$', value, re.I))

          def canonical_url(value):
              try:
                  parsed = urlsplit(value.strip())
                  host = (parsed.hostname or '').lower().rstrip('.')
                  port = parsed.port
                  if (parsed.scheme.lower() == 'http' and port == 80) or (
                      parsed.scheme.lower() == 'https' and port == 443
                  ):
                      netloc = host
                  else:
                      netloc = parsed.netloc.lower()
                  return urlunsplit((parsed.scheme.lower(), netloc, parsed.path, parsed.query, ''))
              except ValueError:
                  return value.strip()

          # Stream policy applies before both primary and backup admission.
          def blocked_stream_reason(entry):
              url = entry.get('url', '').strip()
              try:
                  parsed = urlsplit(url)
                  host = (parsed.hostname or '').lower().rstrip('.')
                  if parsed.scheme.lower() not in {'http', 'https'} or not host:
                      return 'invalid or unsupported stream URL'
                  if parsed.username or parsed.password:
                      return 'credential-wrapped URL'
                  blocked_hosts = (
                      'workers.dev', 'pages.dev', 'vercel.app', 'netlify.app',
                      'filex.me', 'tinyurl.com', 'bit.ly', 't.co', 'shorturl.at',
                      'go.skym3u.dev',
                  )
                  if any(host == item or host.endswith('.' + item) for item in blocked_hosts):
                      return 'proxy/masking or URL-shortener host'
                  if any('proxy' in label for label in host.split('.')):
                      return 'proxy hostname'
                  path = unquote(parsed.path).lower()
                  if re.search(
                      r'(?:^|/)(?:proxy|redirect|decrypt|encrypt|decode|encode)(?:[./_-]|$)',
                      path,
                  ):
                      return 'proxy/encoded wrapper path'
                  if re.search(r'\.(?:php|asp|aspx)(?:/|$)', path):
                      return 'dynamic stream wrapper'
                  wrapped_keys = {
                      'url', 'uri', 'redirect', 'redirect_url', 'target', 'destination',
                      'encoded', 'encrypted', 'payload', 'play_token', 'license',
                      'license_key', 'drm',
                  }
                  if any(key.lower() in wrapped_keys for key, _ in parse_qsl(parsed.query, keep_blank_values=True)):
                      return 'wrapped destination or access/license parameter'
                  extras = '\n'.join(entry.get('extras', []))
                  if re.search(r'(?i)(?:license_type|license_key|widevine|playready|clearkey|drm)', extras):
                      return 'explicit DRM/license configuration'
              except ValueError:
                  return 'malformed URL'
              return ''

          def classify(name, supplied=''):
              channel = norm(name)
              supplied_group = norm(supplied)
              if any(item in channel for item in BLOCKED):
                  return None
              if is_foreign_news(channel):
                  return None
              if channel in BD:
                  return 'Bangladesh'
              if channel in IN_BANGLA:
                  return 'Indian Bangla'
              for group, tokens in MAJOR.items():
                  if any(token in channel for token in tokens):
                      return group.title() if group != 'kids' else 'Kids'
              allowed = {norm(group): group for group in GROUPS}
              if supplied_group in allowed and supplied_group not in {'adult', 'news'}:
                  return allowed[supplied_group]
              return None

          def fetch_source(source):
              started = time.monotonic()
              try:
                  request = urllib.request.Request(source, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=SOURCE_TIMEOUT) as response:
                      payload = response.read(SOURCE_MAX_BYTES + 1)
                  if len(payload) > SOURCE_MAX_BYTES:
                      return source, [], 'source exceeds size limit', time.monotonic() - started
                  entries = parse(payload.decode('utf-8', 'replace'))
                  for entry in entries:
                      entry['_source'] = source
                  return source, entries, '', time.monotonic() - started
              except Exception as exc:
                  return source, [], f'{type(exc).__name__}: {exc}', time.monotonic() - started

          def parse_sources():
              results = {}
              workers = min(MAX_WORKERS, max(1, len(SOURCE_URLS)))
              with ThreadPoolExecutor(max_workers=workers) as executor:
                  futures = {executor.submit(fetch_source, source): source for source in SOURCE_URLS}
                  for future in as_completed(futures):
                      source, entries, error, elapsed = future.result()
                      results[source] = (entries, error, elapsed)
              combined = []
              for source in SOURCE_URLS:
                  combined.extend(results.get(source, ([], 'missing result', 0))[0])
              return combined, results

          def stream_check(entry):
              url = entry['url']
              started = time.monotonic()
              try:
                  request = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'Mozilla/5.0', 'Range': 'bytes=0-2047'},
                  )
                  with urllib.request.urlopen(request, timeout=STREAM_TIMEOUT) as response:
                      status = getattr(response, 'status', 200)
                      final_url = response.geturl()
                      content_type = (response.headers.get('Content-Type') or '').lower()
                      payload = response.read(2048)
                  if status >= 400:
                      return False, f'HTTP {status}', time.monotonic() - started
                  redirect_reason = blocked_stream_reason({'url': final_url, 'extras': []})
                  if redirect_reason:
                      return False, f'redirected to {redirect_reason}', time.monotonic() - started
                  if not payload:
                      return False, 'empty response', time.monotonic() - started
                  sample = payload.lstrip().lower()
                  if sample.startswith(b'<!doctype html') or sample.startswith(b'<html'):
                      return False, 'HTML response', time.monotonic() - started
                  manifest = payload.lstrip().startswith(b'#EXTM3U')
                  transport_stream = payload[:1] == b'\x47'
                  media_segment = payload.startswith(b'ID3') or b'ftyp' in payload[:64]
                  media_type = any(token in content_type for token in (
                      'mpegurl', 'video/', 'audio/', 'mp2t', 'octet-stream'
                  ))
                  if not (manifest or transport_stream or media_segment or media_type):
                      return False, f'unrecognized content type: {content_type or "missing"}', time.monotonic() - started
                  return True, f'HTTP {status}', time.monotonic() - started
              except Exception as exc:
                  return False, f'{type(exc).__name__}: {exc}', time.monotonic() - started

          def serialize(entry, number):
              metadata = deepcopy(entry['attrs'])
              metadata.pop('nexus-score', None)
              metadata['tvg-name'] = entry['name']
              metadata['group-title'] = entry['group']
              metadata['tvg-chno'] = str(number)
              if entry.get('logo'):
                  metadata['tvg-logo'] = entry['logo']
              metadata.setdefault(
                  'tvg-id',
                  'local.' + re.sub(r'[^a-z0-9]+', '-', norm(entry['name'])).strip('-'),
              )
              order = [
                  'tvg-id', 'tvg-name', 'tvg-logo', 'tvg-chno', 'channel-id',
                  'tvg-language', 'tvg-country',
              ]
              remainder = [key for key in metadata if key not in order and key != 'group-title']
              ordered = order + remainder + ['group-title']
              tail = ' '.join(
                  f'{key}="{metadata[key]}"' for key in ordered if metadata.get(key, '') != ''
              )
              return f'#EXTINF:-1 {tail},{entry["name"]}'

          master_text = MASTER.read_text(encoding='utf-8-sig')
          current_header = next(
              (line for line in master_text.splitlines() if line.startswith('#EXTM3U')),
              '#EXTM3U',
          )
          existing = parse(master_text)
          canonical = defaultdict(list)
          used = set()
          duplicates = 0
          removed_foreign_news = []
          for entry in existing:
              url_key = canonical_url(entry.get('url', ''))
              if not url_key or url_key in used:
                  duplicates += 1
                  continue
              entry['canonical'] = base(entry['name'])
              if is_foreign_news(entry['canonical']):
                  removed_foreign_news.append((entry['canonical'], entry.get('url', '')))
                  continue
              used.add(url_key)
              supplied_group = entry['attrs'].get('group-title', '')
              entry['group'] = (
                  supplied_group if supplied_group == 'Bangladesh Backup'
                  else classify(entry['canonical'], supplied_group) or supplied_group or 'Bangladesh'
              )
              canonical[norm(entry['canonical'])].append(entry)

          source_entries, source_results = parse_sources()
          blocked_imports = []
          rejected_names = []
          skipped_duplicates = 0
          skipped_limits = 0
          seen_candidates = set()
          staged_per_name = defaultdict(int)
          candidates = []

          # Pre-filter before any network validation. Existing-name backups receive
          # priority, followed by eligible new channels with logos.
          for source_entry in source_entries:
              url = source_entry.get('url', '').strip()
              url_key = canonical_url(url)
              name = base(source_entry.get('name', ''))
              if not url or not url_key or url_key in used or url_key in seen_candidates:
                  skipped_duplicates += 1
                  continue
              seen_candidates.add(url_key)
              reason = blocked_stream_reason(source_entry)
              if reason:
                  blocked_imports.append((name, url, reason))
                  continue
              key = norm(name)
              target = canonical.get(key, [])
              if target:
                  primary = target[0]
                  limit = 4 if primary['group'] in {'Bangladesh', 'Bangladesh Backup'} else 2
                  available = max(0, limit - (len(target) - 1))
                  # Test a small reserve so a dead first candidate does not prevent
                  # a later working backup from being considered.
                  if available == 0 or staged_per_name[key] >= available * 3:
                      skipped_limits += 1
                      continue
                  staged_per_name[key] += 1
                  candidates.append((0, source_entry, key, 'backup'))
                  continue
              group = classify(name, source_entry.get('attrs', {}).get('group-title', ''))
              logo = source_entry.get('attrs', {}).get('tvg-logo', '').strip()
              if not group or not logo:
                  rejected_names.append((name, source_entry.get('attrs', {}).get('group-title', ''), url))
                  continue
              candidates.append((1, source_entry, key, 'new'))

          candidates.sort(key=lambda item: item[0])
          truncated_candidates = max(0, len(candidates) - MAX_CANDIDATES)
          candidates = candidates[:MAX_CANDIDATES]

          checks = {}
          check_started = time.monotonic()
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              future_map = {
                  executor.submit(stream_check, entry): canonical_url(entry['url'])
                  for _, entry, _, _ in candidates
              }
              for future in as_completed(future_map):
                  checks[future_map[future]] = future.result()
          check_elapsed = time.monotonic() - check_started

          added_backups = []
          added_channels = []
          dead_imports = []
          for _, source_entry, key, original_kind in candidates:
              url = source_entry['url'].strip()
              url_key = canonical_url(url)
              live, result, elapsed = checks[url_key]
              if not live:
                  dead_imports.append((base(source_entry.get('name', '')), url, result))
                  continue

              # Re-evaluate membership after earlier candidates have been admitted.
              # This turns a second URL for a newly added channel into a backup.
              name = base(source_entry.get('name', ''))
              target = canonical.get(key, [])
              if target:
                  primary = target[0]
                  group = primary['group']
                  limit = 4 if group in {'Bangladesh', 'Bangladesh Backup'} else 2
                  if len(target) - 1 >= limit:
                      skipped_limits += 1
                      continue
                  number = len(target)
                  entry = deepcopy(primary)
                  entry['name'] = f'{primary["canonical"]} [Backup {number}]'
                  entry['url'] = url
                  entry['extras'] = deepcopy(source_entry.get('extras', []))
                  entry['group'] = 'Bangladesh Backup' if group == 'Bangladesh' else group
                  target.append(entry)
                  used.add(url_key)
                  added_backups.append((entry['name'], entry['group'], url))
                  continue

              group = classify(name, source_entry.get('attrs', {}).get('group-title', ''))
              logo = source_entry.get('attrs', {}).get('tvg-logo', '').strip()
              if not group or not logo:
                  rejected_names.append((name, source_entry.get('attrs', {}).get('group-title', ''), url))
                  continue
              if group == 'Bangladesh':
                  group = 'Bangladesh Backup'
              entry = {
                  'attrs': deepcopy(source_entry['attrs']),
                  'name': name,
                  'canonical': name,
                  'url': url,
                  'extras': deepcopy(source_entry.get('extras', [])),
                  'group': group,
              }
              canonical[key].append(entry)
              used.add(url_key)
              added_channels.append((name, group, url))

          final = [entry for bucket in canonical.values() for entry in bucket]
          rank = {group: index for index, group in enumerate(GROUPS)}
          final.sort(key=lambda entry: (
              rank.get(entry['group'], 999),
              norm(entry['canonical']),
              0 if not is_backup(entry['name']) else int(re.search(r'\d+', entry['name']).group()),
              norm(entry['name']),
          ))

          output = [
              current_header,
              '#PLAYLIST-STUDIO-NAME:"SAEID RAHMAN - IPTV Playlist"',
              '#PLAYLIST-STUDIO-CATEGORIES:' + json.dumps(GROUPS),
          ]
          for number, entry in enumerate(final, 1):
              output += [serialize(entry, number), *entry.get('extras', []), entry['url']]
          MASTER.write_text('\ufeff' + '\n'.join(output) + '\n', encoding='utf-8')

          REPORT.parent.mkdir(exist_ok=True)
          totals = defaultdict(int)
          for entry in final:
              totals[entry['group']] += 1

          lines = [
              '# IPTV Auto Update', '',
              f'Generated: **{datetime.now(timezone.utc).isoformat()}**', '',
              '## Summary', '',
              f'- Final playlist entries: **{len(final)}**',
              f'- New primary channels: **{len(added_channels)}**',
              f'- New backup streams: **{len(added_backups)}**',
              f'- Duplicate URLs removed from master: **{duplicates}**',
              f'- Non-Bangladeshi news entries removed: **{len(removed_foreign_news)}**',
              f'- Duplicate source candidates skipped: **{skipped_duplicates}**',
              f'- Candidates blocked before testing: **{len(blocked_imports)}**',
              f'- Candidates tested concurrently: **{len(candidates)}**',
              f'- Dead/invalid responses: **{len(dead_imports)}**',
              f'- Candidates skipped by backup limits: **{skipped_limits}**',
              f'- Candidates omitted by safety cap: **{truncated_candidates}**',
              f'- Stream-check workers: **{MAX_WORKERS}**',
              f'- Parallel stream-check time: **{check_elapsed:.1f}s**', '',
              '## Source status', '',
          ]
          for source in SOURCE_URLS:
              entries, error, elapsed = source_results.get(source, ([], 'missing result', 0))
              status = error or 'OK'
              lines.append(f'- **{source}** — {len(entries)} entries — {elapsed:.1f}s — {status}')
          lines += ['', '## Category totals', '']
          lines += [f'- **{group}**: {totals[group]}' for group in GROUPS]
          lines += ['', '## Removed non-Bangladeshi news channels', '']
          lines += [f'- **{name}** — {url}' for name, url in removed_foreign_news] or ['- None']
          lines += ['', '## New primary channels', '']
          lines += [f'- **{name}** — `{group}` — {url}' for name, group, url in added_channels] or ['- None']
          lines += ['', '## New backup streams', '']
          lines += [f'- **{name}** — `{group}` — {url}' for name, group, url in added_backups] or ['- None']
          lines += ['', '## Blocked stream imports', '']
          lines += [f'- **{name}** — {reason} — {url}' for name, url, reason in blocked_imports] or ['- None']
          lines += ['', '## Dead or invalid stream imports', '']
          lines += [f'- **{name}** — {reason} — {url}' for name, url, reason in dead_imports] or ['- None']
          lines += ['', '## Rejected candidates', '']
          lines += [f'- **{name}** — source group `{group}` — {url}' for name, group, url in rejected_names] or ['- None']
          lines += [
              '', '## Policy', '',
              '- Existing membership is authoritative.',
              '- Candidate identity uses exact normalized base names; fuzzy matching is not used.',
              '- New candidates require an approved category and a logo.',
              '- Non-Bangladeshi news channels are rejected from both existing and imported entries.',
              '- New Bangladeshi channels and backups are placed in `Bangladesh Backup`.',
              '- Proxy/masking hosts, wrappers, redirects to blocked hosts and explicit DRM settings are rejected.',
              '- Only media-like responses are accepted; HTML and empty responses are rejected.',
              '- Existing entries are preserved; a point-in-time URL check cannot guarantee continuous playback.',
          ]
          REPORT.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Apply repository-first logos with external fallback
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_logos.py

      - name: Commit only when explicitly enabled
        if: env.AUTO_COMMIT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IPTV Update Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 'IPTV Playlist.m3u' reports/auto-update.md
          if ! git diff --cached --quiet; then
            git commit -m 'bot: auto-update IPTV playlist'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

name: Playlist Update

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Dhaka'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/migrate_external_logos.py'
      - 'scripts/fix_selected_logos.py'

permissions:
  contents: write

# Serialize every workflow that writes to main.
concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install logo conversion tools
        run: python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Discover new and backup streams
        if: github.event_name != 'push'
        run: python scripts/update_playlist.py

      - name: Migrate external channel logos
        run: python scripts/migrate_external_logos.py

      - name: Repair selected channel logos
        run: |
          if [ -f scripts/fix_selected_logos.py ]; then
            python scripts/fix_selected_logos.py
          fi

      - name: Commit playlist, logo, and report changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "IPTV Playlist.m3u" "reports/auto-update.md" "reports/logo-migration.md" "logos"; then
            echo "No playlist, logo, or report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "IPTV Playlist.m3u" "reports/auto-update.md" "reports/logo-migration.md" "logos"
          git commit -m "Update playlist, logos, and reports"
          git push origin HEAD:main

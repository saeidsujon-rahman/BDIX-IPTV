name: Backup Stream Health Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-health-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test Backup streams
        run: python scripts/audit_backup_streams.py
      - name: Commit confirmed dead removals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "IPTV Playlist.m3u" "reports/backup-health-report.md"
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          # Rebase first so a long-running audit cannot overwrite newer playlist edits.
          git fetch origin main
          git rebase origin/main || {
            # The report is generated output; prefer this run's fresh report on conflict.
            if git diff --name-only --diff-filter=U | grep -qx "reports/backup-health-report.md"; then
              git checkout --theirs reports/backup-health-report.md
              git add reports/backup-health-report.md
            fi
            # Never auto-resolve a playlist conflict: abort safely instead.
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Playlist changed incompatibly during audit; aborting push safely."
              git rebase --abort
              exit 0
            fi
            GIT_EDITOR=true git rebase --continue
          }
          git push

name: Backup Stream Health Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_backup_streams.py'

permissions:
  contents: write

concurrency:
  group: backup-health-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test Backup streams
        run: python scripts/audit_backup_streams.py
      - name: Commit confirmed dead removals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "IPTV Playlist.m3u" "backup-health-report.md"
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Remove confirmed dead backup streams"
          git pull --rebase origin main
          git push
